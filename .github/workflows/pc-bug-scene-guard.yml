name: pc-bug-scene-guard

on:
  pull_request:
    paths:
      - 'public/akke/personal-wechat-pc-bugs.html'
      - 'public/akke/personal-wechat-pc-bug-guide.js'
      - 'public/akke/personal-wechat-pc-bug-status.json'
      - 'tools/check-pc-bug-scenes.mjs'
      - 'tools/check-pc-bug-status.mjs'
      - 'docs/runbooks/pc-bug-verification-*.md'
      - '.github/workflows/pc-bug-scene-guard.yml'
  push:
    branches: [main]
    paths:
      - 'public/akke/personal-wechat-pc-bugs.html'
      - 'public/akke/personal-wechat-pc-bug-guide.js'
      - 'public/akke/personal-wechat-pc-bug-status.json'
      - 'tools/check-pc-bug-scenes.mjs'
      - 'tools/check-pc-bug-status.mjs'
      - 'docs/runbooks/pc-bug-verification-*.md'
      - '.github/workflows/pc-bug-scene-guard.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查新 Bug 的微信场景还原
        run: node tools/check-pc-bug-scenes.mjs --self-test
      - name: 检查独立检验状态与编号
        run: node tools/check-pc-bug-status.mjs --self-test
