name: kb-index

# 首页与 /timeline 的排序全靠页面日期。Vercel 是浅克隆、构建时拿不到 git 历史，
# 新页面(尤其 akke-bot 同步来的)没写 upio:date 时只能靠提交在仓里的日期缓存。
# push 到 main:用完整历史补齐两份日期缓存(只补缺、不覆盖),有变动就提交回 main
#   (GITHUB_TOKEN 推的提交不会再触发 workflow,不会循环;Vercel 照常部署),再跑回归检查。
# PR:只构建 + 检查,不写仓。检查失败是事后标红,不阻断发布,看到红了回来处理。
on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/**']
  pull_request:
    paths: ['public/**', 'scripts/**']

concurrency:
  group: kb-index-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REFRESH_DATES 要用 git log 取每页首次入仓日期

      # push:每轮都对齐最新 main 再补日期并提交,推不上(akke-bot 抢先)就重来一轮——不用 rebase,
      #   上游新推的页也会在下一轮一起补上,构建 / 检查跑的就是刚推上去的那棵树。
      # PR:只补不提交,否则新增的无日期页在 PR 上必然标红。
      - name: 补齐日期缓存
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          refresh() {
            node scripts/build-characters.js > /dev/null
            node scripts/build-akke-map.js > /dev/null
            node scripts/build-learn.js > /dev/null
            REFRESH_DATES=1 node scripts/build-akke-map.js > /dev/null
            REFRESH_DATES=1 node scripts/build-timeline.js > /dev/null
          }
          if [ "$EVENT" != "push" ]; then refresh; exit 0; fi
          for i in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            refresh
            git checkout -- public   # 构建会改写 sitemap 等已跟踪文件,不提交
            git add scripts/akke-map.dates.json scripts/timeline.dates.json
            if git diff --cached --quiet; then echo "日期缓存无变动"; exit 0; fi
            if git commit -m 'chore: 补齐知识库页面日期缓存' && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::日期缓存推送失败(重试 3 次)"; exit 1

      - name: 构建
        run: |
          node scripts/build-characters.js > /dev/null
          node scripts/build-akke-map.js > /dev/null
          node scripts/build-learn.js > /dev/null
          node scripts/build-timeline.js
          node scripts/build-index.js

      - name: 回归检查
        run: node scripts/check-kb.js
