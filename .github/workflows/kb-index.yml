name: kb-index

# 首页与 /timeline 的排序全靠页面日期。Vercel 是浅克隆、构建时拿不到 git 历史，
# 新页面(尤其 akke-bot 同步来的)没写 upio:date 时只能靠提交在仓里的日期缓存。
# push 到 main:用完整历史补齐两份日期缓存(只补缺、不覆盖),有变动就提交回 main
#   (GITHUB_TOKEN 推的提交不会再触发 workflow,不会循环;Vercel 照常部署),再跑回归检查。
# PR:只构建 + 检查,不写仓。检查失败是事后标红,不阻断发布,看到红了回来处理。
on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/**']
  pull_request:
    paths: ['public/**', 'scripts/**']

concurrency:
  group: kb-index-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REFRESH_DATES 要用 git log 取每页首次入仓日期

      - name: 补齐日期缓存
        if: github.event_name == 'push'
        run: |
          node scripts/build-akke-map.js > /dev/null
          node scripts/build-learn.js > /dev/null
          REFRESH_DATES=1 node scripts/build-akke-map.js > /dev/null
          REFRESH_DATES=1 node scripts/build-timeline.js | grep -a '^\[timeline\] dates' || true

      - name: 提交日期缓存
        if: github.event_name == 'push'
        run: |
          git add scripts/akke-map.dates.json scripts/timeline.dates.json
          if git diff --cached --quiet; then echo "日期缓存无变动"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: 补齐知识库页面日期缓存'
          # akke-bot 常在同一时刻推 main:推不上就 rebase 重试
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::日期缓存推送失败(重试 3 次)"; exit 1

      - name: 构建
        run: |
          node scripts/build-characters.js > /dev/null
          node scripts/build-akke-map.js > /dev/null
          node scripts/build-learn.js > /dev/null
          node scripts/build-timeline.js
          node scripts/build-index.js

      - name: 回归检查
        run: node scripts/check-kb.js
