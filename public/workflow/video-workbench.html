<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短视频获客 · 门店工作台</title>
<script>
  /* 首次绘制前定好主题，避免重载闪一下浅色 */
  (function () {
    var m = localStorage.getItem('theme') || 'system';
    var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.className = dark ? 'theme-dark' : 'theme-light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@600&display=swap">

<style>
  .theme-light {
    --main-bg: #f8f8f8; --panel-bg: #ffffff; --panel-border: #e6eae9;
    --t1: #1e1e1e; --t2: #dadedd; --t3: #f0f4f3;
    --text: #484848; --text-2: #48484899; --text-3: #48484855;
    --on-t1: #f8f8f8; --overlay: #1e1e1e0a;
  }
  .theme-dark {
    --main-bg: #080808; --panel-bg: #121212; --panel-border: #292929;
    --t1: #e9e9e2; --t2: #383938; --t3: #292929;
    --text: #ddddd6; --text-2: #e9e9e299; --text-3: #e9e9e255;
    --on-t1: #121212; --overlay: #e9e9e20a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--main-bg); color: var(--text);
    font-family: "Inter", "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px; line-height: 20px; min-height: 100vh;
    transition: background 300ms ease-in-out, color 300ms ease-in-out;
  }

  /* ── 排版角色 ── */
  .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--text-2);
  }
  .display {
    font-family: "Archivo", "PingFang SC", "Noto Sans SC", sans-serif;
    font-weight: 400; line-height: 1.04; letter-spacing: -.015em; color: var(--t1);
  }
  h1.display { font-size: 40px; }
  h2 { font-size: 16px; font-weight: 500; color: var(--t1); }
  h3 { font-size: 14px; font-weight: 500; color: var(--t1); }
  .dim { color: var(--text-2); }
  .tiny { font-size: 12.5px; line-height: 19px; color: var(--text-2); }

  /* ── 卡片：1px 外框 + 内层表面 ── */
  .uc { padding: 1px; border-radius: 10px; background: var(--panel-border); }
  .uc > .cd { border-radius: 9px; background: var(--panel-bg); padding: 16px; }
  .uc.lg > .cd { padding: 22px; }
  .uc.flat > .cd { background: transparent; }

  /* ── 顶栏 ── */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--main-bg) 82%, transparent);
    backdrop-filter: blur(14px); border-bottom: 1px solid var(--panel-border);
  }
  .top-in {
    max-width: 1336px; margin: 0 auto; padding: 13px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .glyph {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    background: var(--t1); color: var(--on-t1);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
  }
  .brand-txt { font-size: 14px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

  .themeset { display: flex; gap: 2px; padding: 2px; border-radius: 9999px; background: var(--t3); }
  .tbtn {
    width: 28px; height: 24px; border: 0; border-radius: 9999px; background: transparent;
    color: var(--text-2); cursor: pointer; font-size: 11px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 200ms, color 200ms;
  }
  .tbtn[aria-pressed="true"] { background: var(--panel-bg); color: var(--t1); }

  .link {
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 13px;
    color: var(--text-2); text-decoration: underline; text-underline-offset: 3px;
    transition: color 200ms;
  }
  .link:hover { color: var(--t1); }

  /* ── 三栏骨架 ── */
  .shell {
    max-width: 1336px; margin: 0 auto; padding: 0 24px;
    display: grid; grid-template-columns: 216px minmax(0, 1fr) 268px; gap: 28px;
    align-items: start;
  }
  .rail { position: sticky; top: 68px; padding: 34px 0 40px; }
  .work { padding: 34px 0 96px; min-width: 0; }
  .aside { position: sticky; top: 68px; padding: 34px 0 40px; display: flex; flex-direction: column; gap: 16px; }

  /* ── 左侧步骤导航 ── */
  .rail-group + .rail-group { margin-top: 26px; }
  .rail-head { padding: 0 10px 9px; }
  .steps { display: flex; flex-direction: column; gap: 1px; }
  .step {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
    font: inherit; text-align: left; cursor: pointer; color: var(--text-2);
    transition: background 200ms, color 200ms;
  }
  .step:hover:not(:disabled) { background: var(--overlay); color: var(--t1); }
  .step:disabled { cursor: default; color: var(--text-3); }
  .step[aria-current="true"] { background: var(--t3); color: var(--t1); }
  .step-n {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; flex-shrink: 0; width: 17px;
  }
  .step-t { font-size: 13px; line-height: 18px; }
  .step.done .step-n::after { content: "·"; margin-left: 3px; }

  /* ── 主工作区 ── */
  .work-head { margin-bottom: 26px; }
  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
  .work-head h1 { margin-bottom: 12px; }
  .work-lede { max-width: 620px; color: var(--text-2); line-height: 23px; }
  .work-meta { margin-top: 14px; display: flex; gap: 8px; align-items: center; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
    border-radius: 9999px; border: 1px solid var(--panel-border);
    font-size: 12px; color: var(--text-2); background: var(--panel-bg);
  }
  .chip.solid { background: var(--t1); color: var(--on-t1); border-color: var(--t1); }
  .chip.ghost { background: transparent; }

  .block + .block { margin-top: 18px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 12px; }

  /* ── 可选项网格（品类/城市）── */
  .picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pick {
    display: flex; align-items: center; gap: 10px; padding: 12px 13px;
    border: 1px solid var(--panel-border); border-radius: 9px; background: var(--panel-bg);
    cursor: pointer; font: inherit; color: var(--text); text-align: left;
    transition: border-color 200ms, background 200ms, color 200ms;
  }
  .pick:hover { border-color: var(--t2); }
  .pick[aria-pressed="true"] { border-color: var(--t1); color: var(--t1); }
  .tick {
    width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0;
    border: 1px solid var(--t2); display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent; transition: all 200ms;
  }
  .pick[aria-pressed="true"] .tick { background: var(--t1); border-color: var(--t1); color: var(--on-t1); }

  /* ── 上传区与素材卡 ── */
  .dropzone {
    width: 100%; border: 1px dashed var(--t2); border-radius: 10px; background: transparent;
    padding: 26px; cursor: pointer; font: inherit; color: var(--text-2);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: border-color 200ms, background 200ms;
  }
  .dropzone:hover { border-color: var(--t1); background: var(--overlay); }
  .dz-plus { font-size: 20px; color: var(--t1); line-height: 1; }
  .dz-main { color: var(--t1); font-size: 14px; }
  .dz-sub { font-size: 12.5px; }

  .clip-list { display: flex; flex-direction: column; gap: 10px; }
  .clip { display: flex; gap: 14px; align-items: flex-start; }
  .clip-body { flex: 1; min-width: 0; }
  .clip-name { color: var(--t1); font-size: 13.5px; margin-bottom: 8px; }
  .note-line { display: flex; gap: 8px; align-items: center; }
  .note-input {
    flex: 1; min-width: 0; padding: 9px 12px; font: inherit; font-size: 13px;
    border: 1px solid var(--panel-border); border-radius: 8px;
    background: var(--main-bg); color: var(--t1); outline: 0;
    transition: border-color 200ms;
  }
  .note-input:focus { border-color: var(--t1); }
  .note-input::placeholder { color: var(--text-3); }
  .mic {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--panel-border); background: transparent; font-size: 13px;
    color: var(--text-2); transition: all 200ms;
  }
  .mic:hover { border-color: var(--t1); color: var(--t1); }
  .mic.rec { background: var(--t1); border-color: var(--t1); color: var(--on-t1); animation: pulse 1.2s ease-in-out infinite; }
  .clip-tags { margin-top: 9px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* ── 审查意见 ── */
  .rate-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rate {
    flex: 1; min-width: 130px; padding: 13px; cursor: pointer; font: inherit; text-align: left;
    border: 1px solid var(--panel-border); border-radius: 9px; background: var(--main-bg);
    display: flex; flex-direction: column; gap: 3px;
    transition: border-color 200ms, background 200ms;
  }
  .rate:hover { border-color: var(--t2); }
  .rate.on { border-color: var(--t1); background: var(--panel-bg); }
  .rate-t { color: var(--t1); font-size: 13.5px; }
  .rate-s { font-size: 12px; color: var(--text-2); }
  .issue-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .issue-row .chip { cursor: pointer; border: 1px solid var(--panel-border); transition: all 200ms; }
  .issue-row .chip:hover { border-color: var(--t1); color: var(--t1); }
  .issue-row .chip.solid:hover { color: var(--on-t1); }

  /* ── 行列表 ── */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 13px 12px;
    border-top: 1px solid var(--panel-border);
  }
  .rows > .row:last-child { border-bottom: 1px solid var(--panel-border); }
  .row.tap { cursor: pointer; transition: background 200ms; }
  .row.tap:hover { background: var(--overlay); }
  .row-n { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-3); width: 20px; flex-shrink: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { color: var(--t1); font-size: 13.5px; }
  .row-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .row-end { font-size: 12px; color: var(--text-2); flex-shrink: 0; text-align: right; }

  /* ── 缩略 ── */
  .thumb {
    width: 54px; height: 74px; border-radius: 6px; flex-shrink: 0;
    background: var(--t3); border: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--text-3);
    position: relative; overflow: hidden;
  }
  .thumb.seen::after {
    content: "✓"; position: absolute; inset: 0; background: var(--t1); color: var(--on-t1);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .thumb.playing::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 3px;
    background: var(--t1); width: var(--p, 0%); transition: width 120ms linear;
  }

  /* ── 按钮 ── */
  .btn {
    border: 1px solid var(--t1); border-radius: 9px; cursor: pointer; font: inherit; font-size: 14px;
    background: var(--t1); color: var(--on-t1); padding: 11px 22px;
    transition: opacity 200ms, background 200ms, color 200ms, border-color 200ms;
  }
  .btn:hover:not(:disabled) { opacity: .85; }
  .btn:disabled { background: var(--t2); border-color: var(--t2); color: var(--text-3); cursor: default; }
  .btn.ghost { background: transparent; color: var(--t1); border-color: var(--panel-border); }
  .btn.ghost:hover { border-color: var(--t1); opacity: 1; }
  .btn.sm { padding: 7px 14px; font-size: 12.5px; border-radius: 8px; }

  .actions {
    margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .actions .note { font-size: 12.5px; color: var(--text-2); margin-left: auto; text-align: right; }

  /* ── 表格 ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 9px 11px; font-weight: 600; font-size: 11px;
    font-family: "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-3); border-bottom: 1px solid var(--panel-border);
  }
  td { padding: 11px; border-bottom: 1px solid var(--panel-border); vertical-align: top; line-height: 19px; }
  tr:last-child td { border-bottom: 0; }
  td.k { color: var(--t1); }

  /* ── 进度 ── */
  .track { height: 2px; background: var(--t2); border-radius: 2px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--t1); transition: width 500ms ease-in-out; }

  .stage-list { display: flex; flex-direction: column; }
  .stage-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--panel-border); font-size: 13px; color: var(--text-3);
  }
  .stage-list > .stage-row:last-child { border-bottom: 0; }
  .stage-row.on, .stage-row.ok { color: var(--t1); }
  .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--t2); flex-shrink: 0; }
  .stage-row.ok .sdot { background: var(--t1); }
  .stage-row.on .sdot { background: var(--t1); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .stage-name { flex: 1; }
  .stage-state { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }

  /* ── 折叠 ── */
  details { border-top: 1px solid var(--panel-border); padding-top: 14px; margin-top: 18px; }
  summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-2); transition: color 200ms;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--t1); }
  summary::after { content: "▸"; font-size: 9px; transition: transform 200ms; }
  details[open] summary::after { transform: rotate(90deg); }
  .det-body { margin-top: 14px; }

  /* ── 右侧要点栏 ── */
  .aside h3 { margin-bottom: 10px; }
  .points { display: flex; flex-direction: column; gap: 9px; }
  .point { display: flex; gap: 10px; font-size: 12.5px; line-height: 18px; color: var(--text-2); }
  .point-n {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--text-3);
    flex-shrink: 0; padding-top: 1px;
  }

  /* ── 播放器 ── */
  .player-wrap { display: flex; gap: 20px; align-items: flex-start; }
  .screen {
    width: 208px; flex-shrink: 0; aspect-ratio: 9/16; border-radius: 8px;
    background: var(--t3); border: 1px solid var(--panel-border); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    position: relative; overflow: hidden; transition: background 200ms;
  }
  .screen:hover { background: var(--t2); }
  .pglyph {
    width: 46px; height: 46px; border-radius: 50%; background: var(--t1); color: var(--on-t1);
    display: flex; align-items: center; justify-content: center; font-size: 14px; padding-left: 2px;
    transition: transform 200ms;
  }
  .screen:hover .pglyph { transform: scale(1.06); }
  .scrub { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--t1); width: 0; }

  .checks { display: flex; flex-direction: column; }
  .check {
    display: flex; align-items: flex-start; gap: 11px; padding: 11px 0;
    border-bottom: 1px solid var(--panel-border); cursor: pointer; transition: opacity 200ms;
  }
  .checks > .check:last-child { border-bottom: 0; }
  .check.locked { opacity: .38; cursor: default; }
  .check .tick { margin-top: 1px; }
  .check.on .tick { background: var(--t1); border-color: var(--t1); color: var(--on-t1); }
  .check-t { color: var(--t1); font-size: 13.5px; }
  .check-w { display: block; font-size: 12px; color: var(--text-2); margin-top: 2px; }

  /* ── 日期切换 ── */
  .tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9999px; background: var(--t3); }
  .tab {
    border: 0; border-radius: 9999px; background: transparent; cursor: pointer;
    font: inherit; font-size: 12.5px; padding: 6px 15px; color: var(--text-2);
    transition: background 250ms, color 250ms;
  }
  .tab[aria-pressed="true"] { background: var(--panel-bg); color: var(--t1); }

  .empty { padding: 30px 0; text-align: center; font-size: 13px; color: var(--text-3); }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 14px);
    padding: 1px; border-radius: 9999px; background: var(--panel-border);
    opacity: 0; pointer-events: none; transition: all 260ms ease-out; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast > span {
    display: block; padding: 9px 20px; border-radius: 9999px;
    background: var(--panel-bg); font-size: 13px; color: var(--t1);
  }

  @media (max-width: 1120px) {
    .shell { grid-template-columns: 190px minmax(0, 1fr); }
    .aside { display: none; }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; gap: 0; padding: 0 18px; }
    .rail { position: static; padding: 22px 0 0; }
    .steps { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
    .step { width: auto; white-space: nowrap; }
    .step-t { display: none; }
    .work { padding: 24px 0 80px; }
    h1.display { font-size: 30px; }
    .picks { grid-template-columns: 1fr; }
    .player-wrap { flex-direction: column; }
    .screen { width: 100%; max-width: 208px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="glyph">V</div>
      <div class="brand-txt">短视频获客<span id="storename" class="dim"></span></div>
    </div>
    <div class="top-right">
      <div class="themeset">
        <button class="tbtn" data-mode="light" title="浅色">○</button>
        <button class="tbtn" data-mode="dark" title="深色">●</button>
        <button class="tbtn" data-mode="system" title="跟随系统" aria-pressed="true">◐</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail">
    <div class="rail-group">
      <div class="rail-head mono">初始配置</div>
      <div class="steps" id="rail-setup"></div>
    </div>
    <div class="rail-group">
      <div class="rail-head mono">日常制作</div>
      <div class="steps" id="rail-daily"></div>
    </div>
  </nav>

  <main class="work" id="work"></main>

  <aside class="aside" id="aside"></aside>
</div>

<div class="toast" id="toast"><span></span></div>

<script>
/* ══════════════ 主题 ══════════════ */
const media = matchMedia('(prefers-color-scheme: dark)');
let mode = localStorage.getItem('theme') || 'system';
function paint() {
  const dark = mode === 'dark' || (mode === 'system' && media.matches);
  document.documentElement.className = dark ? 'theme-dark' : 'theme-light';
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  document.querySelectorAll('.tbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
}
paint();
media.addEventListener('change', () => mode === 'system' && paint());
document.querySelectorAll('.tbtn').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; localStorage.setItem('theme', mode); paint();
});

/* ══════════════ 数据 ══════════════ */
const CATEGORIES = ['全屋定制', '橱柜', '衣柜', '榻榻米 / 柜体', '整木定制 / 护墙板', '木门', '系统门窗', '旧房翻新'];
const CITIES = ['本市城区', '邻近县市', '同省其他地市', '省会城市', '周边省份', '仅本地'];

/* 并发上限：付费环节（配音、口型）同时最多跑这么多条。
   参见踩过的坑——多实例并行跑同一段会重复扣费，所以队列必须限流并逐条持锁。 */
const MAX_PARALLEL = 2;

function newTask(feedIdx) {
  return {
    feed: feedIdx, progress: 0, running: false, revision: 1,
    watched: false, ticks: {},
    review: { rating: null, issues: [], note: '' },
  };
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const num = n => n.toLocaleString('zh-CN');

function toast(msg) {
  const el = $('#toast');
  el.querySelector('span').textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* 每一步能否进入：前面的必做完。
   加 ?dev 解除顺序限制，方便自己跳着看各步。 */
const DEV = new URLSearchParams(location.search).has('dev');
function stepReady(i) {
  // 测试阶段任意步骤都可进入。接后端后改回 `return DEV || i === 0 || doneUpTo(i - 1)`
  return true;
}
function stepDone(i) {
  switch (i) {
    case 0: return S.saved;
    case 1: return Object.keys(S.judged).length === FEED.length;
    case 2: return S.clips.some(c => c.state === 'ok');
    case 3: return S.hostShots.every(h => h.ok);
    case 4: return S.tasks.length > 0;
    case 5: return S.approved;
    case 6: return S.tasks.length > 0 && S.tasks.every(t => t.progress >= 100);
    case 7: return S.tasks.length > 0 &&
      S.tasks.every(t => Object.keys(t.ticks).length === HUMAN_CHECKS.length);
  }
}
function doneUpTo(i) {
  for (let k = 0; k <= i; k++) if (!stepDone(k)) return false;
  return true;
}

/* ══════════════ 左侧导航 ══════════════ */
function renderRail() {
  const mk = g => STEPS.map((s, i) => ({ s, i })).filter(x => x.s.g === g).map(({ s, i }) => {
    const ready = stepReady(i), done = stepDone(i);
    return `<button class="step${done ? ' done' : ''}" ${i === S.cur ? 'aria-current="true"' : ''}
      onclick="goStep(${i})">
      <span class="step-n">${s.n}</span><span class="step-t">${esc(s.t)}</span></button>`;
  }).join('');
  $('#rail-setup').innerHTML = mk('setup');
  $('#rail-daily').innerHTML = mk('daily');
}

function goStep(i) {
  if (!stepReady(i)) { toast('请先完成前序步骤'); return; }
  clearInterval(S.makeTimer);
  clearInterval(S.fetchTimer);
  S.cur = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (i === 1) startFetch();
  if (i === 6) startMaking();
}

/* 进入第 02 步即开始抓取；完成后停在待判定清单 */
function startFetch() {
  if (S.fetchDone) return;
  clearInterval(S.fetchTimer);
  S.fetchTimer = setInterval(() => {
    S.fetchStep++;
    if (S.fetchStep > FETCH_STAGES.length) {
      clearInterval(S.fetchTimer);
      S.fetchDone = true;
      if (S.cur === 1) { render(); toast('已抓取 10 条待判定样片'); }
      return;
    }
    if (S.cur === 1) render();
  }, 900);
}
function finishFetch() {
  clearInterval(S.fetchTimer);
  S.fetchStep = FETCH_STAGES.length;
  S.fetchDone = true;
  render();
}

function pickGrid(list, set, kind) {
  return `<div class="picks">${list.map(x => `
    <button class="pick" aria-pressed="${set.has(x)}" onclick="togglePick('${kind}','${x}')">
      <span class="tick">✓</span><span>${esc(x)}</span>
    </button>`).join('')}</div>`;
}
function togglePick(kind, v) {
  const set = kind === 'cat' ? S.cats : S.cities;
  set.has(v) ? set.delete(v) : set.add(v);
  S.saved = false;
  render();
}
function saveBiz() {
  if (!S.cats.size || !S.cities.size) { toast('请至少选择一个品类和一个服务区域'); return; }
  S.saved = true; render(); toast('已保存');
}

/* ══════════════ 交互 ══════════════ */
function playThumb(id, done) {
  const el = document.getElementById(id);
  if (!el || el._busy) return;
  el._busy = true; el.classList.add('playing');
  let p = 0;
  const t = setInterval(() => {
    p += 8; el.style.setProperty('--p', p + '%');
    if (p >= 100) { clearInterval(t); el._busy = false; done(); }
  }, 90);
}
function watchIntro(i) { if (S.watchedIntro[i]) return; playThumb('ith-' + i, () => { S.watchedIntro[i] = true; render(); }); }
function judge(i, v) { S.judged[i] = v; render(); }
function watchFeed(i) { if (S.watchedFeed[i]) return; playThumb('fth-' + i, () => { S.watchedFeed[i] = true; render(); }); }
function uploadShot(i) { S.hostShots[i].ok = true; render(); toast('已上传'); }

/* ── 任务队列 ── */
function estimate(n) {
  // 并发上限决定实际墙钟时间：3 条按 2 并发跑，是两轮而不是三倍
  const rounds = Math.ceil(n / MAX_PARALLEL);
  return rounds <= 1 ? '约 40 分钟' : `约 ${rounds * 40} 分钟`;
}
function toggleTask(feedIdx) {
  const at = S.tasks.findIndex(t => t.feed === feedIdx);
  if (at >= 0) S.tasks.splice(at, 1);
  else S.tasks.push(newTask(feedIdx));
  if (S.activeTask >= S.tasks.length) S.activeTask = Math.max(0, S.tasks.length - 1);
  render();
}
function taskSwitcher() {
  if (S.tasks.length < 2) return '';
  return `<div class="block" style="margin-bottom:18px">
    <div class="tabs">
      ${S.tasks.map((t, k) => `
        <button class="tab" aria-pressed="${S.activeTask === k}" onclick="S.activeTask=${k};render()">
          任务 ${k + 1}${t.progress >= 100 ? '' : ' ·'}
        </button>`).join('')}
    </div>
  </div>`;
}

/* ── 审查意见与返工 ── */
function setRating(r) {
  const t = S.tasks[S.activeTask];
  t.review.rating = t.review.rating === r ? null : r;
  render();
}
function toggleIssue(x) {
  const arr = S.tasks[S.activeTask].review.issues;
  const at = arr.indexOf(x);
  at >= 0 ? arr.splice(at, 1) : arr.push(x);
  render();
}
function requestRevision() {
  const t = S.tasks[S.activeTask];
  if (!t.review.issues.length && !t.review.note.trim()) {
    toast('先说明需要改哪里'); return;
  }
  t.revision++;
  t.progress = 0;
  t.running = false;
  t.watched = false;
  t.ticks = {};
  toast(`已提交，正在生成第 ${t.revision} 版`);
  goStep(6);
}

/* ── 03 门店素材：上传 → 说一句 → 重新归类 ── */
const SAMPLE_UPLOADS = [
  '展厅样柜实拍.mp4', '工地水电验收.mp4', '客户家完工回访.mov', '柜门安装特写.mp4',
];
function addClip() {
  const name = SAMPLE_UPLOADS[S.clips.length % SAMPLE_UPLOADS.length];
  S.clips.push({ name, state: 'busy', n: 0, note: '', tags: [] });
  const idx = S.clips.length - 1;
  render();
  toast('正在切分，约 2 分钟');
  setTimeout(() => {
    const c = S.clips[idx];
    if (!c) return;
    c.state = 'ok';
    c.n = 6 + (idx % 5);
    c.tags = ['施工现场'];
    if (S.cur === 2) render();
  }, 2200);
}

/* 说明变化后重新归类。真实系统里这里调用一次多模态理解，
   把用户说法与画面证据一起送进去；说法只作为先验，不覆盖画面事实。 */
let noteTimer = null;
function setNote(i, v) {
  S.clips[i].note = v;
  clearTimeout(noteTimer);
  if (!v.trim()) return;
  S.clips[i].classifying = true;
  noteTimer = setTimeout(() => reclassify(i), 900);
  // 只更新标签区，避免重渲染时输入框失焦
  const box = document.querySelectorAll('.clip-tags')[i];
  if (box) box.innerHTML = '<span class="tiny">正在按你的说明重新归类…</span>';
}
const KEYWORDS = [
  [/墙|贴砖|铺贴|瓷砖/, '墙面铺贴'], [/地面|地砖/, '地面铺贴'],
  [/厨|橱柜|台面/, '厨房'], [/衣柜|柜体|吊柜|柜门/, '柜体安装'],
  [/水电|管线/, '水电'], [/展厅|门店|样柜/, '展厅'],
  [/完工|交付|回访/, '完工实景'], [/封边|细节|特写/, '工艺细节'],
  [/工地|现场|师傅|安装/, '施工现场'],
];
function reclassify(i) {
  const c = S.clips[i];
  // 先摘出「不是 X / 没有 X」里的 X，否则「墙面贴砖，不是地面」会把地面也打上标签
  const negated = [];
  c.note.replace(/(?:不是|不要|没有|并非)([^，。,；;、]{0,8})/g, (_, seg) => {
    KEYWORDS.forEach(([re, tag]) => { if (re.test(seg)) negated.push(tag); });
    return '';
  });
  const hit = KEYWORDS
    .filter(([re, tag]) => re.test(c.note) && !negated.includes(tag))
    .map(([, tag]) => tag);
  c.tags = [...new Set(hit.length ? hit : ['施工现场'])].slice(0, 3);
  c.classifying = false;
  const box = document.querySelectorAll('.clip-tags')[i];
  if (box) {
    box.innerHTML = c.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('') +
      `<span class="tiny" style="margin-left:6px">已切分 ${c.n} 段</span>`;
  }
}
const VOICE_SAMPLES = [
  '这段是墙面贴砖，不是地面',
  '客户家完工以后回去拍的全景',
  '师傅在装衣柜柜门，有封边细节',
  '展厅里的样柜，光线比较好',
];
function voiceNote(i) {
  if (S.recording !== null) { S.recording = null; render(); return; }
  S.recording = i;
  render();
  setTimeout(() => {
    S.recording = null;
    S.clips[i].note = VOICE_SAMPLES[i % VOICE_SAMPLES.length];
    render();
    reclassify(i);
    toast('语音已转成说明');
  }, 1600);
}

/* 队列调度：运行中不超过 MAX_PARALLEL 条，其余排队。
   每条推进自己的进度，完成后腾出名额给下一条。 */
function startMaking() {
  clearInterval(S.makeTimer);
  if (!S.tasks.length) return;
  S.makeTimer = setInterval(() => {
    // 补位：把排队中的任务提到运行态，直到占满并发
    let running = S.tasks.filter(t => t.running).length;
    for (const t of S.tasks) {
      if (running >= MAX_PARALLEL) break;
      if (!t.running && t.progress < 100) { t.running = true; running++; }
    }
    let changed = false;
    for (const t of S.tasks) {
      if (!t.running || t.progress >= 100) continue;
      t.progress = Math.min(100, t.progress + 4);
      changed = true;
      if (t.progress >= 100) t.running = false;
    }
    if (S.cur === 6 && changed) render();
    if (S.tasks.every(t => t.progress >= 100)) {
      clearInterval(S.makeTimer);
      if (S.cur === 6) render();
      toast(S.tasks.length > 1 ? `${S.tasks.length} 条成片已生成` : '成片已生成');
    }
  }, 600);
}
function finishMaking() {
  clearInterval(S.makeTimer);
  S.tasks.forEach(t => { t.progress = 100; t.running = false; });
  render(); toast('成片已生成');
}

function watchFinal() {
  const t = S.tasks[S.activeTask];
  if (!t || t.watched) return;
  const scrub = $('#scrub'), glyph = $('#pglyph'), hint = $('#shint');
  if (!scrub || scrub._busy) return;
  scrub._busy = true; glyph.textContent = '❚❚'; hint.textContent = '正在播放';
  let p = 0;
  const iv = setInterval(() => {
    p += 4; scrub.style.width = p + '%';
    if (p >= 100) { clearInterval(iv); t.watched = true; render(); }
  }, 60);
}
function tickHuman(i) {
  const t = S.tasks[S.activeTask];
  if (!t) return;
  t.ticks[i] ? delete t.ticks[i] : t.ticks[i] = true;
  render();
}

render();
</script>
