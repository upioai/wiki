e": "主动传递", "key": "发《产品环保补充协议》+《假一赔三承诺》；强调白纸黑字盖公章、有法律效力，打消货不对板疑虑。"}, {"no": 3, "title": "标准化服务流程", "type": "主动传递", "key": "发设计/安装/售后流程海报；每步有 SOP、总部系统监管，哪怕换人总部也兜底。"}, {"no": 4, "title": "活动稀缺性说明", "type": "主动传递", "key": "原价868、为宣传样板房补贴300才有568；名额按「套」抢完即止；引导关注服务号、点活动链接授权锁名额，制造紧迫感。"}, {"no": 5, "title": "样板房客户专属权益", "type": "主动传递", "key": "三大好处：①每平直降300省预算 ②脸面工程选更优板材工艺绝不用次品 ③指派最资深设计师+评分最高安装班组。"}, {"no": 6, "title": "报价与预算", "type": "问则答", "key": "发《报价预算》海报、请客户提供房产面积测算；单价全国统一、透明。"}, {"no": 7, "title": "上门量房条件", "type": "问则答", "key": "量房仅在客户到总部确认意向并付定金后安排，提高效率、避免无效付出。"}, {"no": 8, "title": "收全款政策", "type": "问则答", "key": "合同与收款全国统一标准、数千订单验证，统一交付/保障效率/减少争议，无法个性化调整。"}, {"no": 9, "title": "应对市场负面信息", "type": "问则答", "key": "有评价说明是正规品牌愿受监督；同档次里负面相对偏少；交付时间写进合同严格执行。"}, {"no": 10, "title": "尾款的问题", "type": "问则答", "key": "样板房成本价、公司不赚钱做精品；合同收款全国统一最稳妥流程，望体谅，用效果说话。"}, {"no": 11, "title": "你认识 XX 品牌吗", "type": "问则答", "key": "标准答「不太了解/听说过但不熟」；绝不主动评价竞品好坏。被追问→「精力都在给你更好产品更实惠价格」；竞争对手→「最大对手是我们自己，能否保持初心」。"}, {"no": 12, "title": "期房如何逼单", "type": "问则答", "key": "交定金锁样板房优惠为您省钱、建服务群设计师全程在线；后悔期承诺房屋另售可全额无息退定金。"}, {"no": 13, "title": "针对比价客户", "type": "问则答", "key": "防伪五等级（基材/贴标/单面/双面/六面），一线品牌市面有各种非正规防伪，本司六面防伪；选板材看防伪等级+基材类型。"}, {"no": 14, "title": "异地远程交付规则", "type": "问则答", "key": "承接前先与安装部王总(18959255934)核实区域是否支持两次上门，不符合不承接；远程费=(实际里程−50km)×8元/公里；客户不接受远程费直接停止谈判。"}, {"no": 15, "title": "个性化定制（玻璃门/灯带/护墙板）", "type": "问则答", "key": "属家居装饰品非必需品。玻璃门：型材壁厚1.8-2.0mm、20mm加厚门框、足厚国标钢化玻璃带3C认证。灯带：悍高高显色无频闪。要做就选高品质，重精准设计搭配。"}, {"no": 16, "title": "售后二选一", "type": "问则答", "key": "方案A 免费保修1年+终身免费保养；方案B 升级5年保修收合同总款3%。全国连锁售后标准统一，本地小厂全凭口头承诺。"}, {"no": 17, "title": "客户要效果图", "type": "问则答", "key": "①公司制作 500 元/套；②更建议找线上专业整案设计师出图（整体空间搭配更出彩）。"}], "core_principles": ["销售本质是价值交换与需求满足，而非简单买卖。", "沟通纪律：未见面前的细节沟通=向竞争对手递刀；脱离标准只谈价格是对客户不负责。", "信任链条：电话→加微信；网络→约见面；成交基础→信任；信任基础→证据；最佳证据→书面承诺。", "价格哲学：让客户感觉「占了便宜」而非「绝对便宜」。", "客户关系：客户是朋友（平等、真诚、共赢），不是上帝（距离感、无条件满足）。", "感受大于事实：你对他好，与他「感觉到」你好是两回事。", "站在客户立场思考（同理心），而非简单替客户着想（主观臆断）。", "我们提供全屋定制解决方案而非仅销售材料：设计是灵魂、生产是根基、安装是最后一公里。"], "red_lines": ["客户到店见面前，禁止就产品细节、价格细节深度讨论。", "绝不主动评价竞品好坏（夸赞或诋毁都会踩坑）。", "客户不接受远程费用，直接停止谈判。"], "poster_drive": "https://drive.weixin.qq.com/s?k=AKwAGAcaABUo1O1jPg"}, "cases": {"module": "销售成功对话案例", "note": "从企微/微信聊天截图整理，用于话术训练样本。客户以车牌号+来源命名（运营内部约定）。", "cases": [{"id": "case1", "title": "电话报名 → 加微 → 约到店刷脸", "label": "到店转化", "customer": "闽D60516028（15060766576，住塔埔）", "image": "assets/cases/case1-to-store-D60516028.jpg", "flow": ["开场：您好 兔宝宝ENF（最高环保等级）多层板全屋定制 原价868 现样板房活动568每平米 包设计 安装 假一赔三", "通过好友验证后发《环保检测》《产品配置》海报", "硬核配置单四点：三大品牌任选+每3㎡投影送1抽屉 / ENF国家最高标准六面防伪 / 限名额868→568 / 标配悍高五金精诺三合一同品牌边条PUR封边", "给地址：厦门市思明区台北路海西金谷广场T1-11楼有大有小", "约到店：您很近可以抽空半小时基本了解清楚 → 客户「现在过去」→ 提示刷脸进电梯"], "tactics": ["开场即亮三大价值点（大牌/平价/稀缺）", "用书面协议建立信任", "降低到店门槛（很近、半小时）"]}, {"id": "case2", "title": "拉企微群协同量房", "label": "到店后/量房协同", "customer": "闽D60534 张（13338369033）厦区店，五缘尊府5号楼2001", "image": "assets/cases/case2-group-measure-D60534.jpg", "flow": ["客户抢码后，销售拉企微群「设计师+测量师傅+安装师傅」一起对接", "提醒明天上午师傅去量、下午再提醒抢码", "索要具体门牌号，避免量尺师傅找不到", "群内统一沟通，企微名片对接设计师"], "tactics": ["量房前先建服务群锁定客户", "门牌号/时间确认到位降低跑空", "多角色在群内体现专业与总部兜底"]}, {"id": "case3", "title": "异议处理全流程（分单 / 质保 / 复尺）", "label": "异议处理", "customer": "闽D60591 小君来店客户张女士，特房五缘尊府", "images": ["assets/cases/case3a-objection-D60591.jpg", "assets/cases/case3b-split-order.jpg", "assets/cases/case3c-warranty-5y.jpg"], "objections": [{"q": "厨房瓷砖高于客厅、要不要全敲？先量柜子可以吗？", "a": "如果全部敲就有影响，就怕这样的情况；可现在先量一遍开始设计，后面再复尺（给师傅200元费用），装修确实会出现很多这样那样的情况。"}, {"q": "想分成2单（2个房间分开做），价格一样分单不影响吧？", "a": "两单的金额都要满一万，还有样板房有名额限制；引导『您要分开做两单么？』『尺寸发我看一下』，把问题拉回方案。"}, {"q": "其他都是5年质保，整个行业都是5年，你们是不是对自己东西没信心？", "a": "我们是一年质保终身维护，板材五金全是品牌的，变形一般一年内显现，过后基本无故障；另有加3个点保5年的方案。没信心就不会加3个点保5年，这个模式做5年了大家都比较认可。免费基础售后=保修1年+终身免费保养、无额外费用。"}], "tactics": ["把『分单』话术引回满额/名额限制", "质保异议用『终身维护+品控数据+5年可升级』化解", "复尺费用透明前置，管理预期"]}, {"id": "case4", "title": "出差转同事 → 扫码进企微对接设计师", "label": "到店转化", "customer": "天地客 winson（刘总），同事徐先生 18659229596", "image": "assets/cases/case4-to-store-winson.jpg", "flow": ["恭候光临，上班
