<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 参考案例集 · 行业样板库</title>
<meta name="description" content="全网收录正在用案例内容做获客的商户账号，按行业拆解其内容组织与呈现形式。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=92f4faf0cc">
</head><body>
<!-- 固定模板：不含任何账号数据。账号、品类、统计全部来自 db/index.json，
     新增账号不改这个文件。由 scrape/export.py 产出数据，scrape/publish.py 上传。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><span style="color:var(--ink)">参考案例集</span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><span class="eyebrow">参考案例集 · 行业样板库</span><h1>别人家的案例内容，长什么样</h1><p class="lede">正在加载…</p></div></section></div>
<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');

  function chips(rows) {
    return rows.map(function (r) { return '<span class="ch"><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>'; }).join('');
  }

  function acct(a) {
    var url = CR.acctURL(a.slug);
    var top = a.top3.map(function (t) {
      return '<a class="t3" href="' + esc(t.href) + '" target="_blank" rel="noopener" title="' + esc(t.title) + '">'
        + '<img src="' + B + esc(t.thumb) + '" alt="' + esc(t.alt) + '" loading="lazy" width="180" height="240" decoding="async">'
        + '<span class="t3n">&#9825; ' + esc(t.like) + '</span></a>';
    }).join('');
    return '<div class="acct">'
      + '<a class="poster" href="' + url + '"><img src="' + B + esc(a.poster.src) + '" alt="' + esc(a.name) + ' 案例封面合辑" loading="lazy" width="' + a.poster.w + '" height="' + a.poster.h + '" decoding="async"></a>'
      + '<div class="info"><h3><a href="' + url + '">' + esc(a.name) + '</a>'
      + (a.review === 'pending' ? ' <span class="rv-pend" title="按链接直接入库，还没人复核">待复核</span>' : '') + '</h3>'
      + '<div class="sub">' + esc(a.cat) + ' · ' + esc(a.city) + ' · 抖音号 ' + esc(a.id_value) + '</div>'
      + '<div class="chips">' + chips(a.chips) + '</div>'
      + '<p class="note">' + esc(a.note) + '</p>'
      + '<a class="go" href="' + url + '">看完整拆解 &rarr;</a></div>'
      + '<div class="top3"><div class="t3h">流量最好的三条</div><div class="t3row">' + top + '</div></div></div>';
  }

  function rejected(rows) {
    if (!rows || !rows.length) return '';
    function card(r) {
      var meta = chips([['品类', r.cat], ['扫描', r.scanned + ' 条'], ['判为案例', r.ncase + ' 条'],
                        ['命中率', r.old_rate === r.rate ? r.rate + '%' : r.old_rate + '% → ' + r.rate + '%']]);
      var hit = r.kind === 'review' ? '<span class="ch"><b>人工结论</b> 不收录</span>'
        : r.signal
        ? '<span class="ch"><b>拦下它的信号</b> ' + esc(r.signal) + '，' + r.signal_n + ' 条（' + r.signal_pct + '%）</span>'
        : '<span class="ch"><b>规则没拦住</b> 判出 ' + r.ncase + ' 条案例，靠账号级准入 ' + esc(r.gate || '') + '</span>';
      return '<tr><td><strong>' + esc(r.name) + '</strong><div class="chips" style="margin-top:8px">' + meta + hit + '</div>'
        + '<p style="margin-top:10px">' + esc(r.reason) + '</p></td>'
        + '<td style="min-width:200px"><strong>' + esc(r.lesson) + '</strong></td></tr>';
    }
    function table(list) {
      return '<div class="tscroll"><table class="vtab"><thead><tr><th>账号与判定结果</th><th>它说明了什么</th></tr></thead><tbody>'
        + list.map(card).join('') + '</tbody></table></div>';
    }
    var byRule = rows.filter(function (r) { return r.kind === 'rule'; });
    var byGate = rows.filter(function (r) { return r.kind === 'gate'; });
    var byReview = rows.filter(function (r) { return r.kind === 'review'; });
    var out = '<a class="rej-back" href="#c-0">&larr; 回到收录的样板</a>'
      + '<div class="shead reveal in" style="margin-top:0"><span class="eyebrow">反面例子</span>'
      + '<h2>查过，但不作为样板</h2><p class="lede">这 ' + rows.length + ' 个号都认真扫过全部作品，最后没有收录。'
      + '把它们摆出来是因为——<strong>说清楚什么不算案例，比说什么算案例更有用</strong>。'
      + '它们按「怎么被拦下来的」分开放：规则自己拦下的、规则拦不住靠人看的、人工复核或标注后摘掉的。前两类的分界，是这套方法里最该讲清楚的一件事。</p></div>';
    if (byRule.length) out += '<div class="shead reveal in" style="margin-top:36px"><h3 style="font-size:18px">一、规则自己拦下来的</h3>'
      + '<p class="lede">命中率算出来就很低。低本身就是结论——说明这个号的内容大部分不是在展示自家做出来的活。</p></div>' + table(byRule);
    if (byGate.length) out += '<div class="shead reveal in" style="margin-top:44px"><h3 style="font-size:18px">二、规则拦不住，只能靠人看的</h3>'
      + '<p class="lede">这些号的内容<strong>完全真实</strong>，规则也确实判出了案例，判得并没有错。错在账号性质：主角是<strong>用户本人</strong>，'
      + '而内容里看不到任何商业方——没提机构、课程、品牌或所购买的服务。没有商业方，它就只是一份个人记录，'
      + '不能作为「商户如何用案例内容获客」的样板。这类问题正则一条都抓不到，必须收号时人工过一遍。</p></div>' + table(byGate);
    if (byReview.length) out += '<div class="shead reveal in" style="margin-top:44px"><h3 style="font-size:18px">三、人工看过、不收录的</h3>'
      + '<p class="lede">入库后在页面上复核没通过，或抽样标注时人看过的几条都不是自家交付。理由是标注的人写的。</p></div>' + table(byReview);
    // 默认不展示，从左侧目录底部的入口进来（#rejected），纯 CSS 切换，见 .rejview
    return '<div class="rejview" id="rejected">' + out + '</div>';
  }

  function render(d) {
    // 品类和账号的顺序由 export 按评论里的购买意向总数排好；还没有任何意向数据时侧栏仍显示获赞
    var byIntent = d.cats.some(function (c) { return c.intent; });
    var side = d.cats.map(function (c, i) {
      return '<a href="#c-' + i + '"><span class="cn">' + esc(c.name) + '</span><span class="cc">' + (byIntent ? '意向 ' + (c.intent || 0) : esc(c.best_likes)) + '</span></a>';
    }).join('');
    if (d.rejected && d.rejected.length) side += '<a class="side-rej" href="#rejected"><span class="cn">查过但没收录</span>'
      + '<span class="cc">' + d.rejected.length + ' 个号</span></a>';
    var secs = d.cats.map(function (c, i) {
      return '<div class="catsec" id="c-' + i + '"><h2 class="cath">' + esc(c.name) + '</h2>'
        + c.accounts.map(function (s) { return acct(d.accounts[s]); }).join('') + '</div>';
    }).join('');
    app.innerHTML = '<section class="detail-hero"><div class="wrap">'
      + '<span class="eyebrow">参考案例集 · 行业样板库</span><h1>别人家的案例内容，长什么样</h1>'
      + '<p class="lede">我们在全网找那些真的在用案例内容做获客的商户，把作品整个扫一遍，按规则挑出真实案例，再看它们怎么组织内容。一个行业一份样板。</p>'
      + '<p class="intro-copy">这里收录的都是公开可见的第三方账号，看的是<strong>呈现形式</strong>。每个号配一张 4×4 封面合辑——账号的内容套路，看这一张图就够了。'
      + '拆解结论会回到 <a href="https://upio.ai/akke/website#case">成功案例获客</a> 的选题与表达方式参考库，不会把别人的案例装到任何人身上。'
      + '目前 ' + d.totals.cats + ' 个品类、' + d.totals.accounts + ' 个账号，共扫描 ' + d.totals.scanned + ' 条作品。判定规则按行业分层、由人工标注持续校准，规则与原始数据都在仓库里。'
      + (byIntent ? '品类和账号按<strong>评论里的购买意向</strong>排：展示的每条视频取前 200 条评论，由 AI 判断有多少条在问价、问怎么买、想要同款。' : '') + '</p>'
      + '</div></section><section style="padding-top:0"><div class="wrap"><div class="layout">'
      + '<aside class="side"><div class="sidet">行业目录 · ' + (byIntent ? '按评论里的购买意向' : '按获赞') + '</div>' + side + '</aside>'
      + '<div class="main">' + secs + rejected(d.rejected) + '<div class="refnote">' + d.disclaimer + '</div></div>'
      + '</div></div></section>';
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  CR.getJSON(CR.BASE + 'db/index.json').then(render).catch(function (e) {
    CR.fail(app, '数据文件读取失败（' + e.message + '）。刷新一次试试；还不行请告诉维护的同事。');
  });
})();
</script>
</body></html>
