<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 参考案例集 · 行业样板库</title>
<meta name="description" content="全网收录正在用案例内容做获客的商户账号，按行业拆解其内容组织与呈现形式。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=ae395bf37a">
</head><body>
<!-- 固定模板：不含任何账号数据。账号、品类、统计全部来自 db/index.json，
     新增账号不改这个文件。由 scrape/export.py 产出数据，scrape/publish.py 上传。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><span style="color:var(--ink)">参考案例集</span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><span class="eyebrow">参考案例集 · 行业样板库</span><h1>别人家的案例内容，长什么样</h1><p class="lede">正在加载…</p></div></section></div>
<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');

  function chips(rows) {
    return rows.map(function (r) { return '<span class="ch"><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>'; }).join('');
  }

  // 各档案例条数的比例条（2026-10-31 用户定：列表页每个号旁一条细色条）。第 5 档是人工标的，要读线上标注，列表页不算
  function confbar(h) {
    var sum = (h || []).reduce(function (x, y) { return x + y; }, 0);
    if (!sum) return '';
    var tip = '案例置信度各档条数：' + h.map(function (n, i) { return '第' + (i + 1) + '档 ' + n; }).join('、');
    return '<div class="confbar" title="' + tip + '">' + h.map(function (n, i) {
      return n ? '<i data-conf="' + (i + 1) + '" style="flex-grow:' + n + '"></i>' : '';
    }).join('') + '</div>';
  }

  function acct(a) {
    var url = CR.acctURL(a.slug);
    var top = a.top3.map(function (t) {
      return '<a class="t3" href="' + esc(t.href) + '" target="_blank" rel="noopener" title="' + esc(t.title) + '">'
        + '<img src="' + B + esc(t.thumb) + '" alt="' + esc(t.alt) + '" loading="lazy" width="180" height="240" decoding="async">'
        + '<span class="t3n">' + (a.top3_by === 'intent' && t.intent != null ? '意向 ' + t.intent : '&#9825; ' + esc(t.like)) + '</span></a>';
    }).join('');
    return '<div class="acct">'
      + '<a class="poster" href="' + url + '" target="_blank" rel="noopener"><img src="' + B + esc(a.poster.src) + '" alt="' + esc(a.name) + ' 案例封面合辑" loading="lazy" width="' + a.poster.w + '" height="' + a.poster.h + '" decoding="async"></a>'
      + '<div class="info"><h3><a href="' + url + '" target="_blank" rel="noopener">' + esc(a.name) + '</a>'
      + (a.review === 'pending' ? ' <span class="rv-pend" title="按链接直接入库，还没人抽标">未标注</span>' : '') + '</h3>'
      + confbar(a.conf_hist)
      + '<div class="sub">' + esc(a.cat) + ' · ' + esc(a.city) + ' · ' + esc(a.id_label || '抖音号') + ' ' + esc(a.id_value) + '</div>'
      + '<div class="chips">' + chips(a.chips) + '</div>'
      + '<p class="note">' + esc(a.note) + '</p>'
      + '<a class="go" href="' + url + '" target="_blank" rel="noopener">看完整拆解 &rarr;</a></div>'
      + '<div class="top3"><div class="t3h">' + (a.top3_by === 'intent' ? '购买意向最多的三条' : '流量最好的三条') + '</div><div class="t3row">' + top + '</div></div></div>';
  }

  function render(d) {
    // 品类和账号的顺序由 export 按评论里的购买意向总数排好；还没有任何意向数据时侧栏仍显示获赞
    var byIntent = d.cats.some(function (c) { return c.intent; });

    // 行业专题页（给客户看的）：品类标题旁给入口；还没有调研号、只有跨行业推荐的行业单列在后面
    var inds = {};
    (d.industries || []).forEach(function (x) { inds[x.ikey] = x; });
    function indLink(k) {
      return inds[k] ? ' <a class="ind-link" href="' + B + 'industry/' + encodeURIComponent(k) + '">行业专题 &rarr;</a>' : '';
    }
    function indHref(k) { return B + 'industry/' + encodeURIComponent(k); }
    // 目录里点品类名直接进行业专题；还没有专题页的品类退回页内跳转
    var side = d.cats.map(function (c, i) {
      return '<a href="' + (inds[c.ikey] ? indHref(c.ikey) : '#c-' + i) + '"><span class="cn">' + esc(c.name) + '</span><span class="cc">' + (byIntent ? '意向 ' + (c.intent || 0) : esc(c.best_likes)) + '</span></a>';
    }).join('');
    var more = (d.industries || []).filter(function (x) { return !x.accounts && x.ready; });
    var secs = d.cats.map(function (c, i) {
      return '<div class="catsec" id="c-' + i + '"><h2 class="cath">' + (inds[c.ikey] ? '<a class="cat-name" href="' + indHref(c.ikey) + '">' + esc(c.name) + '</a>' : esc(c.name)) + indLink(c.ikey) + '</h2>'
        + c.accounts.map(function (s) { return acct(d.accounts[s]); }).join('') + '</div>';
    }).join('');
    app.innerHTML = '<section class="detail-hero"><div class="wrap">'
      + '<span class="eyebrow">参考案例集 · 行业样板库</span><h1>别人家的案例内容，长什么样</h1>'
      + '<p class="lede">我们在全网找那些真的在用案例内容做获客的商户，把作品整个扫一遍，按规则挑出真实案例，再看它们怎么组织内容。一个行业一份样板。</p>'
      + '<p class="intro-copy">这里收录的都是公开可见的第三方账号，看的是<strong>呈现形式</strong>。每个号配一张封面合辑（整张封面罗列，不裁）——账号的内容套路和封面设计统不统一，看这一张图就够了。点行业目录里的品类名或品类标题，进这一行的行业专题，看共性和别的行业可以借来用的讲法。'
      + '拆解结论会回到 <a href="https://upio.ai/akke/website#case">成功案例获客</a> 的选题与表达方式参考库，不会把别人的案例装到任何人身上。'
      + '目前 ' + d.totals.cats + ' 个品类、' + d.totals.accounts + ' 个账号，共扫描 ' + d.totals.scanned + ' 条作品。判定规则按行业分层、由人工标注持续校准，规则与原始数据都在仓库里。'
      + (byIntent ? '品类和账号按<strong>评论里的购买意向</strong>排：展示的每条视频取前 200 条评论，由 AI 判断有多少条在问价、问怎么买、想要同款。' : '') + '</p>'
      + '</div></section><section style="padding-top:0"><div class="wrap"><div class="layout">'
      + '<aside class="side"><div class="sidet">行业目录 · ' + (byIntent ? '按评论里的购买意向' : '按获赞') + '</div>' + side + '</aside>'
      + '<div class="main">' + secs
      + (more.length ? '<div class="catsec"><h2 class="cath">还在调研的行业</h2><p class="note" style="margin:6px 0 14px;color:var(--ink-soft);font-size:13.5px">这些行业还没有收录账号，专题页里先列了别的行业里可以借来用的讲法。</p><div class="chips">'
          + more.map(function (x) { return '<a class="ch" style="text-decoration:none" href="' + B + 'industry/' + encodeURIComponent(x.ikey) + '"><b>' + esc(x.name) + '</b> 行业专题 &rarr;</a>'; }).join('') + '</div></div>' : '')
      + '<div class="refnote">' + d.disclaimer + '</div></div>'
      + '</div></div></section>';
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  CR.getJSON(CR.BASE + 'db/index.json').then(render).catch(function (e) {
    CR.fail(app, '数据文件读取失败（' + e.message + '）。刷新一次试试；还不行请告诉维护的同事。');
  });
})();
</script>
</body></html>
