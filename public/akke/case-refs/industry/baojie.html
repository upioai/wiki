<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 行业专题</title>
<meta name="description" content="参考案例集行业专题：这一行的案例内容怎么做、有没有共性、别的行业哪些讲法可以借来用。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=8925e7c54b">
<style>
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px;}
.ind-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;background:var(--paper-raised);
  border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;}
.ind-card:hover{border-color:var(--accent);}
.ind-card img{width:100%;height:auto;border-radius:8px;display:block;background:var(--paper-sunken);}
.ind-card h3{font-size:16px;margin:0 0 4px;line-height:1.35;}
.ind-card .sub{font-size:12px;color:var(--ink-faint);}
.ind-card .why{font-size:13px;line-height:1.6;color:var(--ink-soft);margin:8px 0 0;}
.ind-card .it{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);font-family:"IBM Plex Mono",monospace;}
.ind-card .q{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:8px 0 0;padding-left:8px;border-left:2px solid var(--accent-soft);}
.ind-card .q i{font-style:normal;color:var(--accent);margin-right:4px;}
.ia{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;background:var(--paper-raised);border:1px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-top:18px;}
.ia>a img{width:100%;height:auto;border-radius:10px;display:block;background:var(--paper-sunken);}
.ia h3{margin:0;font-size:20px;line-height:1.35;}
.ia h3 a{color:inherit;text-decoration:none;}
.ia h3 a:hover{color:var(--accent);}
.ia .sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.ia .it{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);font-family:"IBM Plex Mono",monospace;}
.ia .why{font-size:15.5px;font-weight:600;line-height:1.6;margin:12px 0 0;color:var(--ink);}
.ia .ap{font-size:14.5px;line-height:1.8;color:var(--ink-soft);margin:8px 0 0;}
.ia .cites{margin:14px 0 0;display:grid;gap:8px;}
.ia blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--paper-sunken);border-radius:0 8px 8px 0;
  font-size:13.5px;line-height:1.65;color:var(--ink);}
.ia blockquote cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
.ia .q{font-size:13px;line-height:1.55;color:var(--ink-soft);margin:12px 0 0;}
.ia .q i{font-style:normal;color:var(--accent);margin-right:4px;}
.ia .go{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;}
.ia .pend{font-size:12.5px;color:var(--ink-faint);margin-top:10px;}
.io{margin-top:22px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper-raised);box-shadow:var(--shadow);}
.io table{width:100%;border-collapse:collapse;font-size:14px;}
.io th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-faint);padding:12px 14px;background:var(--paper-sunken);white-space:nowrap;}
.io td{padding:14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.55;color:var(--ink-soft);}
.io td.n{font-weight:700;color:var(--ink);}
.io td.n small{display:block;font-weight:400;font-size:12px;color:var(--ink-faint);}
.io td.out b{color:var(--accent);font-size:16px;font-family:"IBM Plex Mono",monospace;}
.io td.out small{display:block;font-size:12px;color:var(--ink-faint);}
.io .na{color:var(--ink-faint);}
.io-sum{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
.io-sum span{font-size:13.5px;padding:7px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
.bv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin-top:14px;padding:10px;border-radius:10px;
  background:var(--paper-sunken);text-decoration:none;color:inherit;}
.bv:hover{outline:1px solid var(--accent);}
.bv img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;}
.bv .l{font-size:11.5px;color:var(--ink-faint);}
.bv .t{font-size:14px;font-weight:600;color:var(--ink);margin:3px 0;line-height:1.45;}
.bv .num{font-size:13px;color:var(--accent);font-weight:700;}
.ia details{margin-top:12px;}
.ia summary{cursor:pointer;font-size:13px;color:var(--ink-soft);}
.ia .ef{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
.ia .ef b{color:var(--ink);font-weight:600;}
@media (max-width:720px){
  .io table,.io tbody,.io tr,.io td{display:block;width:100%;}
  .io thead{display:none;}
  .io tr{border-top:1px solid var(--line);padding:12px 14px;}
  .io tr:first-child{border-top:none;}
  .io td{border:none;padding:3px 0;}
  .io td[data-k]:before{content:attr(data-k) "：";color:var(--ink-faint);font-size:12.5px;}
  .bv{grid-template-columns:72px minmax(0,1fr);}
}
.cp{display:grid;gap:14px;margin-top:22px;}
.cp-item{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.cp-asp{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:6px;
  background:var(--paper-sunken);color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;}
.cp-item h4{margin:0 0 6px;font-size:15.5px;}
.cp-item p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-soft);}
.cp-ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.cp-ev a{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper-sunken);color:var(--ink-soft);text-decoration:none;}
.cp-ev a:hover{color:var(--accent);}
.xr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;background:var(--paper-raised);border:1px solid var(--line);
  border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-top:16px;}
.xr img{width:100%;height:auto;border-radius:8px;display:block;}
.xr .from{font-size:12px;color:var(--ink-faint);}
.xr h3{margin:4px 0 10px;font-size:18px;line-height:1.35;}
.xr dl{margin:0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;font-size:14px;line-height:1.7;}
.xr dt{color:var(--ink-faint);font-size:12.5px;padding-top:2px;}
.xr dd{margin:0;color:var(--ink-soft);}
.xr dd.ap{color:var(--ink);font-weight:500;}
.xr .ev{font-size:12.5px;color:var(--ink-faint);}
.xr .go{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
.ai-note{font-size:12px;color:var(--ink-faint);margin-top:10px;}
@media (max-width:620px){
  .xr{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px;}
  .xr dl{grid-template-columns:1fr;gap:2px;}
  .xr dt{padding-top:8px;}
  .ind-card{grid-template-columns:80px minmax(0,1fr);}
  .ia{grid-template-columns:88px minmax(0,1fr);gap:14px;padding:16px;}
  .ia h3{font-size:17px;}
}
</style>
</head><body>
<!-- 固定模板：每个行业一份同样的拷贝（industry/<行业 key>.html，publish.py 生成），地址决定显示哪个行业，数据来自 db/industry/<key>.json。
     给客户看的：不讲判定分数和规则，讲这一行别人怎么做、你能借什么。分析段落由 scrape/industry.py 生成。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><a href="/akke/case-refs">参考案例集</a><span class="sep">/</span><span style="color:var(--ink)" id="crumbName"></span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a><h1>正在加载…</h1></div></section></div>

<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');
  // 地址是 /akke/case-refs/industry/<行业 key>（每个行业一份同样的模板，publish.py 生成）；?i= 兼容本地预览
  var ikey = CR.param('i') || ((/\/industry\/([^\/?#.]+)/.exec(location.pathname) || [])[1] || '');
  try { ikey = decodeURIComponent(ikey); } catch (e) {}

  function tags(rows) {
    return rows.filter(function (r) { return r[1] !== '' && r[1] != null; }).map(function (r) {
      return '<span class="filter-tag"' + (r[2] || '') + '><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>';
    }).join('');
  }

  // 本行业的号：页面主体。最带客的那条视频放最前；正文两句；拆解原话折叠（industry.py 校验过出处）
  function bestVideo(a) {
    var v = a.best;
    if (!v) return '';
    return '<a class="bv" href="' + esc(v.href) + '" target="_blank" rel="noopener">'
      + (v.cover ? '<img src="' + B + esc(v.cover) + '" alt="' + esc(v.title) + '" loading="lazy">' : '<span></span>')
      + '<div><div class="l">评论里想买的人最多的一条</div><div class="t">' + esc(v.title) + '</div>'
      + '<div class="num">' + (v.comments ? v.comments + ' 条评论里 ' : '') + v.n + ' 条想买</div>'
      + '<div class="l" style="margin-top:4px">看原视频 &rarr;</div></div></a>';
  }

  function acctBlock(a, x) {
    x = x || {};
    var ef = x.effort || {};
    var cites = (x.cites || []).map(function (c) {
      return '<blockquote>「' + esc(c.quote) + '」<cite>拆解报告 · ' + esc(c.from) + '</cite></blockquote>';
    }).join('');
    return '<div class="ia"><a href="' + CR.acctURL(a.slug) + '"><img src="' + B + esc(a.poster.src) + '" alt="' + esc(a.name) + ' 封面合辑" loading="lazy" width="' + a.poster.w + '" height="' + a.poster.h + '"></a>'
      + '<div style="min-width:0"><h3><a href="' + CR.acctURL(a.slug) + '">' + esc(a.name) + '</a></h3>'
      + '<div class="sub">' + esc([a.city, a.platform, a.fans ? '粉丝 ' + a.fans : ''].filter(Boolean).join(' · ')) + '</div>'
      + (a.intent != null ? '<span class="it">评论里想买 ' + a.intent + ' 条</span>' : '')
      + (x.why ? '<p class="why">' + esc(x.why) + '</p>' : '')
      + (x.approach ? '<p class="ap">' + esc(x.approach) + '</p>' : '')
      + (a.cost ? '<p class="ef">照它的拍法做一条：<b>' + esc([a.cost.device, '人工' + a.cost.time.replace('约 ', '约 '), 'AI 算力 ' + a.cost.ai, '合计 ' + a.cost.total].join(' · ')) + '</b></p>' : '')
      + bestVideo(a)
      + (cites ? '<details><summary>我们拆解时的原话（' + (x.cites || []).length + ' 条）</summary><div class="cites">' + cites + '</div></details>' : '')
      + (a.quote ? '<p class="q"><i>' + esc(a.quote.k) + '</i>评论原话「' + esc(a.quote.t) + '」</p>' : '')
      + (a.teardown ? '<a class="go" href="' + CR.acctURL(a.slug) + '">看这个号的完整分析 &rarr;</a>'
         : '<p class="pend">这个号的逐条分析还在做，先看<a href="' + CR.acctURL(a.slug) + '">它的案例</a>。</p>')
      + '</div></div>';
  }

  // 投入和产出：一号一行。成本出自这个号的拆解（video-teardown/accounts/<slug>/cost.json），
  // 和单条拆解页顶部的成本框是同一份数；每条合计 = 人工按 55 元/小时折算 + AI 算力 + 设备摊销
  function ioTable(d, ac) {
    var rows = d.accounts.map(function (a) {
      var ef = (ac[a.slug] || {}).effort || {}, k = a.cost, v = a.best;
      var na = '<span class="na">还在分析</span>';
      return '<tr><td class="n">' + esc(a.name) + (a.fans ? '<small>粉丝 ' + esc(a.fans) + '</small>' : '') + '</td>'
        + '<td data-k="怎么拍">' + (ef.shoot ? esc(ef.shoot) : (k ? '—' : na)) + '</td>'
        + '<td data-k="设备">' + (k ? esc(k.device) : na) + '</td>'
        + '<td data-k="每条人工">' + (k ? esc(k.time) : na) + '</td>'
        + '<td data-k="AI 算力">' + (k ? esc(k.ai) : na) + '</td>'
        + '<td class="out" data-k="每条合计">' + (k ? '<b style="font-size:15px">' + esc(k.total) + '</b><small>人工折 ' + esc(k.labor_cny) + (k.amort ? ' · 设备摊销 ' + esc(k.amort) : '') + '</small>' : na) + '</td>'
        + '<td class="out" data-k="最带客的一条">' + (v ? '<b>' + v.n + '</b> 人想买' + (v.comments ? '<small>' + v.comments + ' 条评论里</small>' : '') : '—') + '</td></tr>';
    }).join('');
    return '<div class="io"><table><thead><tr><th>账号</th><th>怎么拍</th><th>设备</th><th>每条人工</th><th>AI 算力</th><th>每条合计</th><th>最带客的一条</th></tr></thead><tbody>'
      + rows + '</tbody></table></div>';
  }

  function render(d) {
    var c = d.content, t = d.totals, n = d.accounts.length;
    document.title = 'AKKE · 行业专题 · ' + d.name;
    document.getElementById('crumbName').textContent = d.name + ' · 行业专题';
    var ac = {};
    (c ? c.accounts : []).forEach(function (x) { ac[x.slug] = x; });

    var h = '<section class="detail-hero"><div class="wrap">'
      + '<a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a>'
      + '<span class="eyebrow" style="margin-left:16px">行业专题 · ' + esc(d.name) + '</span>'
      + '<h1>' + esc(c ? c.headline : d.name + '：别人家的案例内容怎么做') + '</h1>'
      + '<p class="lede">' + esc(c ? c.intro : (n ? '我们调研了这一行 ' + n + ' 个在用案例内容获客的账号。' : '这一行我们还在调研。')) + '</p>'
      + (n ? '<div class="filter-row" style="margin-top:24px">' + tags([
          ['调研账号', n + ' 个'], ['扫描作品', t.scanned + ' 条'], ['真实案例', t.cases + ' 条'],
          ['评论里想买', t.intent + ' 条', ' style="background:var(--accent-soft);color:var(--accent)"']]) + '</div>' : '')
      + '</div></section><section style="padding-top:0"><div class="wrap">';

    if (n && d.accounts.some(function (a) { return a.cost; })) {
      h += '<div class="shead reveal in" style="margin-top:40px"><span class="eyebrow">投入和产出</span>'
        + '<h2>同行这样拍，一条要花多少、带来多少想买的人</h2>'
        + '<p class="lede">投入按我们对每个号的逐条分析估算：照它的拍法做一条，用什么设备、人要花多久、AI 整理剪辑的算力费。「每条合计」把人的时间按 55 元/小时折成钱一起算——一条视频真正的成本大头是人。产出是那个号评论里想买的人最多的一条视频。</p></div>'
        + ioTable(d, ac);
    }

    if (n) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">这一行我们调研了谁</span>'
        + '<h2>' + n + ' 个账号，各自怎么用案例内容获客</h2>'
        + '<p class="lede">按评论里想买的人数排。「评论里想买」是我们读了每条视频前 200 条评论后，数出来在问价、问怎么买、想要同款、问门店、已经下单的条数——比点赞更接近生意。引文出自我们对这个号评论里想买最多的三条视频的逐条拆解。</p></div>'
        + d.accounts.map(function (a) { return acctBlock(a, ac[a.slug]); }).join('');
    }

    if (c && c.common && n) {
      var names = {};
      d.accounts.forEach(function (a) { names[a.slug] = a.name; });
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">有没有共性 · 内容是怎么做出来的</span>'
        + '<h2>' + (c.common.has_common ? '这几个号在制作上有几处做法是一样的' : '这一行的制作做法还看不出稳定的共性') + '</h2>'
        + '<p class="lede">' + esc(c.common.summary) + '</p></div>';
      if (c.common.points.length) {
        h += '<div class="cp">' + c.common.points.map(function (p) {
          return '<div class="cp-item">' + (p.aspect ? '<span class="cp-asp">' + esc(p.aspect) + '</span>' : '') + '<h4>' + esc(p.title) + '</h4><p>' + esc(p.detail) + '</p><div class="cp-ev">'
            + p.evidence.map(function (e) {
              return '<a href="' + CR.acctURL(e.slug) + '" title="' + esc(e.note) + '">' + esc(names[e.slug] || e.slug) + '：' + esc(e.note.slice(0, 40)) + (e.note.length > 40 ? '…' : '') + '</a>';
            }).join('') + '</div></div>';
        }).join('') + '</div>';
      }
    }

    if (c && c.cross && c.cross.length) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">别的行业可以借什么</span>'
        + '<h2>最后，' + c.cross.length + ' 种可以从别的行业借来的讲法</h2>'
        + '<p class="lede">每一条都出自我们对那个号的完整拆解（挑出评论里想买最多的三条视频逐条分析），不是凭感觉推荐。点「看这个号」能看到原视频和拆解报告。</p></div>'
        + c.cross.map(function (x) {
          return '<div class="xr"><a href="' + CR.acctURL(x.slug) + '"><img src="' + B + esc(x.poster.src) + '" alt="' + esc(x.name) + '" loading="lazy" width="' + x.poster.w + '" height="' + x.poster.h + '"></a>'
            + '<div><div class="from">' + esc(x.cat) + ' · ' + esc(x.name) + (x.intent != null ? ' · 评论里想买 ' + x.intent + ' 条' : '') + '</div>'
            + '<h3>' + esc(x.method) + '</h3><dl>'
            + '<dt>他们怎么做</dt><dd>' + esc(x.what) + '</dd>'
            + '<dt>为什么适合你</dt><dd>' + esc(x.fit) + '</dd>'
            + '<dt>你可以这样做</dt><dd class="ap">' + esc(x.apply) + '</dd>'
            + '<dt>依据</dt><dd class="ev">' + esc(x.evidence) + '</dd></dl>'
            + '<p style="margin:10px 0 0"><a class="go" href="' + CR.acctURL(x.slug) + '">看这个号 &rarr;</a></p></div></div>';
        }).join('');
    }

    if (!c) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">分析</span><h2>正在整理</h2>'
        + '<p class="lede">这一行的共性和可以借鉴的讲法还在整理中，先看上面的账号。</p></div>';
    } else {
      h += '<div class="edge" style="margin-top:40px"><span class="tag">注意</span><span class="et">' + esc(c.caveats)
        + '</span></div><p class="ai-note">分析由 AI 基于我们的调研数据和拆解报告整理，整理于 ' + esc((c.generated_at || '').slice(0, 10)) + '。</p>';
    }
    h += '<div class="refnote">' + (d.disclaimer || '') + '</div></div></section>';
    app.innerHTML = h;
  }

  if (!ikey) { CR.fail(app, '地址里缺少行业。'); return; }
  CR.getJSON(B + 'db/industry/' + encodeURIComponent(ikey) + '.json').then(render)
    .catch(function () { CR.fail(app, '找不到这个行业的专题页（' + ikey + '）。'); });
})();
</script>
</body></html>
