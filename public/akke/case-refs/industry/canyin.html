<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 行业专题</title>
<meta name="description" content="参考案例集行业专题：这一行的案例内容怎么做、有没有共性、别的行业哪些讲法可以借来用。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=7159a638b5">
<style>
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px;}
.ind-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;background:var(--paper-raised);
  border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;}
.ind-card:hover{border-color:var(--accent);}
.ind-card img{width:100%;height:auto;border-radius:8px;display:block;background:var(--paper-sunken);}
.ind-card h3{font-size:16px;margin:0 0 4px;line-height:1.35;}
.ind-card .sub{font-size:12px;color:var(--ink-faint);}
.ind-card .why{font-size:13px;line-height:1.6;color:var(--ink-soft);margin:8px 0 0;}
.ind-card .it{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);font-family:"IBM Plex Mono",monospace;}
.ind-card .q{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:8px 0 0;padding-left:8px;border-left:2px solid var(--accent-soft);}
.ind-card .q i{font-style:normal;color:var(--accent);margin-right:4px;}
.cp{display:grid;gap:14px;margin-top:22px;}
.cp-item{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.cp-item h4{margin:0 0 6px;font-size:15.5px;}
.cp-item p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-soft);}
.cp-ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.cp-ev a{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper-sunken);color:var(--ink-soft);text-decoration:none;}
.cp-ev a:hover{color:var(--accent);}
.xr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;background:var(--paper-raised);border:1px solid var(--line);
  border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-top:16px;}
.xr img{width:100%;height:auto;border-radius:8px;display:block;}
.xr .from{font-size:12px;color:var(--ink-faint);}
.xr h3{margin:4px 0 10px;font-size:18px;line-height:1.35;}
.xr dl{margin:0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;font-size:14px;line-height:1.7;}
.xr dt{color:var(--ink-faint);font-size:12.5px;padding-top:2px;}
.xr dd{margin:0;color:var(--ink-soft);}
.xr dd.ap{color:var(--ink);font-weight:500;}
.xr .ev{font-size:12.5px;color:var(--ink-faint);}
.xr .go{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
.ai-note{font-size:12px;color:var(--ink-faint);margin-top:10px;}
@media (max-width:620px){
  .xr{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px;}
  .xr dl{grid-template-columns:1fr;gap:2px;}
  .xr dt{padding-top:8px;}
  .ind-card{grid-template-columns:80px minmax(0,1fr);}
}
</style>
</head><body>
<!-- 固定模板：每个行业一份同样的拷贝（industry/<行业 key>.html，publish.py 生成），地址决定显示哪个行业，数据来自 db/industry/<key>.json。
     给客户看的：不讲判定分数和规则，讲这一行别人怎么做、你能借什么。分析段落由 scrape/industry.py 生成。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><a href="/akke/case-refs">参考案例集</a><span class="sep">/</span><span style="color:var(--ink)" id="crumbName"></span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a><h1>正在加载…</h1></div></section></div>

<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');
  // 地址是 /akke/case-refs/industry/<行业 key>（每个行业一份同样的模板，publish.py 生成）；?i= 兼容本地预览
  var ikey = CR.param('i') || ((/\/industry\/([^\/?#.]+)/.exec(location.pathname) || [])[1] || '');
  try { ikey = decodeURIComponent(ikey); } catch (e) {}

  function tags(rows) {
    return rows.filter(function (r) { return r[1] !== '' && r[1] != null; }).map(function (r) {
      return '<span class="filter-tag"' + (r[2] || '') + '><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>';
    }).join('');
  }

  function acctCard(a, why) {
    return '<a class="ind-card" href="' + CR.acctURL(a.slug) + '">'
      + '<img src="' + B + esc(a.poster.src) + '" alt="' + esc(a.name) + ' 封面合辑" loading="lazy" width="' + a.poster.w + '" height="' + a.poster.h + '">'
      + '<div><h3>' + esc(a.name) + '</h3><div class="sub">' + esc([a.city, a.platform].filter(Boolean).join(' · ')) + '</div>'
      + (a.intent != null ? '<span class="it">评论里想买 ' + a.intent + ' 条</span>' : '')
      + (why ? '<p class="why">' + esc(why) + '</p>' : '')
      + (a.quote ? '<p class="q"><i>' + esc(a.quote.k) + '</i>「' + esc(a.quote.t) + '」</p>' : '')
      + '</div></a>';
  }

  function render(d) {
    var c = d.content, t = d.totals, n = d.accounts.length;
    document.title = 'AKKE · 行业专题 · ' + d.name;
    document.getElementById('crumbName').textContent = d.name + ' · 行业专题';
    var why = {};
    (c ? c.accounts : []).forEach(function (x) { why[x.slug] = x.why; });

    var h = '<section class="detail-hero"><div class="wrap">'
      + '<a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a>'
      + '<span class="eyebrow" style="margin-left:16px">行业专题 · ' + esc(d.name) + '</span>'
      + '<h1>' + esc(c ? c.headline : d.name + '：别人家的案例内容怎么做') + '</h1>'
      + '<p class="lede">' + esc(c ? c.intro : (n ? '我们调研了这一行 ' + n + ' 个在用案例内容获客的账号。' : '这一行我们还在调研。')) + '</p>'
      + (n ? '<div class="filter-row" style="margin-top:24px">' + tags([
          ['调研账号', n + ' 个'], ['扫描作品', t.scanned + ' 条'], ['真实案例', t.cases + ' 条'],
          ['评论里想买', t.intent + ' 条', ' style="background:var(--accent-soft);color:var(--accent)"']]) + '</div>' : '')
      + '</div></section><section style="padding-top:0"><div class="wrap">';

    if (n) {
      h += '<div class="shead reveal in" style="margin-top:40px"><span class="eyebrow">这一行我们调研了谁</span>'
        + '<h2>' + n + ' 个账号，按评论里想买的人数排</h2>'
        + '<p class="lede">「评论里想买」是我们读了每条视频前 200 条评论后，数出来在问价、问怎么买、想要同款、问门店、已经下单的条数——比点赞更接近生意。点进去看每个号的完整拆解。</p></div>'
        + '<div class="ind-grid">' + d.accounts.map(function (a) { return acctCard(a, why[a.slug]); }).join('') + '</div>';
    }

    if (c && c.common && n) {
      var names = {};
      d.accounts.forEach(function (a) { names[a.slug] = a.name; });
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">有没有共性</span>'
        + '<h2>' + (c.common.has_common ? '这一行的号有几处做法是一样的' : '这一行还看不出稳定的共性') + '</h2>'
        + '<p class="lede">' + esc(c.common.summary) + '</p></div>';
      if (c.common.points.length) {
        h += '<div class="cp">' + c.common.points.map(function (p) {
          return '<div class="cp-item"><h4>' + esc(p.title) + '</h4><p>' + esc(p.detail) + '</p><div class="cp-ev">'
            + p.evidence.map(function (e) {
              return '<a href="' + CR.acctURL(e.slug) + '" title="' + esc(e.note) + '">' + esc(names[e.slug] || e.slug) + '：' + esc(e.note.slice(0, 40)) + (e.note.length > 40 ? '…' : '') + '</a>';
            }).join('') + '</div></div>';
        }).join('') + '</div>';
      }
    }

    if (c && c.cross && c.cross.length) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">别的行业可以借什么</span>'
        + '<h2>' + c.cross.length + ' 种讲法，来自别的行业里评论最想买的号</h2>'
        + '<p class="lede">每一条都出自我们对那个号的完整拆解（挑出评论里想买最多的三条视频逐条分析），不是凭感觉推荐。点「看这个号」能看到原视频和拆解报告。</p></div>'
        + c.cross.map(function (x) {
          return '<div class="xr"><a href="' + CR.acctURL(x.slug) + '"><img src="' + B + esc(x.poster.src) + '" alt="' + esc(x.name) + '" loading="lazy" width="' + x.poster.w + '" height="' + x.poster.h + '"></a>'
            + '<div><div class="from">' + esc(x.cat) + ' · ' + esc(x.name) + (x.intent != null ? ' · 评论里想买 ' + x.intent + ' 条' : '') + '</div>'
            + '<h3>' + esc(x.method) + '</h3><dl>'
            + '<dt>他们怎么做</dt><dd>' + esc(x.what) + '</dd>'
            + '<dt>为什么适合你</dt><dd>' + esc(x.fit) + '</dd>'
            + '<dt>你可以这样做</dt><dd class="ap">' + esc(x.apply) + '</dd>'
            + '<dt>依据</dt><dd class="ev">' + esc(x.evidence) + '</dd></dl>'
            + '<p style="margin:10px 0 0"><a class="go" href="' + CR.acctURL(x.slug) + '">看这个号 &rarr;</a></p></div></div>';
        }).join('');
    }

    if (!c) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">分析</span><h2>正在整理</h2>'
        + '<p class="lede">这一行的共性和可以借鉴的讲法还在整理中，先看上面的账号。</p></div>';
    } else {
      h += '<div class="edge" style="margin-top:40px"><span class="tag">注意</span><span class="et">' + esc(c.caveats)
        + '</span></div><p class="ai-note">分析由 AI 基于我们的调研数据和拆解报告整理，整理于 ' + esc((c.generated_at || '').slice(0, 10)) + '。</p>';
    }
    h += '<div class="refnote">' + (d.disclaimer || '') + '</div></div></section>';
    app.innerHTML = h;
  }

  if (!ikey) { CR.fail(app, '地址里缺少行业。'); return; }
  CR.getJSON(B + 'db/industry/' + encodeURIComponent(ikey) + '.json').then(render)
    .catch(function () { CR.fail(app, '找不到这个行业的专题页（' + ikey + '）。'); });
})();
</script>
</body></html>
