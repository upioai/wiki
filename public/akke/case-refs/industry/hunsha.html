<!-- 固定模板：每个行业一份同样的拷贝（industry/<行业 key>.html，publish.py 生成），地址决定显示哪个行业，数据来自 db/industry/<key>.json。
     给客户看的：不讲判定分数和规则，讲这一行别人怎么做、你能借什么。分析段落由 scrape/industry.py 生成。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><a href="/akke/case-refs">参考案例集</a><span class="sep">/</span><span style="color:var(--ink)" id="crumbName"></span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a><h1>正在加载…</h1></div></section></div>

<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');
  // 地址是 /akke/case-refs/industry/<行业 key>（每个行业一份同样的模板，publish.py 生成）；?i= 兼容本地预览
  var ikey = CR.param('i') || ((/\/industry\/([^\/?#.]+)/.exec(location.pathname) || [])[1] || '');
  try { ikey = decodeURIComponent(ikey); } catch (e) {}

  function tags(rows) {
    return rows.filter(function (r) { return r[1] !== '' && r[1] != null; }).map(function (r) {
      return '<span class="filter-tag"' + (r[2] || '') + '><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>';
    }).join('');
  }

  // 本行业的号：页面主体。最带客的那条视频放最前；正文两句；拆解原话折叠（industry.py 校验过出处）
  function bestVideo(a) {
    var v = a.best;
    if (!v) return '';
    return '<a class="bv" href="' + esc(v.href) + '" target="_blank" rel="noopener">'
      + (v.cover ? '<img src="' + B + esc(v.cover) + '" alt="' + esc(v.title) + '" loading="lazy">' : '<span></span>')
      + '<div><div class="l">评论里想买的人最多的一条</div><div class="t">' + esc(v.title) + '</div>'
      + '<div class="num">' + (v.comments ? v.comments + ' 条评论里 ' : '') + v.n + ' 条想买</div>'
      + '<div class="l" style="margin-top:4px">看原视频 &rarr;</div></div></a>';
  }

  // 能不能做成 AI 产线（pipeline_fit.py，10-31 用户定的标准）：借这个号带客内容的剧本，做成「门店输入素材 → 按同一个剧本自动出片」的产线
  var PF_CLS = { '适合做成产线': 'ok', '部分适合': 'mid', '不适合': 'no' };
  function pipeBlock(a, fits, pf) {
    function ul(t, arr, ol) { return arr && arr.length ? '<div><b>' + t + '</b><' + (ol ? 'ol' : 'ul') + '>' + arr.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') + '</' + (ol ? 'ol' : 'ul') + '></div>' : ''; }
    var h = '<div class="af ia-af"><span class="l">能不能做成 AI 产线</span>';
    if (pf) {
      h += '<div class="pf"><p><span class="pfv ' + (PF_CLS[pf.verdict] || '') + '">' + esc(pf.verdict) + '</span>' + esc(pf.reason) + '</p>'
        + '<details><summary>剧本骨架、每次要交的素材、产线自动做什么</summary><div class="pf-g">'
        + ul('剧本骨架（按播放顺序）', pf.script, true) + ul('每次门店要交的素材', pf.inputs) + ul('产线自动做', pf.auto) + ul('卡在哪 / 必须人来做', pf.blockers)
        + '</div>' + (pf.evidence && pf.evidence.length ? '<div class="ev">依据（拆解原话）：' + pf.evidence.map(function (e) { return '「' + esc(e) + '」'; }).join(' ') + '</div>' : '')
        + '</details></div>';
    } else {
      h += '<p class="af-none">' + (a.teardown ? '这个号还没有做产线评估。' : '这个号的逐条拆解还没有做完，还评估不了能不能做成 AI 产线；拆解做完后补上。') + '</p>';
    }
    if (fits.length) h += '<span class="l" style="margin-top:6px">这个号的讲法，哪些交给 AI、哪些得现场拍</span>' + fits.map(function (f) { return aiFitItem(f, {}, false); }).join('');
    return h + '</div>';
  }

  function acctBlock(a, x, fits, pf) {
    x = x || {};
    var ef = x.effort || {};
    var cites = (x.cites || []).map(function (c) {
      return '<blockquote>「' + esc(c.quote) + '」<cite>拆解报告 · ' + esc(c.from) + '</cite></blockquote>';
    }).join('');
    return '<div class="ia"><a target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(a.slug) + '"><img src="' + B + esc(a.poster.src) + '" alt="' + esc(a.name) + ' 封面合辑" loading="lazy" width="' + a.poster.w + '" height="' + a.poster.h + '"></a>'
      + '<div style="min-width:0"><h3><a target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(a.slug) + '">' + esc(a.name) + '</a></h3>'
      + '<div class="sub">' + esc([a.city, a.platform, a.fans ? '粉丝 ' + a.fans : ''].filter(Boolean).join(' · ')) + '</div>'
      + (a.intent != null ? '<span class="it">评论里想买 ' + a.intent + ' 条</span>' : '')
      + (x.why ? '<p class="why">' + esc(x.why) + '</p>' : '')
      + (x.approach ? '<p class="ap">' + esc(x.approach) + '</p>' : '')
      + (a.cost ? '<p class="ef">照它的拍法做一条：<b>' + esc([a.cost.device, '人工' + a.cost.time.replace('约 ', '约 '), 'AI 算力 ' + a.cost.ai, '合计 ' + a.cost.total].join(' · ')) + '</b></p>' : '')
      + bestVideo(a)
      + (cites ? '<details><summary>我们拆解时的原话（' + (x.cites || []).length + ' 条）</summary><div class="cites">' + cites + '</div></details>' : '')
      + (a.quote ? '<p class="q"><i>' + esc(a.quote.k) + '</i>评论原话「' + esc(a.quote.t) + '」</p>' : '')
      + (a.teardown ? '<a class="go" target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(a.slug) + '">看这个号的完整分析 &rarr;</a>'
         : '<p class="pend">这个号的逐条分析还在做，先看<a target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(a.slug) + '">它的案例</a>。</p>')
      + (fits ? pipeBlock(a, fits, pf) : '')
      + '</div></div>';
  }

  // 投入和产出：一号一行。成本出自这个号的拆解（video-teardown/accounts/<slug>/cost.json），
  // 和单条拆解页顶部的成本框是同一份数；每条合计 = 人工按 55 元/小时折算 + AI 算力 + 设备摊销
  function ioTable(d, ac) {
    var rows = d.accounts.slice(0, 3).map(function (a) {      // 只留前 3 个号做样例（10-30）
      var ef = (ac[a.slug] || {}).effort || {}, k = a.cost, v = a.best;
      var na = '<span class="na">还在分析</span>';
      return '<tr><td class="n">' + esc(a.name) + (a.fans ? '<small>粉丝 ' + esc(a.fans) + '</small>' : '') + '</td>'
        + '<td class="gin" data-k="怎么拍">' + (ef.shoot ? esc(ef.shoot) : (k ? '—' : na)) + '</td>'
        + '<td class="gin" data-k="设备">' + (k ? esc(k.device) : na) + '</td>'
        + '<td class="gin" data-k="每条人工">' + (k ? esc(k.time) : na) + '</td>'
        + '<td class="gin" data-k="AI 算力">' + (k ? esc(k.ai) : na) + '</td>'
        + '<td class="out gin" data-k="每条合计">' + (k ? '<b style="font-size:15px">' + esc(k.total) + '</b><small>人工折 ' + esc(k.labor_cny) + (k.amort ? ' · 设备摊销 ' + esc(k.amort) : '') + '</small>' : na) + '</td>'
        + '<td class="out gout" data-k="最带客的一条">' + (v ? '<b>' + v.n + '</b> 人想买' + (v.comments ? '<small>' + v.comments + ' 条评论里</small>' : '') : '—') + '</td></tr>';
    }).join('');
    return '<div class="io"><table><thead><tr class="grp"><th></th><th class="gin" colspan="5">投入：照它的拍法做一条</th><th class="gout">产出</th></tr>'
      + '<tr><th>账号</th><th class="gin">怎么拍</th><th class="gin">设备</th><th class="gin">每条人工</th><th class="gin">AI 算力</th><th class="gin">每条合计</th><th class="gout">最带客的一条</th></tr></thead><tbody>'
      + rows + '</tbody></table></div>';
  }

  // 研究清单（默认收起）：调研时看到的、评论里想买的人多但没收进案例集的内容，供事后研究（scrape/watch.py）
  function watchBlock(w) {
    if (!w || !w.length) return '';
    var rows = w.map(function (r) {
      return '<tr><td>' + esc(r.name) + '</td>'
        + '<td>' + (r.href ? '<a href="' + esc(r.href) + '" target="_blank" rel="noopener">' + esc(r.title || '（无标题）') + '</a>' : esc(r.title)) + (r.quote ? '<span class="q">「' + esc(r.quote) + '」</span>' : '') + '</td>'
        + '<td class="num">' + r.n + ' / ' + r.judged + '</td>'
        + '<td><span class="tg">' + esc(r.content) + '</span></td>'
        + '<td>' + esc(r.why) + '</td></tr>';
    }).join('');
    return '<details class="watch"><summary>调研中看到的：评论里想买的人多，但没收进案例集的<small>' + w.length + ' 条 · 供研究</small></summary><div class="wb">'
      + '<p class="wn">收录要两件事都满足：内容是案例分享，并且评论里有人想买。这里是只满足后一件的——评论里有人问价、问怎么买，但内容不算案例，或者账号整体没达到收录标准。「想买 / 判过」是这条内容评论里想买的条数和我们判过的评论条数。</p>'
      + '<div class="wt"><table><thead><tr><th>账号</th><th>内容</th><th>想买 / 判过</th><th>内容判定</th><th>为什么没收</th></tr></thead><tbody>' + rows + '</tbody></table></div></div></details>';
  }

  // 部署方案（试行，默认收起）：案例做出来之后在哪发、什么节奏、用在哪些环节——每条都指到调研的号和数据（scrape/deploy.py）
  function deployBlock(p, open) {
    if (!p) return '';
    function ev(list) {
      return list && list.length ? '<div class="ev">' + list.map(function (e) {
        return '<span><i>' + esc(e.name || e.slug) + '</i>' + esc(e.note) + '</span>';
      }).join('') + '</div>' : '';
    }
    function ul(a) { return a && a.length ? '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; }
    var h = '<details class="dp"' + (open ? ' open' : '') + ' style="margin-top:56px"><summary>部署方案：案例内容做出来之后，在哪发、怎么发、用在哪些环节<small>依据本页调研的账号结构、跨平台的号与评论</small></summary><div class="db">'
      + '<p class="hl">' + esc(p.headline) + '</p><p>' + esc(p.summary) + '</p>';
    if (p.channels && p.channels.length) {
      h += '<h4>在哪发</h4>' + p.channels.map(function (x) {
        return '<div class="it"><b>' + esc(x.platform) + '</b><p>' + esc(x.role) + '</p>' + ev(x.evidence) + '</div>';
      }).join('');
    }
    if (p.cadence) {
      h += '<h4>发布节奏</h4><div class="it"><b>' + esc(p.cadence.recommend) + '</b><p>' + esc(p.cadence.detail) + '</p>' + ev(p.cadence.evidence) + '</div>';
    }
    if (p.organize && p.organize.length) {
      h += '<h4>内容怎么组织</h4>' + p.organize.map(function (x) {
        return '<div class="it"><b>' + esc(x.title) + '</b><p>' + esc(x.detail) + '</p>' + ev(x.evidence) + '</div>';
      }).join('');
    }
    if (p.stages && p.stages.length) {
      h += '<h4>案例用在哪些环节</h4>' + p.stages.map(function (x) {
        return '<div class="it"><b><span class="tg">' + esc(x.stage) + '</span><span class="tg' + (x.basis === '从调研推断' ? ' inf' : '') + '">' + esc(x.basis) + '</span></b>'
          + '<p><strong>做成什么：</strong>' + esc(x.material) + '</p><p><strong>怎么用：</strong>' + esc(x.how) + '</p>' + ev(x.evidence) + '</div>';
      }).join('');
    }
    h += '<div class="two"><div><h4>各行业通用的做法</h4>' + ul(p.common) + '</div><div><h4>这一行特有的</h4>' + ul(p.specific) + '</div></div>'
      + '<h4>该盯的数</h4>' + ul(p.metrics)
      + (p.gaps ? '<h4>调研看不到、要用你自己的数据定的</h4><p>' + esc(p.gaps) + '</p>' : '')
      + '<p class="ai-note">方案由 AI 根据本页调研的账号结构（发布节奏、内容组成、置顶、系列化）、评论里的购买意向和拆解报告整理，整理于 ' + esc((p.generated_at || '').slice(0, 10)) + '。</p>'
      + '</div></details>';
    return h;
  }

  // 列表统一：最多 10 条，前 3 条展开，后面的收进「再看 N 个」（10-30 用户定）
  function top3(list, render, unit, open) {
    list = (list || []).slice(0, 10);
    var head = list.slice(0, open || 3).map(render).join(''), rest = list.slice(open || 3);
    return head + (rest.length ? '<details class="more"><summary>再看 ' + rest.length + ' ' + (unit || '个') + ' ▾</summary>' + rest.map(render).join('') + '</details>' : '');
  }

  function btns(x) {
    var b = (x && x.buttons) || (x && x.url ? [{ label: x.button || '看客户样片 →', url: x.url }] : []);
    return b.length ? '<div class="btns">' + b.map(function (y, i) {
      return '<a class="btn' + (i ? ' alt' : '') + '" href="' + esc(y.url) + '" target="_blank" rel="noopener">' + esc(y.label) + '</a>';
    }).join('') + '</div>' : '';
  }

  // 已谈定客户的行业：介绍 + 按钮（data/samples.json）。有产线样例时由 replicasBlock 一起出
  function samplesBlock(x) {
    if (!x) return '';
    return '<div class="smp"><span class="eyebrow">客户样片</span><h2>' + esc(x.title || '这一行我们已经在给客户出片') + '</h2>'
      + (x.intro ? '<p>' + esc(x.intro) + '</p>' : '') + btns(x) + '</div>';
  }

  // 海外同行爆款（video-teardown/industries/<ikey>/overseas.json，手工调研整理）：播放最高的几条 + 可照着拍的做法
  function wan(n) {
    if (n < 10000) return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var v = n / 10000;
    return (v >= 100 ? Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : v.toFixed(2).replace(/\.?0+$/, '')) + ' 万';
  }
  function overseasBlock(o) {
    if (!o || !o.videos || !o.videos.length) return '';
    var byId = {};
    o.videos.forEach(function (v, i) { byId[v.id] = i + 1; });
    var h = '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">海外同行 · ' + esc(o.platform) + ' ' + esc(o.market) + '</span>'
      + '<h2>' + esc(o.platform) + ' ' + esc(o.market) + '同行：播放最高的 ' + o.videos.length + ' 条，和 ' + (o.methods || []).length + ' 种可以照着拍的做法</h2>'
      + '<p class="lede">' + esc(o.intro) + '</p></div>';
    h += '<div class="ov-grid">' + o.videos.map(function (v, i) {
      return '<a class="ov-v" href="' + esc(v.href) + '" target="_blank" rel="noopener"><img src="' + esc(v.cover) + '" alt="@' + esc(v.account) + '" loading="lazy">'
        + '<div class="b"><div class="rk">#' + (i + 1) + ' · ' + v.dur + ' 秒</div><div class="pl">' + wan(v.play) + ' 播放</div>'
        + '<div class="st">赞 ' + wan(v.like) + ' · 评论 ' + wan(v.cmt) + '</div>'
        + '<div class="hw">' + esc(v.how) + '</div>'
        + '<div class="ac">@' + esc(v.account) + ' · 粉丝 ' + wan(v.fans) + ' · ' + esc(v.date) + '</div></div></a>';
    }).join('') + '</div>';
    if (o.methods && o.methods.length) {
      h += '<div class="ov-m">' + o.methods.map(function (m) {
        return '<div class="ov-mi"><h3>' + esc(m.name) + '</h3><div class="fm">' + esc(m.form) + '</div>'
          + '<h4>原片结构</h4><ol>' + m.steps.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>'
          + '<h4>值得照着做的</h4><ul>' + m.keep.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
          + (m.quotes && m.quotes.length ? '<h4>评论原话</h4>' + m.quotes.map(function (q) {
              return '<blockquote>「' + esc(q.t) + '」<cite>' + esc(q.zh) + ' <small>· ' + esc(q.meta) + '</small></cite></blockquote>';
            }).join('') : '')
          + '<div class="rf">' + m.refs.map(function (id) {
              var v = o.videos[byId[id] - 1];
              return v ? '<a href="' + esc(v.href) + '" target="_blank" rel="noopener">看原片 #' + byId[id] + ' @' + esc(v.account) + ' &rarr;</a>' : '';
            }).join('') + '</div></div>';
      }).join('') + '</div>';
    }
    if (o.caveats && o.caveats.length) {
      h += '<ul class="ov-cv">' + o.caveats.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    }
    return h;
  }

  // 哪些适合 AI 仿造（industry.py 的 ai_fit）：每种讲法 AI 做哪几步、哪几步要门店实拍、我们打造过这条产线没有
  function aiFitBlock(list, names) {
    if (!list || !list.length) return '';
    return '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">哪些适合 AI 仿造</span>'
      + '<h2>' + AF_H2 + '</h2>'
      + '<p class="lede">' + AF_LEDE + '</p></div>'
      + '<div class="af">' + top3(list, function (x) { return aiFitItem(x, names, true); }, '种讲法') + '</div>';
  }
  var AF_H2 = '这几种讲法，哪些交给 AI，哪些得你在现场拍';
  var AF_LEDE = '出自我们对这些号的逐条拆解，以及我们已经打造的产线出的样片：AI 负责写稿、标题、按结构剪辑这些重复的活，真实感要靠门店自己的完工画面。';
  // 合并版的抽帧：综合拆解前两条视频各 8 帧排成一行，每张点开对应那条视频的逐条拆解（10-31：缩一半、数量翻倍）
  function frameRow(x) {
    var sets = x.frame_sets || (x.frames && x.frames.length ? [{ td: x.td, frames: x.frames }] : []);
    if (!sets.length) return '';
    return '<div class="frm frm2">' + sets.map(function (st, i) {
      return st.frames.map(function (f, j) {
        return '<a class="' + (i && !j ? 'sep' : '') + '" href="' + B + esc(st.td) + '" target="_blank" rel="noopener" title="看第 ' + (i + 1) + ' 条视频的逐条拆解"><img src="' + B + esc(f) + '" alt="" loading="lazy"></a>';
      }).join('');
    }).join('') + '</div><span class="frm-l">视频拆解抽帧' + (sets.length > 1 ? '（' + sets.length + ' 条视频，每条 ' + sets[0].frames.length + ' 张）' : '') + '，点开看逐条拆解 &rarr;</span>';
  }
  // 一种讲法一张卡；并进账号卡时不再写「参考 某号」（就是这个号）
  function aiFitItem(x, names, from) {
    function ul(a) { return '<ul>' + (a || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; }
    return '<div class="af-it"><h3>' + esc(x.method) + (x.proven ? '<span class="pv">已打造产线 · ' + esc(x.proven) + '</span>' : '') + '</h3>'
      + (from ? '<div class="from">参考 <a target="_blank" rel="noopener" href="' + CR.acctURL(x.slug) + '">' + esc(names[x.slug] || x.slug) + '</a></div>' : '')
      + '<div class="af-two"><div><b>交给 AI</b>' + ul(x.ai_can) + '</div><div class="real"><b>需要门店实拍 / 提供</b>' + ul(x.real_needed) + '</div></div>'
      + (from ? '' : frameRow(x))
      + (from && x.frames && x.frames.length ? '<a class="frm" href="' + B + esc(x.td) + '" target="_blank" rel="noopener" title="看这条视频的逐条拆解">'
          + x.frames.map(function (f) { return '<img src="' + B + esc(f) + '" alt="" loading="lazy">'; }).join('') + '</a>'
          + '<span class="frm-l">视频拆解抽帧，点开看逐条拆解 &rarr;</span>' : '')
      + (x.evidence ? '<div class="ev">依据：' + esc(x.evidence) + '</div>' : '') + '</div>';
  }

  // 已打造的产线（replicas/<行业>/*.json，产线交来就上线；10-31 用户定的叫法）：左边产线借的同行原片，右边产线出的成片
  function replicasBlock(list, smp) {
    if (!list || !list.length) return samplesBlock(smp);
    var h = '<div class="smp" style="background:transparent;border:none;padding:0"><div class="shead reveal in" style="margin-top:0"><span class="eyebrow">已打造的产线</span>'
      + '<h2>' + esc((smp && smp.title) || '这一行我们已打造的产线') + '：' + list.length + ' 条</h2>'
      + '<p class="lede">' + esc((smp && smp.intro) || '每张卡是一条产线：左边是它借鉴的同行原片和评论里有多少人在问价，右边是产线拿门店自己的真实单子出的成片。') + '</p></div>';
    h += top3(list, function (r) {
      var st = r.structure || {}, rf = r.ref || {}, rp = r.replica || {}, o = rf.ours;
      var stats = Object.keys(rf.stats || {}).filter(function (k) { return k !== '评/赞'; }).map(function (k) { return k + ' ' + rf.stats[k]; }).join(' · ');
      return '<div class="rp"><div class="orig"><span class="lab">借鉴的同行原片 · ' + esc(st.name || '') + '</span>'
        + '<h3>' + esc(st.type || st.name || '') + '</h3><div class="sub">' + esc([rf.platform, rf.account, rf.duration].filter(Boolean).join(' · ')) + '</div>'
        + '<div class="row"><a href="' + esc(rf.url) + '" target="_blank" rel="noopener">' + (rf.poster ? '<img src="' + esc(rf.poster) + '" alt="' + esc(rf.account) + '" loading="lazy">' : '') + '</a><div>'
        + (st.rhythm ? '<p class="rh"><b>原片节奏：</b>' + esc(st.rhythm) + '</p>' : '')
        + (stats ? '<div class="sub" style="margin-top:6px">' + esc(stats) + '</div>' : '')
        + (o && o.intent ? '<div class="num">前 ' + (o.judged || 200) + ' 条评论里 ' + o.intent + ' 条想买</div>' : '')
        + (rf.local ? '<p class="rh" style="margin-top:6px">' + esc(rf.local) + '</p>' : '') + '</div></div>'
        + (rf.quotes && rf.quotes.length ? '<div class="bub">' + rf.quotes.slice(0, 4).map(function (q) { return '<span>「' + esc(q) + '」</span>'; }).join('') + '</div>' : '')
        + '<a class="go" href="' + esc(rf.url) + '" target="_blank" rel="noopener">看原片 &rarr;</a>'
        + (o ? '<a class="go" href="' + CR.acctURL(o.slug) + '" target="_blank" rel="noopener">看这个号 &rarr;</a>' : '') + '</div>'
        + '<div class="mine"><span class="lab">产线出的成片</span>'
        + '<h3>' + esc(rp.title || '') + '<span class="vd' + (/基本/.test(rp.verdict || '') ? ' ok' : '') + '">' + esc(rp.verdict || '') + '</span></h3><div class="sub">' + esc(rp.duration || '') + '</div>'
        + '<div class="row">' + (rp.cover ? '<img src="' + esc(rp.cover) + '" alt="' + esc(rp.title) + '" loading="lazy">' : '<span></span>') + '<div>'
        + (rp.skeleton ? '<p class="rh"><b>产线剧本：</b>' + esc(rp.skeleton) + '</p>' : '')
        + (rp.summary ? '<p class="rh" style="margin-top:6px">' + esc(rp.summary) + '</p>' : '') + '</div></div>'
        + (rp.diffs && rp.diffs.length ? '<details><summary>和原片的差异、门店还要补什么（' + rp.diffs.length + ' 条）</summary><ul>' + rp.diffs.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></details>' : '')
        + (rp.detail_url ? '<a class="go" href="' + esc(rp.detail_url) + '" target="_blank" rel="noopener">看 8 步拆解 &rarr;</a>' : '')
        + '</div></div>';
    }, '个样例');
    return h + btns(smp) + '</div>';
  }

  // 适合做品牌宣传的案例（export 的 brand）：内容是案例、点赞评论都多，但判过的评论里没人想买
  function brandBlock(list) {
    if (!list || !list.length) return '';
    // 10-31 用户定：默认收起，和部署方案、别的行业可以借什么同一种折叠样式
    return '<details class="dp"><summary>适合做品牌宣传的案例：' + list.length + ' 条<small>传播很广、但评论里没人想买</small></summary><div class="db">'
      + '<p>这些也是真实的案例内容，点赞和评论都很多，只是我们读过的评论里没有人问价、问怎么买。它们不直接带来生意，但把品牌传播了出去，适合拿来做品牌宣传，也很值得参考。</p>'
      + top3(list, function (b) {
        return '<a class="br" href="' + esc(b.href) + '" target="_blank" rel="noopener">'
          + (b.cover ? '<img src="' + B + esc(b.cover) + '" alt="" loading="lazy">' : '<span></span>')
          + '<div style="min-width:0"><h4>' + esc(b.title || '（无标题）') + '</h4><div class="sub">' + esc(b.name) + (b.type ? ' · ' + esc(b.type) : '') + '</div>'
          + '<div class="num">点赞 ' + b.like.toLocaleString() + (b.comments ? ' · 评论 ' + b.comments : '') + ' · 判过 ' + b.judged + ' 条评论，0 条想买</div>'
          + (b.quote ? '<div class="q">热评「' + esc(b.quote) + '」</div>' : '') + '</div></a>';
      }, '条') + '</div></details>';
  }

  // 开头导语（10-31 用户定）：按数据生成，重点讲两件事——这一行找到了靠部署案例内容矩阵获客的号；
  // 拆解后评估了它们的结构，多少适合做成 AI 产线批量低成本出片。末尾保留 AI 写的「最值得记住的一点」
  function introText(d, c) {
    var n = d.accounts.length, pl = {}, order = [];
    d.accounts.forEach(function (a) { var p = a.platform || '其他'; if (!pl[p]) { pl[p] = 0; order.push(p); } pl[p]++; });
    var pls = order.map(function (p) { return p + ' ' + pl[p] + ' 个'; }).join('、');
    var t = '我们在' + d.name + '这一行找到了 ' + n + ' 个靠部署案例内容矩阵获客的号（' + pls + '）：' + (n > 1 ? '它们' : '它') + '持续、成批地发自家真实做过的案例，'
      + (d.totals.intent ? '评论里一共有 ' + d.totals.intent.toLocaleString() + ' 人在问价、问怎么买。' : '评论里的购买意向还在统计。');
    var pf = d.pipeline_fit || {}, k = 0, cnt = { '适合做成产线': 0, '部分适合': 0, '不适合': 0 };
    d.accounts.forEach(function (a) { var x = pf[a.slug]; if (x) { k++; cnt[x.verdict] = (cnt[x.verdict] || 0) + 1; } });
    if (k) {
      t += (n > 1 ? '我们逐条拆解了其中 ' + k + ' 个号，评估它们的' : '我们逐条拆解了这个号，评估它的') + '内容结构能不能做成 AI 产线：'
        + [['适合', cnt['适合做成产线']], ['部分适合', cnt['部分适合']], ['不适合', cnt['不适合']]]
            .filter(function (r) { return r[1]; }).map(function (r) { return r[1] + ' 个' + r[0]; }).join('、') + '。';
      t += cnt['适合做成产线']
        ? '适合的号，门店只要交素材，就能按同一个剧本批量、低成本地出片，像' + (k > 1 ? '它们' : '它') + '一样把案例内容铺开。'
        : cnt['部分适合']
          ? (k > 1 ? '这些号' : '这个号') + '里能固定下来的那部分剧本可以做成产线，门店交素材就能批量、低成本地出片；其余部分还得真人来做。'
          : '这一行的带客内容主要靠真人和临场发挥，换素材套剧本复制不出效果。';
    } else {
      t += (n > 1 ? '这些号' : '这个号') + '的逐条拆解还在做，做完后会逐个评估能不能做成 AI 产线、批量低成本地出片。';
    }
    var m = c && /最值得记住的一点[：:]\s*(.+)$/.exec(c.intro || '');
    return t + (m ? '最值得记住的一点：' + m[1] : '');
  }

  function render(d) {
    var c = d.content, t = d.totals, n = d.accounts.length;
    document.title = 'AKKE · 行业专题 · ' + d.name;
    document.getElementById('crumbName').textContent = d.name + ' · 行业专题';
    var ac = {};
    (c ? c.accounts : []).forEach(function (x) { ac[x.slug] = x; });

    var h = '<section class="detail-hero"><div class="wrap">'
      + '<a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a>'
      + '<span class="eyebrow" style="margin-left:16px">行业专题 · ' + esc(d.name) + '</span>'
      + '<h1>' + esc(c ? c.headline : d.name + '：别人家的案例内容怎么做') + '</h1>'
      + '<p class="lede">' + esc(n ? introText(d, c) : (c ? c.intro : '这一行我们还在调研。')) + '</p>'
      + (n ? '<div class="filter-row" style="margin-top:24px">' + tags([
          ['调研账号', n + ' 个'], ['扫描作品', t.scanned + ' 条'], ['真实案例', t.cases + ' 条'],
          ['评论里想买', t.intent + ' 条', ' style="background:var(--accent-soft);color:var(--accent)"']]) + '</div>' : '')
      + '</div></section><section style="padding-top:0"><div class="wrap">';

    if (n && d.accounts.some(function (a) { return a.cost; })) {
      h += '<div class="shead reveal in" style="margin-top:40px"><span class="eyebrow">投入和产出</span>'
        + '<h2>前 3 个号：照着拍一条要花多少、带来多少想买的人</h2>'
        + '<p class="lede">投入按我们对每个号的逐条分析估算：照它的拍法做一条，用什么设备、人要花多久、AI 整理剪辑的算力费。「每条合计」把人的时间按 55 元/小时折成钱一起算——一条视频真正的成本大头是人。产出是那个号评论里想买的人最多的一条视频。</p></div>'
        + ioTable(d, ac);
    }

    var nm = {}; d.accounts.forEach(function (a) { nm[a.slug] = a.name; });
    var fits = (c && c.ai_fit) || [], merge = !!n, byAcct = {}, orphan = [];
    if (merge) fits.forEach(function (f) { (nm[f.slug] ? (byAcct[f.slug] = byAcct[f.slug] || []) : orphan).push(f); });
    if (merge) {
      // 10-31 用户定（装修试过后推到全部行业）：「哪些适合 AI 仿造」并进「这一行我们调研了谁」，每种讲法挂在对应的号下；展开 3 个（用户先要 5 个，后改回 3 个）
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">这一行我们调研了谁 · 哪些适合 AI 仿造</span>'
        + '<h2>' + n + ' 个账号，各自怎么用案例内容获客' + (n > 10 ? '（列前 10 个）' : '') + '</h2>'
        + '<p class="lede">按评论里想买的人数排。「评论里想买」是我们读了每条视频前 200 条评论后，数出来在问价、问怎么买、想要同款、问门店、已经下单的条数——比点赞更接近生意。引文出自我们对这个号评论里想买最多的三条视频的逐条拆解。</p>'
        + '<p class="lede">每个号下面先判断「能不能做成 AI 产线」：借它带来想买的人的那几条视频的剧本，做成一条产线，以后门店只要交素材，就按同一个剧本自动出不同的视频。不是每种拍法都适合——靠真人临场表达、一次性事件，或每条都要专业人士现想的内容，换素材套剧本复制不出效果。</p>'
        + '<p class="lede">再往下是「哪些适合 AI 仿造」：' + AF_H2 + '。' + AF_LEDE + '</p></div>'
        + top3(d.accounts, function (a) { return acctBlock(a, ac[a.slug], byAcct[a.slug] || [], (d.pipeline_fit || {})[a.slug]); }, '个号')
        + (orphan.length ? '<div class="af">' + orphan.map(function (f) { return aiFitItem(f, nm, true); }).join('') + '</div>' : '');
    } else if (n) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">这一行我们调研了谁</span>'
        + '<h2>' + n + ' 个账号，各自怎么用案例内容获客' + (n > 10 ? '（列前 10 个）' : '') + '</h2>'
        + '<p class="lede">按评论里想买的人数排。「评论里想买」是我们读了每条视频前 200 条评论后，数出来在问价、问怎么买、想要同款、问门店、已经下单的条数——比点赞更接近生意。引文出自我们对这个号评论里想买最多的三条视频的逐条拆解。</p></div>'
        + top3(d.accounts, function (a) { return acctBlock(a, ac[a.slug]); }, '个号');
    }

    // 「有没有共性」10-30 用户定去掉

    // 销售顺序（10-29）：同行怎么做 → 共性 → 哪些适合 AI 仿造 → 已打造的产线 → 怎么部署；参考类的收起放后面
    // 海外同行（10-30）算「同行怎么做」，放在共性之后
    h += overseasBlock(d.overseas);
    if (!merge) h += aiFitBlock(c && c.ai_fit, nm);
    h += replicasBlock(d.replicas, d.samples);
    h += deployBlock(d.deploy, false);     // 10-30：默认折叠

    if (c && c.cross && c.cross.length) {
      // 默认收起（用户 10-29 定），和部署方案、研究清单同一种折叠样式
      h += '<details class="dp"><summary>别的行业可以借什么：' + c.cross.length + ' 种讲法<small>出自那些号的完整拆解</small></summary><div class="db">'
        + '<p>每一条都出自我们对那个号的完整拆解（挑出评论里想买最多的三条视频逐条分析），不是凭感觉推荐。点「看这个号」能看到原视频和拆解报告。</p>'
        + c.cross.map(function (x) {
          return '<div class="xr"><a target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(x.slug) + '"><img src="' + B + esc(x.poster.src) + '" alt="' + esc(x.name) + '" loading="lazy" width="' + x.poster.w + '" height="' + x.poster.h + '"></a>'
            + '<div><div class="from">' + esc(x.cat) + ' · ' + esc(x.name) + (x.intent != null ? ' · 评论里想买 ' + x.intent + ' 条' : '') + '</div>'
            + '<h3>' + esc(x.method) + '</h3><dl>'
            + '<dt>他们怎么做</dt><dd>' + esc(x.what) + '</dd>'
            + '<dt>为什么适合你</dt><dd>' + esc(x.fit) + '</dd>'
            + '<dt>你可以这样做</dt><dd class="ap">' + esc(x.apply) + '</dd>'
            + '<dt>依据</dt><dd class="ev">' + esc(x.evidence) + '</dd></dl>'
            + '<p style="margin:10px 0 0"><a class="go" target=\"_blank\" rel=\"noopener\" href=\"' + CR.acctURL(x.slug) + '">看这个号 &rarr;</a></p></div></div>';
        }).join('') + '</div></details>';
    }

    h += watchBlock(d.watch);

    if (!c) {
      h += '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">分析</span><h2>正在整理</h2>'
        + '<p class="lede">这一行的共性和可以借鉴的讲法还在整理中，先看上面的账号。</p></div>';
    } else {
      h += '<div class="edge" style="margin-top:40px"><span class="tag">注意</span><span class="et">' + esc(c.caveats)
        + '</span></div><p class="ai-note">分析由 AI 基于我们的调研数据和拆解报告整理，整理于 ' + esc((c.generated_at || '').slice(0, 10)) + '。</p>';
    }
    h += brandBlock(d.brand);              // 10-30：最下面，品牌宣传参考
    h += '<div class="refnote">' + (d.disclaimer || '') + '</div></div></section>';
    app.innerHTML = h;
  }

  if (!ikey) { CR.fail(app, '地址里缺少行业。'); return; }
  CR.getJSON(B + 'db/industry/' + encodeURIComponent(ikey) + '.json').then(render)
    .catch(function () { CR.fail(app, '找不到这个行业的专题页（' + ikey + '）。'); });
})();
</script>
</body></html>
