<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 参考案例集</title>
<meta name="description" content="参考案例集账号页：真实案例视频、判定规则与拆解报告。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=92f4faf0cc">
<style>
.rl-msg{font-size:12px;color:var(--bad);min-height:1.2em;margin-top:10px;}
.vcard.relabeled .vrelabel{white-space:normal;text-align:left;}
.it-sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.it-ex{display:flex;flex-direction:column;gap:6px;}
.it-ex span{font-size:13px;line-height:1.5;}
.it-ex i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
.vtab td.it-n{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;}
.vcard .itb{background:var(--accent-soft);color:var(--accent);}
</style>
</head><body>
<!-- 固定模板：所有账号共用这一页，?s=<slug> 决定显示哪个号，数据来自 db/<slug>.json。
     新增账号不改这个文件。重标注直接提交到共用标注库，同一条视频以最后一次为准。 -->
<div class="wrap">
  <nav class="crumb"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><a href="/akke/case-refs">参考案例集</a><span class="sep">/</span><span style="color:var(--ink)" id="crumbName"></span></nav>
</div>
<div id="app"><section class="detail-hero"><div class="wrap"><a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a><h1>正在加载…</h1></div></section></div>

<div class="rl-mask" id="rlMask"><div class="rl-box" role="dialog" aria-modal="true" aria-labelledby="rlTitle">
  <h4 id="rlTitle"></h4>
  <div class="rl-cur" id="rlCur"></div>
  <div class="rl-lab">这条是案例吗</div>
  <div class="rl-row" id="rlIs"><button type="button" data-v="1">是案例</button><button type="button" data-v="0">不是</button></div>
  <div class="rl-lab">属于哪一类</div>
  <div class="rl-row dim" id="rlTy">
    <button type="button" data-v="use">用户使用案例</button>
    <button type="button" data-v="process">产品服务客户过程案例</button>
    <button type="button" data-v="result">交付结果案例</button>
    <button type="button" data-v="log">商家经营日志案例</button>
    <button type="button" data-v="other">其他</button>
  </div>
  <input id="rlOther" placeholder="其他类型，填写名称…" hidden>
  <input id="rlNote" placeholder="备注：规则哪里不对、拿不准的地方，写这里…">
  <div class="rl-msg" id="rlMsg" aria-live="polite"></div>
  <div class="rl-act">
    <button type="button" class="pri" id="rlSave">提交</button>
    <button type="button" class="del" id="rlDel" hidden>撤销这条标注</button>
    <button type="button" id="rlClose">取消</button>
  </div>
</div></div>
<div class="rl-bar" id="rlBar"><span id="rlCount"></span><button type="button" class="pri" id="rlLegacy" hidden>提交本机旧标注</button></div>

<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, B = CR.BASE, app = document.getElementById('app');
  var slug = CR.param('s');
  var TYPES = { use: '用户使用案例', process: '产品服务客户过程案例', result: '交付结果案例', log: '商家经营日志案例', other: '其他' };
  var store = {};          // 本账号的线上标注 {视频 id: {is,type,other,note}}

  /* ---------- 渲染 ---------- */
  function filterTags(rows) {
    return rows.map(function (r) {
      return '<span class="filter-tag"' + (r[2] || '') + '><b>' + esc(r[0]) + '</b> ' + esc(r[1]) + '</span>';
    }).join('');
  }

  function card(v) {
    var badges = v.badges.map(function (b) {
      if (b.k === 'ty') return '<span class="ty' + (b.dim ? ' tydim' : '') + '" title="' + esc(b.tip) + '">' + esc(b.t) + '</span>';
      return '<span class="' + b.k + '">' + esc(b.t) + '</span>';
    }).join('');
    var tags = v.tags.length ? '<div class="vtags">' + esc(v.tags.join(' ')) + '</div>' : '';
    if (v.intent) badges = '<span class="itb" title="评论里判出的购买意向条数">意向 ' + v.intent + '</span>' + badges;
    var td = v.td ? '<a class="vgo" style="display:block;margin:8px 0 2px;padding:6px 10px;border-radius:6px;background:var(--accent-soft);text-align:center" href="' + B + esc(v.td) + '">查看拆解报告 &rarr;</a>' : '';
    return '<div class="vcard" data-id="' + esc(v.id) + '" data-tk="' + esc(v.type) + '" data-tn="' + esc(v.type_name) + '" data-src="' + esc(v.type_src) + '" data-title="' + esc(v.full) + '">'
      + '<a class="vlink" href="' + esc(v.href) + '" target="_blank" rel="noopener" title="判定 ' + v.score + ' 分 · ' + esc(v.why) + '">'
      + '<div class="vthumb"><img src="' + B + esc(v.cover) + '" alt="' + esc(v.alt) + '" loading="lazy" width="323" height="430" decoding="async"></div>'
      + '<div class="vtitle">' + esc(v.title) + '</div></a>'
      + '<div class="vmeta"><div class="vstat2"><span class="like">' + esc(v.stat) + '</span>' + badges + '</div>'
      + tags + td + '<div class="vfoot"><a class="vgo" href="' + esc(v.href) + '" target="_blank" rel="noopener">在' + esc(v.pname) + '打开 &rarr;</a>'
      + '<button class="vrelabel" type="button">重标注</button></div></div></div>';
  }

  function ruleBox(r) {
    if (!r) return '';
    return '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">这一行怎么判的</span>'
      + '<h2>' + esc(r.name) + ' 的判定规则</h2>'
      + '<p class="lede">案例 ＝ 画面是自家做出来的活，<strong>且指向一次真实的交易或交付</strong>。'
      + '不要求点名客户或写地址。满 ' + r.threshold + ' 分收录，而「命中本行业主营内容」只是前提、不够线——' + esc(r.kind_doc) + '</p></div>'
      + '<div class="tscroll"><table class="vtab"><thead><tr><th>信号</th><th>分</th><th>说明</th></tr></thead><tbody>'
      + r.rows.map(function (x) { return '<tr><td>' + esc(x[0]) + '</td><td class="n">' + esc(x[1]) + '</td><td>' + esc(x[2]) + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  }

  // 评论里的购买意向：每条视频取前 200 条评论（平台热度顺序），AI 逐条判。数据见 scrape/intent.py
  function intent(it) {
    if (!it) return '';
    var hit = it.per.filter(function (x) { return x.n > 0; }), zero = it.per.length - hit.length;
    var scope = '本页 ' + it.shown + ' 条视频里，' + (it.videos < it.shown - it.unavailable ? '已判 ' + it.videos + ' 条（其余还在抓取）' : it.videos + ' 条都判过')
      + '，每条取平台按热度排的前 ' + it.max_per_video + ' 条评论，共 ' + it.comments + ' 条，由 AI 逐条判断是不是在表达购买意向。作者本人的回复不算。'
      + (it.unavailable ? it.unavailable + ' 条' + '评论不公开，拿不到。' : '')
      + (it.judged_at ? '判于 ' + esc(it.judged_at.slice(0, 10)) + '。' : '');
    var sum = '<div class="it-sum">' + filterTags([['购买意向', it.total + ' 条', ' style="background:var(--accent-soft);color:var(--accent)"']].concat(it.kinds.map(function (k) { return [k[0], k[1] + ' 条']; }))) + '</div>';
    var rows = hit.map(function (x) {
      var ex = x.ex.map(function (e) { return '<span><i>' + esc(e.k) + '</i>' + esc(e.t) + '</span>'; }).join('');
      return '<tr><td><a href="' + esc(x.href) + '" target="_blank" rel="noopener">' + esc(x.title || '（无文案）') + '</a></td>'
        + '<td class="it-n">' + x.n + ' / ' + x.comments + '</td><td><div class="it-ex">' + ex + '</div></td></tr>';
    }).join('');
    var table = hit.length
      ? '<div class="tscroll" style="margin-top:20px"><table class="vtab"><thead><tr><th>视频</th><th>意向 / 评论</th><th>评论原话（点赞最多的几条）</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        + (zero ? '<p class="visual-cap" style="margin-top:10px">其余 ' + zero + ' 条视频的评论里没有判出购买意向。</p>' : '')
      : '<p class="lede" style="margin-top:16px">判过的评论里一条购买意向都没有——评论区在聊内容本身，没人问价、问怎么买。</p>';
    return '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">评论里的购买意向</span>'
      + '<h2>' + (it.total ? it.total + ' 条评论在问价、问怎么买、想要同款' : '评论里没有判出购买意向') + '</h2>'
      + '<p class="lede">' + scope + '</p>' + sum + '</div>' + table;
  }

  function teardown(t) {
    if (!t) return '';
    return '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">点赞前 ' + t.n + ' 条 · 综合拆解</span>'
      + '<h2>' + esc(t.headline) + '</h2><p class="lede">' + esc(t.summary) + '</p></div>'
      + '<details class="td-fold" style="margin-top:20px;border:1px solid var(--line,#e2dfe6);border-radius:10px;background:#fff">'
      + '<summary style="cursor:pointer;padding:14px 18px;font-weight:600">展开综合报告：三条对照、共通与不同、能否用同一个工作流、AI 制作流水线（选型 / 机器与人工耗时 / 单集成本）'
      + '<span style="font-weight:400;color:#6b6573">　·　每条的单独拆解在下方案例卡片上　拆解于 ' + esc(t.analyzed_at) + '</span></summary>'
      + '<div style="padding:0 18px 18px">' + t.html + '</div></details>';
  }

  function render(d, rej) {
    document.title = 'AKKE · 参考案例集 · ' + d.reg_name;
    document.getElementById('crumbName').textContent = d.reg_name;
    var cases = d.cases, n = cases.length;
    var head = filterTags([[d.id_label, d.id_value], ['粉丝', d.fans], ['获赞', d.likes], ['作品', d.works], ['扫描', d.scanned + ' 条']])
      + filterTags([['判为案例', d.total + ' 条', d.total ? ' style="background:var(--accent-soft);color:var(--accent)"' : ' style="background:var(--bad-soft);color:var(--bad)"'],
                    ['命中率', d.hit_rate + '%']]);
    var pts = d.points.map(function (p) {
      return '<div class="hl-item"><span class="sq"></span><span class="txt"><span class="term">' + esc(p[0]) + '</span> — ' + esc(p[1]) + '</span></div>';
    }).join('');
    var grid, stats;
    if (n) {
      var more = d.low_data
        ? '　这个号的案例<strong>数据普遍偏低</strong>——全部 ' + d.total + ' 条里没有 ' + d.min_show + ' 条达到 ' + d.floor + ' 赞，所以这里只列它最好的 ' + n + ' 条。内容判定没问题，但传播成绩不代表可以照搬。'
        : '　全量 ' + d.total + ' 条，这里展示其中<strong>达到 ' + d.floor + ' 赞</strong>的前 ' + n + ' 条——样板库要给的是真实案例里数据表现好的，不是全部案例。完整数据在仓库 <code>case-refs/data/</code>。';
      grid = '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">真实案例</span>'
        + '<h2>' + n + ' 条案例，按点赞从高到低</h2>'
        + '<p class="lede">每张卡片标着判定得分和理由，可以逐条核对。点击打开' + esc(d.platform_name) + '原内容。' + more + '</p></div>'
        + '<div class="vgrid">' + cases.map(card).join('') + '</div>';
      stats = ['扫描作品 ' + d.scanned + ' 条', '判为真实案例 ' + d.total + ' 条，命中率 ' + d.hit_rate + '%',
               d.low_data ? '本页只列它最好的 ' + n + ' 条（整号数据偏低）' : '本页展示 ≥' + d.floor + ' 赞的 ' + n + ' 条',
               '最高单条 ' + d.max_like + ' 赞', '封面取自平台原图，卡片直链原内容'];
    } else {
      grid = '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">真实案例</span><h2>一条都没有</h2>'
        + '<p class="lede">' + d.scanned + ' 条作品全部扫过，没有一条能指向一次具体的交付。这不是抓取失败，是这个号的内容本来就不是案例——收录它恰恰因为它是个有价值的反面样本。</p></div>';
      stats = ['扫描作品 ' + d.scanned + ' 条', '判为真实案例 0 条', '不是抓取失败，是内容本身不指向具体交付', '收录为反面样本'];
    }
    stats = stats.map(function (x) { return '<div class="rule-item"><span class="check">&#10003;</span>' + esc(x) + '</div>'; }).join('');

    app.innerHTML = '<section class="detail-hero"><div class="wrap">'
      + '<a class="back-link" href="/akke/case-refs">&larr; 返回参考案例集</a>'
      + '<span class="eyebrow" style="margin-left:16px">' + esc(d.cat) + ' · ' + esc(d.city) + ' · 抖音</span>'
      + '<h1>' + esc(d.name) + '</h1><p class="lede">' + esc(d.lede) + '</p>'
      + '<p class="intro-copy">下面只列<strong>真实案例</strong>——口播、生活日常、泛科普、促销这些不收录，也不做分析。'
      + '判定规则是评分制，满 3 分收录，每条的得分和理由都标在卡片上。数据抓取于 ' + esc(d.captured_at) + '，数值为抓取当时的显示值。</p>'
      + '<div class="filter-row" style="margin-top:24px">' + head + '</div>'
      + (d.review === 'pending' ? '<div class="rv-box" id="rvBox"></div>' : '') + '</div></section>'
      + '<section style="padding-top:0"><div class="wrap"><div class="mod reveal in"><div class="mod-main">'
      + '<p class="desc">这个号值得看的地方：</p><div class="hl-list">' + pts + '</div>'
      + '<div class="edge"><span class="tag">注意</span><span class="et">判定规则是启发式的，不是人工逐条判定。单一账号的样本说明不了全行业，这里看的是呈现形式，不是成效结论。</span></div>'
      + '</div><div class="mod-side"><div class="mod-visual"><div class="rule-list">' + stats + '</div>'
      + '<p class="visual-cap">判断规则与原始数据都在仓库里（case-refs/），可复跑、可修正。</p>'
      + '<div class="visual-stats mono"><span class="vstat' + (n ? ' on' : '') + '">案例占比 <b>' + Math.round(d.hit_rate) + '%</b></span><span class="vstat">行业 <b>' + esc(d.cat) + '</b></span></div>'
      + '</div></div></div>'
      + intent(d.intent) + teardown(d.teardown) + grid + ruleBox(d.rule)
      + '<div class="shead reveal in" style="margin-top:56px"><span class="eyebrow">对我们意味着什么</span><h2>' + esc(d.takeaway) + '</h2></div>'
      + '<p class="link-copy reveal in">这一页的结论会进<a href="https://upio.ai/akke/website#case">成功案例获客</a>的选题与表达方式参考库，用来指导我们给客户做的案例怎么包装，不会把这个号的案例装到任何客户身上。</p>'
      + '<div class="refnote">' + rej + '</div></div></section>';
  }

  /* ---------- 重标注：直接提交到共用标注库 ---------- */
  var mask = document.getElementById('rlMask'), bar = document.getElementById('rlBar'),
      rowIs = document.getElementById('rlIs'), rowTy = document.getElementById('rlTy'),
      oth = document.getElementById('rlOther'), note = document.getElementById('rlNote'),
      del = document.getElementById('rlDel'), msg = document.getElementById('rlMsg'),
      save = document.getElementById('rlSave'), cur = null, sel = {};

  function paint() {
    var n = 0;
    document.querySelectorAll('.vcard').forEach(function (c) {
      var r = store[c.dataset.id];
      c.classList.toggle('relabeled', !!r);
      var b = c.querySelector('.vrelabel');
      if (b) b.textContent = r ? ('已重标 · ' + (r.is === '1' ? (TYPES[r.type] || r.other || '案例') : '不是案例') + ' · 待生效') : '重标注';
      if (r) n++;
    });
    var legacy = legacyRows();
    document.getElementById('rlCount').textContent = '本账号已重标 ' + n + ' 条，下次入库时生效' + (legacy.length ? '　·　本机还有 ' + legacy.length + ' 条旧标注没提交' : '');
    document.getElementById('rlLegacy').hidden = !legacy.length;
    bar.classList.toggle('on', n > 0 || legacy.length > 0);
  }
  function pick(row, v) { row.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); }

  function open(c) {
    cur = c;
    var r = store[c.dataset.id] || {};
    sel = { is: r.is || '', type: r.type || '' };
    document.getElementById('rlTitle').textContent = c.dataset.title || '（无文案）';
    document.getElementById('rlCur').textContent = '规则当前判为：' + (c.dataset.tn || '未分类') + '（'
      + (c.dataset.src === 'default' ? '按本行业推定' : c.dataset.src === 'manual' ? '人工指定' : '由信号判出') + '）';
    pick(rowIs, sel.is); pick(rowTy, sel.type);
    rowTy.classList.toggle('dim', sel.is !== '1');
    oth.value = r.other || ''; oth.hidden = sel.type !== 'other';
    note.value = r.note || ''; msg.textContent = '';
    del.hidden = !store[c.dataset.id];
    mask.classList.add('on');
  }
  function close() { mask.classList.remove('on'); cur = null; }

  rowIs.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    sel.is = b.dataset.v; pick(rowIs, sel.is); msg.textContent = '';
    rowTy.classList.toggle('dim', sel.is !== '1');
    if (sel.is !== '1') { sel.type = ''; pick(rowTy, ''); oth.hidden = true; }
  });
  rowTy.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    sel.type = b.dataset.v; pick(rowTy, sel.type); oth.hidden = sel.type !== 'other';
    if (!oth.hidden) oth.focus();
  });
  save.addEventListener('click', function () {
    if (!cur) return;
    if (!sel.is) { msg.textContent = '先选「是案例」还是「不是」'; return; }
    var c = cur, row = { slug: slug, id: c.dataset.id, is: sel.is, type: sel.is === '1' ? sel.type : '',
      other: sel.type === 'other' ? oth.value.trim() : '', note: note.value.trim(),
      was: c.dataset.tk || '', was_src: c.dataset.src || '' };
    save.disabled = true; msg.textContent = '';
    CR.labels.save(row).then(function () {
      store[row.id] = row; paint(); close();
    }).catch(function (e) { msg.textContent = e.message + '，标注还没保存，可以再点一次提交。'; })
      .then(function () { save.disabled = false; });
  });
  del.addEventListener('click', function () {
    if (!cur) return;
    var id = cur.dataset.id;
    CR.labels.remove(slug, id).then(function () { delete store[id]; paint(); close(); })
      .catch(function (e) { msg.textContent = e.message; });
  });
  document.getElementById('rlClose').addEventListener('click', close);
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.vrelabel'); if (!b) return;
    e.preventDefault(); e.stopPropagation(); open(b.closest('.vcard'));
  });

  /* 旧版页面把重标注存在浏览器本地；这里一键补交，提交成功的从本地删掉 */
  var LKEY = 'akke-relabel-v1';
  function legacyAll() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch (e) { return {}; } }
  function legacyRows() { var s = legacyAll(); return Object.keys(s).map(function (k) { return s[k]; }); }
  document.getElementById('rlLegacy').addEventListener('click', function () {
    var btn = this, all = legacyAll(), keys = Object.keys(all), left = {};
    btn.disabled = true;
    keys.reduce(function (p, k) {
      return p.then(function () {
        return CR.labels.save(all[k]).then(function () {
          if (all[k].slug === slug) store[all[k].id] = all[k];
        }).catch(function () { left[k] = all[k]; });
      });
    }, Promise.resolve()).then(function () {
      try { Object.keys(left).length ? localStorage.setItem(LKEY, JSON.stringify(left)) : localStorage.removeItem(LKEY); } catch (e) {}
      btn.disabled = false; paint();
    });
  });

  /* ---------- 账号复核：按链接直接入库的号，看完给个结论 ---------- */
  function reviewBox() {
    var box = document.getElementById('rvBox'); if (!box) return;
    var st = '';
    function draw(rec) {
      box.innerHTML = '<h4>这个号按链接直接入库，还没复核</h4>'
        + '<p>看一遍下面的案例：这个号是不是我们要的那类商家（是商家自己的号、是这个品类本身、内容是自家交付），案例判得对不对。'
        + '给个结论，下次入库时生效；单条视频判错了用卡片上的「重标注」。</p>'
        + (rec ? '<p><strong>当前结论：' + (rec.status === 'pass' ? '通过' : '不收录') + '</strong>（' + esc(rec.ts.replace('T', ' ').slice(0, 16)) + '，待生效）'
               + (rec.note ? '　备注：' + esc(rec.note) : '') + '。可以改。</p>' : '')
        + '<div class="rl-row" id="rvSt"><button type="button" data-v="pass">通过，留在样板库</button><button type="button" data-v="reject">不收录</button></div>'
        + '<input id="rvNote" placeholder="理由（不收录时必填）：比如是用户自己的号、是代购不是商家…">'
        + '<div class="rv-act"><button type="button" id="rvGo" disabled>提交结论</button><span class="rv-msg" id="rvMsg" aria-live="polite"></span></div>';
      st = rec ? rec.status : '';
      pick(document.getElementById('rvSt'), st);
      document.getElementById('rvNote').value = rec ? rec.note : '';
      document.getElementById('rvGo').disabled = !st;
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('#rvSt button');
      if (b) { st = b.dataset.v; pick(document.getElementById('rvSt'), st); document.getElementById('rvGo').disabled = false; return; }
      if (!e.target.closest('#rvGo')) return;
      var note = document.getElementById('rvNote').value.trim(), m = document.getElementById('rvMsg');
      if (st === 'reject' && !note) { m.textContent = '不收录要写一句理由'; return; }
      e.target.disabled = true; m.textContent = '';
      CR.labels.review(slug, st, note).then(function () {
        draw({ status: st, note: note, ts: new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 19) });
        document.getElementById('rvMsg').textContent = '已提交';
      }).catch(function (err) { m.textContent = err.message; e.target.disabled = false; });
    });
    draw(null);
    CR.labels.getReview(slug).then(draw).catch(function () {});
  }

  /* ---------- 启动 ---------- */
  if (!slug) { CR.fail(app, '地址里缺少账号参数。从参考案例集列表点进来即可。'); return; }
  CR.getJSON(B + 'db/' + encodeURIComponent(slug) + '.json')
    .then(function (d) {
      render(d, d.disclaimer);
      paint();
      reviewBox();
      return CR.labels.load(slug).then(function (l) { store = l; paint(); })
        .catch(function () { document.getElementById('rlCount').textContent = '标注库暂时连不上，重标注会提交失败'; bar.classList.add('on'); });
    })
    .catch(function (e) {
      CR.fail(app, /404/.test(e.message) ? '没有找到账号「' + slug + '」。它可能已经从样板库摘出，或者地址拼错了。' : '数据文件读取失败（' + e.message + '）。刷新一次试试。');
    });
})();
</script>
</body></html>
