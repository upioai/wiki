<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKKE · 工人管理</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/akke/case-refs/case-refs.css?v=ae395bf37a">
<style>
.ow{max-width:1120px;margin:0 auto;padding:0 20px 64px;}
.ow h1{font-size:28px;margin:22px 0 4px;line-height:1.3;}
.ow .sub{font-size:13px;color:var(--ink-faint);margin:0;}
.ow .blk{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-top:16px;}
.ow .blk>h2{font-size:15px;margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.ow .blk>h2 small{font-size:12px;font-weight:400;color:var(--ink-faint);}
.ow .mono{font-family:"IBM Plex Mono",monospace;}
.ow .pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--empty-soft);color:var(--ink-soft);}
.ow .pill.good{background:var(--good-soft);color:var(--good);}
.ow .pill.bad{background:var(--bad-soft);color:var(--bad);}
.ow .pill.warn{background:var(--warn-soft);color:var(--warn);}
.ow .pill.run{background:var(--accent-soft);color:var(--accent);}
.ow .st{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ow .doing{margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--ink);word-break:break-all;}
.ow .doing.idle{color:var(--ink-faint);}
.ow .note{font-size:12.5px;color:var(--ink-faint);margin:8px 0 0;line-height:1.55;}
.ow .sw{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ow .sw input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);width:160px;max-width:100%;}
.ow .sw .ask{font-size:14px;font-weight:600;flex-basis:100%;}
.ow .sw .err{flex-basis:100%;font-size:13px;color:var(--bad);}
.ow button.b{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;}
.ow button.b:hover{border-color:var(--accent);color:var(--accent);}
.ow button.b.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.ow button.b.main:hover{background:var(--accent-strong);color:var(--accent-ink);}
.ow button.b.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.ow button.b:disabled{opacity:.5;cursor:default;}
.ow .pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.ow .pc{background:var(--paper-sunken);border-radius:10px;padding:12px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
.ow .pc b{color:var(--ink);font-size:14px;}
.ow .bar{height:6px;border-radius:3px;background:var(--line);margin:6px 0;overflow:hidden;}
.ow .bar i{display:block;height:100%;background:var(--accent);}
.ow .bar i.full{background:var(--bad);}
.ow .rows{display:grid;gap:8px;}
.ow details.row{background:var(--paper-sunken);border-radius:10px;border-left:4px solid var(--empty);}
.ow details.row.running{border-left-color:var(--accent);}
.ow details.row.done{border-left-color:var(--good);}
.ow details.row.interrupted{border-left-color:var(--warn);background:var(--warn-soft);}
.ow details.row.failed{border-left-color:var(--bad);background:var(--bad-soft);}
.ow details.row>summary{cursor:pointer;padding:9px 12px;font-size:13.5px;line-height:1.55;color:var(--ink);list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;}
.ow details.row>summary::-webkit-details-marker{display:none;}
.ow .row .main{word-break:break-all;}
.ow .row .meta{font-size:12px;color:var(--ink-faint);word-break:break-all;}
.ow .row .tag{font-size:12px;font-weight:700;white-space:nowrap;}
.ow .kv{margin:0;padding:4px 12px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;}
.ow .kv dt{color:var(--ink-faint);}
.ow .kv dd{margin:0;color:var(--ink-soft);word-break:break-all;}
.ow .qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.ow .q{background:var(--paper-sunken);border-radius:10px;padding:12px;min-width:0;}
.ow .q h3{font-size:14px;margin:0 0 8px;}
.ow .q h3 small{font-weight:400;color:var(--ink-faint);font-size:12px;margin-left:6px;}
.ow .q ol{margin:0;padding-left:22px;font-size:12.5px;line-height:1.65;color:var(--ink-soft);}
.ow .q li{word-break:break-all;}
.ow .q .none{font-size:12.5px;color:var(--ink-faint);}
.ow .evt{width:100%;border-collapse:collapse;font-size:12.5px;}
.ow .evt th{text-align:left;font-weight:600;color:var(--ink-faint);padding:6px 8px;white-space:nowrap;}
.ow .evt td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink-soft);word-break:break-all;}
.ow .scroll{max-height:420px;overflow:auto;border-radius:10px;}
.ow pre.log{margin:0;max-height:360px;overflow:auto;background:var(--paper-sunken);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap;word-break:break-all;font-family:"IBM Plex Mono",monospace;}
.ow .empty{font-size:13px;color:var(--ink-faint);margin:0;}
.ow .offline-note{color:var(--bad);font-size:13px;margin:10px 0 0;}
@media (max-width:520px){
  .ow h1{font-size:22px;}
  .ow .blk{padding:14px 12px;}
}
</style>
</head><body>
<!-- 工人管理页（2026-10-31 我定，设计 6.5）：固定模板，publish.py 拷到 ops/worker.html（两段路径，避开站点把一段路径当旧账号地址的跳转）。
     数据全从 /api/case-refs/labels 实时取，每 30 秒刷一次；谁都能开关（用户定，不加鉴权）。
     ?api=<地址> 可以换接口、?queue=<地址> 可以换标注队列，本地测试用，默认线上。 -->
<div class="ow">
  <nav class="crumb" style="padding-top:22px"><a href="https://upio.ai/">upio.ai</a><span class="sep">/</span><a href="https://upio.ai/akke/website">Akke</a><span class="sep">/</span><a href="/akke/case-refs">参考案例集</a><span class="sep">/</span><span style="color:var(--ink)">工人管理</span></nav>
  <h1>工人管理</h1>
  <p class="sub" id="upd">正在加载…</p>
  <div id="app"></div>
</div>
<script src="/akke/case-refs/app.js?v=764d774a8f"></script>
<script>
(function () {
  var esc = CR.esc, app = document.getElementById('app');
  // ?api= / ?queue= 只在本机预览时认（别人发来带 ?api= 的链接不能把页面指到外站），畸形的 % 序列不让页面挂掉
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  function opt(k) { if (!LOCAL) return ''; try { var v = CR.param(k); return /^\/(?!\/)/.test(v) ? v : ''; } catch (e) { return ''; } }
  var API = opt('api') || '/api/case-refs/labels';
  var DBQ = opt('queue') || (CR.BASE + 'db/ops-label-queue.json');
  var REFRESH = 30000, OFFLINE_MS = 5 * 60 * 1000;
  var PLAT = { dy: '抖音', xhs: '小红书', tt: 'TikTok' };
  var QNAME = { fallback: '待保底', outside: '名单外，不补抓', teardown: '待拆解', industry: '待写行业专题', noncase: '待抽非案例评论', refresh: '待刷新' };
  var JSTAT = { running: '抓取中', done: '完成', failed: '失败', interrupted: '中断', rejected: '拒收', needs_industry: '待补行业' };
  var ESTAT = { ok: '完成', stopped: '停下', crash: '崩溃', interrupted: '中断' };
  var S = { beat: undefined, sw: null, jobs: null, events: null, queue: null, err: '', open: {}, ask: null, busy: false, swErr: '' };
  var firstLog = true;

  function api(kind) { return CR.getJSON(API + (API.indexOf('?') < 0 ? '?' : '&') + 'kind=' + kind); }

  // ts 是北京时间（无时区后缀）
  function parseTs(s) {
    if (!s) return NaN;
    return Date.parse(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s + '+08:00');
  }
  function hm(s) { return s ? String(s).replace('T', ' ').slice(5, 16) : ''; }
  function bj(ms) { return new Date(ms + 8 * 3600e3).toISOString(); }
  function ago(ms) {
    if (!(ms >= 0)) return '';
    var m = Math.floor(ms / 60000);
    if (m < 1) return '不到 1 分钟';
    if (m < 60) return m + ' 分钟';
    var h = Math.floor(m / 60);
    return h < 24 ? h + ' 小时 ' + (m % 60) + ' 分钟' : Math.floor(h / 24) + ' 天';
  }
  // 心跳、job 等是任何人都能写的任意 JSON：进页面前数字一律转数字，其余一律 esc，不信任字段类型
  function num(x) { x = Number(x); return isFinite(x) ? x : 0; }
  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined; }
  function name() { try { return localStorage.getItem('cr-ops-name') || ''; } catch (e) { return ''; } }
  function setName(v) { try { localStorage.setItem('cr-ops-name', v); } catch (e) {} }

  function online() {
    var b = S.beat;
    if (!b) return { ok: false, why: '离线（从没上报过）' };
    var age = Date.now() - parseTs(b.ts);
    return age <= OFFLINE_MS ? { ok: true, age: age } : { ok: false, why: '离线', age: age };
  }
  function curOn() {
    if (S.sw && typeof S.sw.on === 'boolean') return S.sw.on;
    return S.beat && typeof S.beat.on === 'boolean' ? S.beat.on : null;
  }

  function blockStatus() {
    var o = online(), b = isObj(S.beat) ? S.beat : {}, on = curOn();
    var h = '<div class="blk"><h2>1 · 全局状态</h2><div class="st">'
      + '<span class="pill ' + (o.ok ? 'good' : 'bad') + '">' + (o.ok ? '在线' : esc(o.why)) + '</span>'
      + '<span class="pill ' + (on === true ? 'good' : on === false ? 'warn' : '') + '">开关：' + (on === true ? '开' : on === false ? '关' : '未设置') + '</span></div>';
    if (S.beat) h += '<p class="note">最后一次心跳：' + esc(hm(b.ts)) + (o.age >= 0 ? '（' + ago(o.age) + '前）' : '') + '</p>';
    var d = isObj(b.doing) ? b.doing : {};
    if (!o.ok) {
      h += '<p class="offline-note">' + (S.beat ? '工人离线，下面的用量、队列、日志是最后一次心跳带来的，不代表现在。' : '工人从没上报过心跳，没有可看的数据。') + '</p>';
    } else if (d.kind) {
      var since = parseTs(d.since);
      h += '<p class="doing"><b>' + esc(d.kind) + '</b>' + (d.target ? ' · ' + esc(d.target) : '') + (d.step ? ' · ' + esc(d.step) : '')
        + (since === since ? ' · 已做 ' + ago(Date.now() - since) : '') + '</p>';
    } else {
      h += '<p class="doing idle">闲着，没在做活。</p>';
    }
    return h + switchControl(on) + '</div>';
  }

  function switchControl(on) {
    var h = '<div class="sw">';
    if (S.sw == null) return h + '<span class="note" style="margin:0">开关状态读不到，暂时不能操作。</span></div>';
    if (S.ask === null) {
      h += '<button class="b ' + (on === true ? '' : 'main') + '" data-act="ask">'
        + (on === true ? '当前：开 · 点这里关闭工人' : '当前：' + (on === false ? '关' : '未设置') + ' · 点这里打开工人') + '</button>';
    } else {
      h += '<span class="ask">确认' + (S.ask ? '打开' : '关闭') + '工人？' + (S.ask ? '' : '它做完手上这一步就停，不会打断下载和抽帧。') + '</span>'
        + '<input id="by" maxlength="40" placeholder="你的名字（可空）" value="' + esc(name()) + '">'
        + '<button class="b ' + (S.ask ? 'main' : 'danger') + '" data-act="go"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '提交中…' : '确认' + (S.ask ? '打开' : '关闭')) + '</button>'
        + '<button class="b" data-act="cancel"' + (S.busy ? ' disabled' : '') + '>取消</button>';
    }
    if (S.swErr) h += '<span class="err">' + esc(S.swErr) + '</span>';
    var s = S.sw;
    if (s && s.ts) h += '<span class="note" style="flex-basis:100%;margin:0">上次改动：' + esc((s.by || '没留名') + ' · ' + hm(s.ts) + ' · ' + (s.on ? '开' : '关')) + '</span>';
    return h + '</div>';
  }

  function blockPace() {
    var p = S.beat && isObj(S.beat.pace) ? S.beat.pace : {}, keys = Object.keys(p);
    var h = '<div class="blk"><h2>2 · 今天的浏览用量 <small>用了 / 上限</small></h2>';
    if (!keys.length) return h + '<p class="empty">没有用量数据。</p></div>';
    h += '<div class="pace">';
    keys.forEach(function (k) {
      var x = isObj(p[k]) ? p[k] : {}, lim = num(x.limit), n = num(x.count), pct = lim ? Math.min(100, Math.round(n * 100 / lim)) : 0;
      var pu = typeof x.paused_until === 'string' ? Date.parse(x.paused_until) : NaN, paused = pu === pu && pu > Date.now();
      h += '<div class="pc"><b>' + esc(own(PLAT, k) || k) + '</b> <span class="mono">' + n + ' / ' + lim + '</span>'
        + (paused ? ' <span class="pill bad">暂停</span>' : '')
        + '<div class="bar"><i class="' + (lim && n >= lim ? 'full' : '') + '" style="width:' + pct + '%"></i></div>'
        + '最近开页：' + (isFinite(Number(x.last)) && Number(x.last) > 0 ? esc(hm(bj(Number(x.last)))) : '还没有') + '<br>间隔 ' + esc(Array.isArray(x.gap) ? x.gap.map(num).join('–') : '?') + ' 秒'
        + (paused ? '<br>暂停到 ' + esc(hm(bj(pu))) : '') + '</div>';
    });
    return h + '</div></div>';
  }

  function jobList() { var o = isObj(S.jobs) ? S.jobs : {}; return Object.keys(o).map(function (k) { return o[k]; }).filter(isObj); }
  function gaveUp(j) { return /^放弃：/.test(j.reason || ''); }
  // 提交人不在 discover/team.json 名单里的 job：工人不接（裁定 R），心跳的 queues.outside 列出它们
  function outside(j) {
    var q = S.beat && isObj(S.beat.queues) && Array.isArray(S.beat.queues.outside) ? S.beat.queues.outside : [];
    return q.some(function (x) { return isObj(x) && x.id && x.id === j.id; });
  }
  function byUpdated(a, b) { return String(b.updated || '').localeCompare(String(a.updated || '')); }
  function jobRow(j) {
    var id = j.id || '', cls = gaveUp(j) ? 'failed' : (j.status || '');
    var h = '<details class="row ' + esc(cls) + '" data-id="' + esc(id) + '"' + (S.open[id] ? ' open' : '') + '><summary>'
      + '<span class="main">' + esc(j.input || j.slug || id) + '</span>'
      + '<span class="tag">' + esc(gaveUp(j) ? '放弃' : (own(JSTAT, j.status) || j.status || '')) + '</span>'
      + '<span class="meta">' + esc([j.who, j.step, j.reason && !gaveUp(j) ? j.reason : '', outside(j) ? '名单外，不补抓' : ''].filter(Boolean).join(' · ')) + '</span>'
      + '<span class="meta">' + esc(hm(j.updated)) + '</span></summary><dl class="kv">';
    ['id', 'who', 'type', 'input', 'platform', 'slug', 'slugs', 'step', 'status', 'reason', 'claim', 'claim_at', 'started', 'updated'].forEach(function (k) {
      var v = j[k];
      if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
      h += '<dt>' + k + '</dt><dd>' + esc(Array.isArray(v) ? v.join('、') : v) + '</dd>';
    });
    return h + '</dl></details>';
  }

  function blockRunning() {
    var h = '<div class="blk"><h2>3 · 正在抓的 <small>状态是「抓取中」的提交记录，点一条看全部字段</small></h2>';
    if (S.jobs == null) return h + '<p class="empty">提交记录读不到。</p></div>';
    var rs = jobList().filter(function (j) { return j.status === 'running'; }).sort(byUpdated);
    h += rs.length ? '<div class="rows">' + rs.map(jobRow).join('') + '</div>' : '<p class="empty">现在没有在抓的。</p>';
    var rest = jobList().filter(function (j) { return j.status !== 'running'; }).sort(byUpdated).slice(0, 30);
    if (rest.length) {
      h += '<h2 style="margin-top:18px">最近结束的 <small>最新 30 条；中断黄色，失败 / 放弃红色，待补行业灰色</small></h2><div class="rows">' + rest.map(jobRow).join('') + '</div>';
    }
    return h + '</div>';
  }

  function qItem(x) {
    if (isObj(x)) return esc([x.input || x.id, x.status, x.reason].filter(Boolean).join(' · '));
    return esc(x);
  }
  function blockQueues() {
    var q = S.beat && isObj(S.beat.queues) ? S.beat.queues : {}, cnt = isObj(q.counts) ? q.counts : {};
    var h = '<div class="blk"><h2>4 · 队列 <small>各列前 20 条，「共」是总数</small></h2>';
    var keys = Object.keys(q).filter(function (k) { return k !== 'counts' && Array.isArray(q[k]); });
    if (!keys.length) return h + '<p class="empty">没有队列数据。</p></div>';
    h += '<div class="qs">';
    keys.forEach(function (k) {
      var xs = q[k];
      h += '<div class="q"><h3>' + esc(own(QNAME, k) || k) + '<small>共 ' + esc(cnt[k] != null ? cnt[k] : xs.length) + '</small></h3>'
        + (xs.length ? '<ol>' + xs.map(function (x) { return '<li>' + qItem(x) + '</li>'; }).join('') + '</ol>' : '<div class="none">空</div>') + '</div>';
    });
    return h + '</div></div>';
  }

  function blockEvents() {
    var h = '<div class="blk"><h2>5 · skill 使用记录 <small>最近 200 条，新的在上</small></h2>';
    if (S.events == null) return h + '<p class="empty">使用记录读不到。</p></div>';
    var es = (Array.isArray(S.events) ? S.events : []).filter(isObj).slice(0, 200);
    if (!es.length) return h + '<p class="empty">还没有记录。</p></div>';
    h += '<div class="scroll"><table class="evt"><tr><th>时间</th><th>谁</th><th>提交了什么</th><th>结果</th></tr>';
    es.forEach(function (e) {
      var args = Array.isArray(e.args) ? e.args.join(' ') : (e.args || '');
      var res = e.worker && e.status === 'ok' ? '工人补完' : (own(ESTAT, e.status) || e.status || '');
      h += '<tr><td class="mono" style="white-space:nowrap">' + esc(hm(e.ts)) + '</td><td>' + esc(e.who || '') + (e.worker ? ' <span class="pill run">工人</span>' : '') + '</td>'
        + '<td>' + esc(e.script || '') + ' ' + esc(args) + '</td>'
        + '<td style="white-space:nowrap">' + esc(res) + (e.secs != null && e.secs !== '' ? ' · ' + esc(e.secs) + 's' : '') + '</td></tr>';
    });
    return h + '</table></div></div>';
  }

  function blockLog() {
    var lines = S.beat && Array.isArray(S.beat.log_tail) ? S.beat.log_tail : [];
    var h = '<div class="blk"><h2>6 · 工人日志 <small>最近 ' + lines.length + ' 行，新的在下</small></h2>';
    if (!lines.length) return h + '<p class="empty">没有日志。</p></div>';
    return h + '<pre class="log" id="log">' + esc(lines.join('\n')) + '</pre></div>';
  }

  function blockLabel() {
    var q = Array.isArray(S.queue) ? S.queue.filter(isObj) : S.queue, h = '<div class="blk"><h2>7 · 去抽样标注</h2>';
    if (q && q.length) {
      h += '<p class="note" style="margin:0 0 10px">第 1、2 档最多的号：' + esc(q[0].name || q[0].slug) + '（' + esc(q[0].low || 0) + ' 条）。标完一条会变成第 5 档。</p>'
        + '<a class="btn btn-primary" id="go-label" href="' + esc(CR.BASE + 'account?s=' + encodeURIComponent(q[0].slug) + '&focus=low') + '">去抽样标注</a>';
    } else {
      h += '<p class="empty">' + (q ? '队列是空的，没有要标的号。' : '标注队列读不到。') + '</p>';
    }
    return h + '</div>';
  }

  // 每块单独兜底：线上数据格式不对只影响那一块，开关块照常出
  function safe(fn) {
    try { return fn(); } catch (e) { return '<div class="blk"><p class="offline-note" style="margin:0">数据格式不对（' + esc(fn.name.replace('block', '')) + '）</p></div>'; }
  }
  function render() {
    var oldLog = document.getElementById('log');
    var follow = !oldLog || firstLog || oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 30;
    var oldTop = oldLog ? oldLog.scrollTop : 0;
    var by = document.getElementById('by'), byv = by ? by.value : null, hadFocus = by && document.activeElement === by;
    app.innerHTML = (S.err ? '<div class="blk"><p class="offline-note" style="margin:0">' + esc(S.err) + '</p></div>' : '')
      + [blockStatus, blockPace, blockRunning, blockQueues, blockEvents, blockLog, blockLabel].map(safe).join('');
    var by2 = document.getElementById('by');
    if (by2 && byv != null) { by2.value = byv; if (hadFocus) by2.focus(); }
    var lg = document.getElementById('log');
    if (lg) { lg.scrollTop = follow ? lg.scrollHeight : oldTop; firstLog = false; }
    document.getElementById('upd').textContent = '每 30 秒自动刷新 · 刚刷新于 ' + new Date().toTimeString().slice(0, 8);
  }

  function refresh() {
    var bad = [];
    return Promise.all([
      api('beat').then(function (d) { S.beat = isObj(d.beat) ? d.beat : null; }).catch(function () { bad.push('心跳'); }),
      api('switch').then(function (d) { S.sw = isObj(d) ? d : null; }).catch(function () { S.sw = null; bad.push('开关'); }),
      api('job').then(function (d) { S.jobs = d.jobs || {}; }).catch(function () { S.jobs = null; bad.push('提交记录'); }),
      api('event').then(function (d) { S.events = d.events || []; }).catch(function () { S.events = null; bad.push('使用记录'); })
    ]).then(function () {
      S.err = bad.length ? '没读到：' + bad.join('、') + '（接口连不上或还没开通）' : '';
      if (S.beat === undefined) S.beat = null;
      if (!S.busy) render();
    });
  }

  function sendSwitch() {
    var by = ((document.getElementById('by') || {}).value || '').trim().slice(0, 40);
    setName(by);
    S.busy = true; S.swErr = ''; render();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'switch', on: S.ask, by: by }) })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (d) { throw new Error(d.error || ('提交失败（' + r.status + '）')); });
      })
      .then(function () { S.ask = null; S.busy = false; return refresh(); })
      .catch(function (e) { S.busy = false; S.swErr = e.message || '提交失败'; render(); });
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'ask') { S.ask = curOn() !== true; S.swErr = ''; render(); }
    else if (a === 'cancel') { S.ask = null; S.swErr = ''; render(); }
    else if (a === 'go') sendSwitch();
  });
  app.addEventListener('toggle', function (e) {
    var d = e.target, id = d && d.tagName === 'DETAILS' ? d.getAttribute('data-id') : null;
    if (id != null) { if (d.open) S.open[id] = 1; else delete S.open[id]; }
  }, true);

  CR.getJSON(DBQ).then(function (q) { S.queue = Array.isArray(q) ? q : []; }).catch(function () { S.queue = null; })
    .then(refresh);
  // 页面在后台（切走标签页、锁屏）时不刷新：公开页常开着不关，没人看还每 30 秒打四次接口（10-31 复核后改）。
  // 切回来马上刷一次，再接着按间隔刷
  setInterval(function () { if (!document.hidden) refresh(); }, REFRESH);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>
</body></html>
