function drawPager(){if(pages<2){pager.innerHTML='';return;}
 let h='<button '+(cur===0?'disabled':'')+' data-g="'+(cur-1)+'">上一页</button>';
 const win=[];for(let i=0;i<pages;i++){if(i<2||i>pages-3||Math.abs(i-cur)<=2)win.push(i);}
 let last=-1;win.forEach(i=>{if(last>=0&&i-last>1)h+='<span class="info">…</span>';

 h+='<button '+(cur===pages-1?'disabled':'')+' data-g="'+(cur+1)+'">下一页</button>';
 h+='<span class="info">共 '+D.length+' 张 / '+pages+' 页</span>';pager.innerHTML=h;
 pager.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>render(+b.dataset.g));}
