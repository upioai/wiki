const enc=k=>k.split('/').map(encodeURIComponent).join('/');
const grid=document.getElementById('grid'),pager=document.getElementById('pager');
let D=ALL,pages=Math.ceil(D.length/P),cur=0;
function render(p){cur=p;grid.innerHTML='';const s=p*P;
 D.slice(s,s+P).forEach((d,i)=>{const f=document.createElement('figure');
  const im=new Image();im.loading='lazy';im.src=B+'/'+enc(d[0]);im.alt='效果图';
  f.appendChild(im);f.onclick=()=>open(s+i);grid.appendChild(f);});
 drawPager();window.scrollTo({top:0,behavior:'smooth'});}
const sbar=document.getElementById('spacebar');
if(sbar){sbar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
 sbar.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');
 const s=b.dataset.s;D=s==='__all__'?ALL:ALL.filter(d=>d[2]===s);
 pages=Math.ceil(D.length/P);render(0);});}
function drawPager(){if(pages<2){pager.innerHTML='';return;}
 let h='<button '+(cur===0?'disabled':'')+' data-g="'+(cur-1)+'">上一页</button>';
 const win=[];for(let i=0;i<pages;i++){if(i<2||i>pages-3||Math.abs(i-cur)<=2)win.push(i);}
 let last=-1;win.forEach(i=>{if(last>=0&&i-last>1)h+='<span class="info">…</span>';
  h+='<button class="'+(i===cur?'on':'')+'" data-g="'+i+'">'+(i+1)+'</button>';last=i;});
 h+='<button '+(cur===pages-1?'disabled':'')+' data-g="'+(cur+1)+'">下一页</button>';
 h+='<span class="info">共 '+D.length+' 张 / '+pages+' 页</span>';pager.innerHTML=h;
 pager.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>render(+b.dataset.g));}
const lb=document.getElementById('lb'),lbi=lb.querySelector('img'),cap=lb.querySelector('.cap');let idx=0;
// 大图取不到时回退到缩略图 —— 宁可糊一点,也别给客户看破图
lbi.onerror=function(){const t=B+'/'+enc(D[idx][0]);if(lbi.src!==t){lbi.src=t;cap.textContent=(idx+1)+' / '+D.length+'(预览图)';}};
function open(i){idx=(i+D.length)%D.length;lbi.src=B+'/'+enc(D[idx][1]);cap.textContent=(idx+1)+' / '+D.length;lb.classList.add('on');}
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');
lb.querySelector('.p').onclick=e=>{e.stopPropagation();open(idx-1);};
lb.querySelector('.n2').onclick=e=>{e.stopPropagation();open(idx+1);};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on');};
document.onkeydown=e=>{if(!lb.classList.contains('on'))return;
 if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')open(idx-1);if(e.key==='ArrowRight')open(idx+1);};
render(0);
