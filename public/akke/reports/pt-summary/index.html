<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>潜在触达用户旅程汇总复盘 · 实时</title>
<style>
  :root{--bg:#f5f7fb;--paper:#fff;--ink:#1f2937;--muted:#5f6b7a;--faint:#9aa4b2;--line:#e2e7ef;
    --blue:#2563eb;--purple:#6d4cb9;--green:#12816f;--red:#c0392b;--yellow:#ad6200;--teal:#0d9488;
    --green-s:#e7f5f1;--red-s:#fcebe9;--yellow-s:#fdf3e3;--teal-s:#d9f2ef;--shadow:0 10px 28px rgba(31,41,55,.08)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;font-size:13px}
  .wrap{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:28px 0 80px}
  .header{margin-bottom:8px}
  .title{font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
  .subtitle{color:var(--muted);margin-top:6px;font-size:12.5px}
  .section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .section-title{font-size:16px;font-weight:700;margin:0 0 12px}
  .section-hint{color:var(--muted);font-size:11.5px;margin-bottom:12px}
  .card{background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .card.teal{border-color:#bfe3d9;background:var(--teal-s)}
  .card .t{font-weight:700;margin-bottom:6px}
  .ok{color:var(--green)} .bad{color:var(--red)} .teal{color:var(--teal)}
  .kpi-row{display:grid;gap:12px;margin:14px 0}
  .pt-kpi6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pt-day-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media(max-width:720px){.pt-kpi6{grid-template-columns:repeat(3,1fr)}.pt-day-kpi{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .kpi.ok::before{background:var(--green)} .kpi.bad::before{background:var(--red)}
  .kpi-label{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .kpi-value{font-size:24px;font-weight:700;line-height:1}
  .op-pills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
  .op-pill{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted)}
  .op-pill b{color:var(--ink)}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
  .chip{background:var(--teal-s);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--ink)}
  .chip.them{background:#eef1f5;color:var(--muted)}.chip.us{background:var(--teal-s);border-color:#bfe3d9}
  .arrow{color:var(--faint)}
  .segmented{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
  .segmented button{background:#fff;color:var(--muted);border:0;padding:7px 18px;cursor:pointer;font-size:13px;font-weight:600}
  .segmented button.active{background:var(--teal);color:#fff}
  .view{display:none}.view.active{display:block}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.tl{border-collapse:collapse;width:100%;font-size:11.5px;min-width:920px}
  table.tl th{background:#fafbfd;color:var(--muted);font-weight:600;padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.tl th.cust{text-align:left;min-width:120px}
  table.tl td{padding:6px 8px;text-align:center;border-bottom:1px solid #f0f3f8;white-space:nowrap}
  table.tl td.cust{text-align:left} table.tl td.cust b{font-size:12px}
  table.tl tr:last-child td{border-bottom:0}
  td.nt{font-variant-numeric:tabular-nums;color:var(--muted)}
  td.nt.off{color:var(--faint);font-style:italic}
  .vlink{font-size:11px;color:var(--blue);text-decoration:none} .vlink:hover{text-decoration:underline}
  .vlink.off{color:var(--faint)}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
  .badge.ok{background:var(--green-s);color:var(--green)}
  .badge.bad{background:var(--red-s);color:var(--red)}
  .badge.teal{background:var(--teal-s);color:var(--teal)}
  .badge.gray{background:#eef1f5;color:var(--muted)}
  .footnote{color:var(--muted);font-size:11.5px;margin-top:10px;padding:12px 14px;background:#fafbfd;border-radius:8px;border-left:3px solid var(--line);line-height:1.8}
  .footnote b{color:var(--ink);font-weight:600}
  .empty{color:var(--faint);text-align:center;padding:26px 0}

  .datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .datebar button{font-size:12px;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  .datebar button:hover{background:#f1f4f9} .datebar button:disabled{opacity:.4;cursor:not-allowed}
  .datebar input[type=date]{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
  .datebar .dphint{font-size:11px;color:var(--faint)}
  .liveflag{font-size:11px;color:var(--green);font-weight:600;background:var(--green-s);border-radius:999px;padding:3px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 class="title">潜在触达用户旅程汇总复盘 · 野荞 / 饭粒 / 夏夏</h1>
    <div class="subtitle" id="sub">加载中…</div>
    <div class="datebar">
      <button id="prevb" onclick="goDay(-1)">◀ 前一天</button>
      <input type="date" id="dp" onchange="goDate(this.value)" />
      <button id="nextb" onclick="goDay(1)">后一天 ▶</button>
      <button id="todayb" onclick="goToday()">今天</button>
      <button onclick="reload()">↻ 立即刷新</button>
      <span class="liveflag" id="liveflag" style="display:none">🟢 每 30 分钟自动刷新</span>
      <span class="dphint">日期只切「按日期」当天时间线；「按用户」是当前进度，不分日期。可往回翻历史。</span>
    </div>
  </div>
  <div id="app"><div class="empty">加载中…</div></div>
</div>
<script>
  // 活数据后端（Akke Vercel 公开只读 API）。壳页静态托管在 upioai/wiki，跨域 CORS 已放行 upio.ai。
  var API = "https://akke.vercel.app/api/public/pt-summary";
  var REFRESH_MS = 30 * 60 * 1000; // 30min
  var DATA_START = "2026-06-03"; // 二次触达状态表起点（之前没有）
  var timer = null;
  var curDate = "";
  var curIsToday = false;

  function bjtToday(){ return new Date(Date.now() + 8*3600000).toISOString().slice(0,10); }
  function shiftDate(d, n){
    var t = new Date(d + "T00:00:00+08:00");
    t.setTime(t.getTime() + n*86400000);
    return new Date(t.getTime() + 8*3600000).toISOString().slice(0,10);
  }
  function fmtClock(iso){
    if(!iso) return "—";
    var d = new Date(new Date(iso).getTime() + 8*3600000);
    function p(n){ return String(n).padStart(2,"0"); }
    return p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }

  function syncNav(){
    var today = bjtToday();
    var nb = document.getElementById("nextb"), pb = document.getElementById("prevb"), tb = document.getElementById("todayb");
    if(nb) nb.disabled = (curDate >= today);
    if(pb) pb.disabled = (curDate <= DATA_START);
    if(tb) tb.disabled = (curDate >= today);
    var lf = document.getElementById("liveflag");
    if(lf) lf.style.display = curIsToday ? "" : "none";
    var dp = document.getElementById("dp");
    if(dp){ dp.value = curDate; dp.max = today; dp.min = DATA_START; }
  }

  function render(j){
    document.getElementById("app").innerHTML = j.html || '<div class="empty">暂无数据</div>';
    var sub = document.getElementById("sub");
    var k = j.kpi || {};
    if(sub){
      sub.innerHTML = "三人汇总 · 触达用户 " + (k.users||0) + " · 盯防中 " + (k.watching||0)
        + " · 达标 " + (k.qualified||0) + " / 卡点 " + (k.blocked||0)
        + " · 按日期看 " + curDate + (j.isToday ? "（今天，每 30 分钟自动刷新）" : "")
        + " · 实时直连库 · 更新于 " + fmtClock(j.generatedAt);
    }
  }

  function load(date){
    curDate = date;
    document.getElementById("app").innerHTML = '<div class="empty">加载中…</div>';
    fetch(API + "?date=" + date + "&_t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.error){ document.getElementById("app").innerHTML = '<div class="empty">加载失败：' + j.error + '</div>'; return; }
        curIsToday = !!j.isToday;
        syncNav();
        render(j);
        scheduleAuto();
      })
      .catch(function(e){ document.getElementById("app").innerHTML = '<div class="empty">网络错误：' + e + '</div>'; });
  }
  function reload(){ load(curDate || bjtToday()); }
  window.reload = reload;
  function scheduleAuto(){
    if(timer){ clearInterval(timer); timer = null; }
    if(curIsToday){ timer = setInterval(function(){ load(bjtToday()); }, REFRESH_MS); }
  }
  function goToday(){ var t = bjtToday(); if(t !== curDate) load(t); }
  function goDate(d){ if(d && d !== curDate && d <= bjtToday() && d >= DATA_START) load(d); }
  function goDay(n){
    var t = shiftDate(curDate || bjtToday(), n);
    if(t > bjtToday() || t < DATA_START) return;
    load(t);
  }
  window.goToday = goToday; window.goDate = goDate; window.goDay = goDay;

  // 按日期 / 按用户 切换：document 级委托（innerHTML 重渲染后仍有效）。
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("#ptViewSel button") : null;
    if(!b) return;
    var view = b.dataset.view; // "date" | "user"
    document.querySelectorAll("#ptViewSel button").forEach(function(x){ x.classList.toggle("active", x===b); });
    var byDate = document.getElementById("ptByDate"), byUser = document.getElementById("ptByUser");
    if(byDate) byDate.classList.toggle("active", view==="date");
    if(byUser) byUser.classList.toggle("active", view==="user");
  });

  load(bjtToday());
</script>
</body>
</html>
