<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>潜在触达用户旅程汇总复盘 · 实时</title>
<!-- 极简 bootstrap：仅够 load 态 + 裸导航栏（与改造前外观一致）。内容 CSS 全部走 API css 字段，
     注入到下方 <style id="pt-css">，PT_SUMMARY_CSS 为单一真相源 → 永不漂移（不再手抄整块）。 -->
<style>
  :root{--bg:#f5f7fb;--ink:#1f2937;--muted:#5f6b7a;--faint:#9aa4b2;--line:#e2e7ef}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;font-size:13px}
  .wrap{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:28px 0 80px}
  .header{margin-bottom:8px}
  .title{font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
  .subtitle{color:var(--muted);margin-top:6px;font-size:12.5px}
  .empty{color:var(--faint);text-align:center;padding:26px 0}
</style>
<!-- 内容样式由 /api/public/pt-summary 的 css 字段在 render() 时注入，永不与 PT_SUMMARY_CSS 漂移 -->
<style id="pt-css"></style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 class="title">潜在触达用户旅程汇总复盘 · 野荞 / 饭粒 / 夏夏</h1>
    <div class="subtitle" id="sub">加载中…</div>
    <div class="datebar">
      <button id="prevb" onclick="goDay(-1)">◀ 前一天</button>
      <input type="date" id="dp" onchange="goDate(this.value)" />
      <button id="nextb" onclick="goDay(1)">后一天 ▶</button>
      <button id="todayb" onclick="goToday()">今天</button>
      <button onclick="reload()">↻ 立即刷新</button>
      <span class="liveflag" id="liveflag" style="display:none">🟢 每 30 分钟自动刷新</span>
      <span class="dphint">日期只切「按日期」当天时间线；「按用户」是当前进度，不分日期。可往回翻历史。</span>
    </div>
  </div>
  <div id="app"><div class="empty">加载中…</div></div>
</div>
<script>
  // 活数据后端（Akke Vercel 公开只读 API）。壳页静态托管在 upioai/wiki，跨域 CORS 已放行 upio.ai。
  var API = "https://akke.vercel.app/api/public/pt-summary";
  var REFRESH_MS = 30 * 60 * 1000; // 30min
  var DATA_START = "2026-06-03"; // 二次触达状态表起点（之前没有）
  var timer = null;
  var curDate = "";
  var curIsToday = false;

  function bjtToday(){ return new Date(Date.now() + 8*3600000).toISOString().slice(0,10); }
  function shiftDate(d, n){
    var t = new Date(d + "T00:00:00+08:00");
    t.setTime(t.getTime() + n*86400000);
    return new Date(t.getTime() + 8*3600000).toISOString().slice(0,10);
  }
  function fmtClock(iso){
    if(!iso) return "—";
    var d = new Date(new Date(iso).getTime() + 8*3600000);
    function p(n){ return String(n).padStart(2,"0"); }
    return p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }

  function syncNav(){
    var today = bjtToday();
    var nb = document.getElementById("nextb"), pb = document.getElementById("prevb"), tb = document.getElementById("todayb");
    if(nb) nb.disabled = (curDate >= today);
    if(pb) pb.disabled = (curDate <= DATA_START);
    if(tb) tb.disabled = (curDate >= today);
    var lf = document.getElementById("liveflag");
    if(lf) lf.style.display = curIsToday ? "" : "none";
    var dp = document.getElementById("dp");
    if(dp){ dp.value = curDate; dp.max = today; dp.min = DATA_START; }
  }

  function render(j){
    // 内容 CSS 单一真相源：随响应注入（PT_SUMMARY_CSS 改了这里自动跟，永不漂移）。
    var st = document.getElementById("pt-css");
    if(st && j.css && st.textContent !== j.css){ st.textContent = j.css; }
    document.getElementById("app").innerHTML = j.html || '<div class="empty">暂无数据</div>';
    var sub = document.getElementById("sub");
    var dk = j.dayKpi || {};
    if(sub){
      sub.innerHTML = "三人汇总 · 当天触达 " + (dk.detected||0)
        + " · 达标 " + (dk.qualified||0) + " / 卡点 " + (dk.blocked||0)
        + " · 选定日 " + curDate + (j.isToday ? "（今天，每 30 分钟自动刷新）" : "")
        + " · 实时直连库 · 更新于 " + fmtClock(j.generatedAt);
    }
  }

  function load(date){
    curDate = date;
    document.getElementById("app").innerHTML = '<div class="empty">加载中…</div>';
    fetch(API + "?date=" + date + "&_t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.error){ document.getElementById("app").innerHTML = '<div class="empty">加载失败：' + j.error + '</div>'; return; }
        curIsToday = !!j.isToday;
        syncNav();
        render(j);
        scheduleAuto();
      })
      .catch(function(e){ document.getElementById("app").innerHTML = '<div class="empty">网络错误：' + e + '</div>'; });
  }
  function reload(){ load(curDate || bjtToday()); }
  window.reload = reload;
  function scheduleAuto(){
    if(timer){ clearInterval(timer); timer = null; }
    if(curIsToday){ timer = setInterval(function(){ load(bjtToday()); }, REFRESH_MS); }
  }
  function goToday(){ var t = bjtToday(); if(t !== curDate) load(t); }
  function goDate(d){ if(d && d !== curDate && d <= bjtToday() && d >= DATA_START) load(d); }
  function goDay(n){
    var t = shiftDate(curDate || bjtToday(), n);
    if(t > bjtToday() || t < DATA_START) return;
    load(t);
  }
  window.goToday = goToday; window.goDate = goDate; window.goDay = goDay;

  // 按日期 / 按用户 切换：document 级委托（innerHTML 重渲染后仍有效）。
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("#ptViewSel button") : null;
    if(!b) return;
    var view = b.dataset.view; // "date" | "user"
    document.querySelectorAll("#ptViewSel button").forEach(function(x){ x.classList.toggle("active", x===b); });
    var byDate = document.getElementById("ptByDate"), byUser = document.getElementById("ptByUser");
    if(byDate) byDate.classList.toggle("active", view==="date");
    if(byUser) byUser.classList.toggle("active", view==="user");
  });

  // 状态筛选（成功三连/部分完成/未成功/状态未记录）：document 级委托，按 .strip[data-verdict] 显隐。
  // 每次 innerHTML 重渲染后筛选条恒回「全部」（渲染默认 active=全部），无需额外重置。
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".vfilter .vf-btn") : null;
    if(!b) return;
    var bar = b.closest(".vfilter");
    var want = b.dataset.filter; // all | ok | partial | fail | none
    bar.querySelectorAll(".vf-btn").forEach(function(x){ x.classList.toggle("active", x===b); });
    // 作用域：筛选条所在视图（ptByDate）内的所有 .strip。
    var scope = bar.closest(".view") || document;
    scope.querySelectorAll(".strip").forEach(function(s){
      var hide = want !== "all" && s.dataset.verdict !== want;
      s.classList.toggle("vf-hide", hide);
    });
  });

  load(bjtToday());
</script>
</body>
</html>
