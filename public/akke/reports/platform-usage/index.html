<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Akke 九类第三方平台实时使用与风险看板，每小时自动更新。">
  <title>Akke 第三方平台实时看板</title>
  <style>
    :root{--bg:#07111f;--surface:#0c1a2d;--surface2:#10233a;--line:#213954;--text:#eff6ff;--muted:#91a6bd;--cyan:#31c6e7;--blue:#6d91ff;--green:#49d39b;--orange:#ffb454;--red:#ff6577;--grey:#7890a8;--shadow:0 18px 60px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 16% -8%,rgba(49,198,231,.13),transparent 32%),radial-gradient(circle at 92% 2%,rgba(109,145,255,.12),transparent 28%),var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
    a{color:inherit}.wrap{width:min(1220px,calc(100% - 32px));margin:auto;padding:34px 0 64px}.topbar{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800}.title{font-size:clamp(28px,4vw,48px);line-height:1.08;margin:9px 0 10px;letter-spacing:-.04em}.subtitle{color:var(--muted);font-size:14px;line-height:1.7;max-width:750px}.live{display:flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(12,26,45,.78);font-size:12px;color:var(--muted);white-space:nowrap}.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(73,211,155,.55);animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(73,211,155,0)}100%{box-shadow:0 0 0 0 rgba(73,211,155,0)}}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 28px}.summary-item{padding:15px 17px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(155deg,rgba(16,35,58,.94),rgba(12,26,45,.8));box-shadow:var(--shadow)}.summary-label{color:var(--muted);font-size:12px}.summary-value{font-size:27px;font-weight:800;margin-top:5px}.summary-item[data-tone=healthy] .summary-value{color:var(--green)}.summary-item[data-tone=watch] .summary-value{color:var(--orange)}.summary-item[data-tone=risk] .summary-value{color:var(--red)}.summary-item[data-tone=unknown] .summary-value{color:var(--grey)}
    .grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.panel{border:1px solid var(--line);border-radius:18px;background:rgba(12,26,45,.84);box-shadow:var(--shadow);padding:20px;min-width:0}.panel.wide{grid-column:1/-1}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.panel-note{color:var(--muted);font-size:11px;text-align:right}.chart{width:100%;min-height:240px}.chart svg{display:block;width:100%;height:auto;overflow:visible}.axis{fill:var(--muted);font-size:10px}.row-label{fill:var(--text);font-size:11px;font-weight:700}.value-label{fill:var(--muted);font-size:10px}.gridline{stroke:var(--line);stroke-width:1}.track{fill:rgba(120,144,168,.13)}
    .platforms{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.platform{border:1px solid var(--line);border-radius:15px;background:linear-gradient(160deg,rgba(16,35,58,.9),rgba(12,26,45,.78));padding:16px;min-width:0}.platform-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.platform h3{font-size:15px;margin:0}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;border:1px solid currentColor}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.healthy{color:var(--green)}.watch{color:var(--orange)}.risk{color:var(--red)}.unknown{color:var(--grey)}.activity{font-size:21px;font-weight:800;margin:16px 0 13px;letter-spacing:-.02em}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:9px 10px;border-radius:10px;background:rgba(7,17,31,.46)}.metric-label{font-size:10px;color:var(--muted);line-height:1.25}.metric-value{font-size:13px;font-weight:750;margin-top:4px;overflow-wrap:anywhere}.note{color:var(--muted);font-size:11px;line-height:1.55;margin:13px 0 0}.scope{color:var(--cyan);font-size:10px;margin-top:8px}.footer{display:flex;justify-content:space-between;gap:18px;margin-top:22px;color:var(--muted);font-size:11px;line-height:1.6}.error{display:none;margin:18px 0;border:1px solid rgba(255,101,119,.45);background:rgba(255,101,119,.08);color:#ffc0c8;border-radius:12px;padding:13px}.skeleton{border-radius:8px;background:linear-gradient(90deg,rgba(120,144,168,.08),rgba(120,144,168,.2),rgba(120,144,168,.08));background-size:220% 100%;animation:shine 1.4s infinite;height:14px}@keyframes shine{to{background-position:-220% 0}}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.panel.wide,.platforms{grid-column:auto}.platforms{grid-template-columns:repeat(2,1fr)}.topbar{flex-direction:column}.live{align-self:flex-start}}@media(max-width:620px){.wrap{width:min(100% - 20px,1220px);padding-top:22px}.summary{grid-template-columns:repeat(2,1fr)}.platforms{grid-template-columns:1fr}.panel{padding:15px}.panel-head{align-items:flex-start;flex-direction:column}.panel-note{text-align:left}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div><div class="kicker">Akke Operations · Live</div><h1 class="title">第三方平台实时使用看板</h1><div class="subtitle">九类核心平台的使用规模、容量、成功率与风险信号。数据由 Akke 服务端脱敏聚合，页面每小时自动刷新。</div></div>
      <div class="live"><span class="pulse"></span><span id="refreshState">正在读取最新数据…</span></div>
    </header>

    <div id="error" class="error" role="alert"></div>
    <section class="summary" aria-label="平台状态汇总">
      <div class="summary-item" data-tone="healthy"><div class="summary-label">运行健康</div><div class="summary-value" id="healthyCount">—</div></div>
      <div class="summary-item" data-tone="watch"><div class="summary-label">需要优化</div><div class="summary-value" id="watchCount">—</div></div>
      <div class="summary-item" data-tone="risk"><div class="summary-label">高风险</div><div class="summary-value" id="riskCount">—</div></div>
      <div class="summary-item" data-tone="unknown"><div class="summary-label">观测不足</div><div class="summary-value" id="unknownCount">—</div></div>
    </section>

    <div class="grid">
      <section class="panel wide"><div class="panel-head"><h2>每日活动规模</h2><div class="panel-note">对数刻度 · 平台事件定义不同，仅比较运行量级</div></div><div id="activityChart" class="chart" aria-live="polite"><div class="skeleton"></div></div></section>
      <section class="panel"><div class="panel-head"><h2>容量与预算</h2><div class="panel-note">100% 为阈值</div></div><div id="capacityChart" class="chart"><div class="skeleton"></div></div></section>
      <section class="panel"><div class="panel-head"><h2>风险雷达</h2><div class="panel-note">按平台当前信号归类</div></div><div id="riskChart" class="chart"><div class="skeleton"></div></div></section>
      <section id="platforms" class="platforms" aria-label="九个平台详情"></section>
    </div>
    <footer class="footer"><span id="generatedAt">生成时间：—</span><span>自动刷新：每 60 分钟 · 数据异常时保留上一版，单个平台失败不影响全页</span></footer>
  </main>

  <script>
    const API = "https://akke.vercel.app/api/public/platform-usage";
    const COLORS = {healthy:"var(--green)",watch:"var(--orange)",risk:"var(--red)",unknown:"var(--grey)"};
    const LABELS = {healthy:"运行健康",watch:"需要优化",risk:"高风险",unknown:"观测不足"};
    let nextRefreshAt = Date.now() + 3600000;
    const svgNS = "http://www.w3.org/2000/svg";

    function svgEl(tag, attrs, parent, text){const el=document.createElementNS(svgNS,tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;if(parent)parent.appendChild(el);return el}
    function fmt(value,max=1){if(value===null||value===undefined||value==="")return "—";if(typeof value!=="number")return String(value);return new Intl.NumberFormat("zh-CN",{maximumFractionDigits:max}).format(value)}
    function metric(platform,label){return platform.metrics.find(m=>m.label===label)}
    function makeSvg(container,height,label){container.innerHTML="";const width=Math.max(520,container.clientWidth||700);const svg=svgEl("svg",{viewBox:`0 0 ${width} ${height}`,role:"img","aria-label":label},container);svgEl("title",{},svg,label);return {svg,width}}

    function renderActivity(platforms){
      const box=document.getElementById("activityChart"),rows=platforms,wide=box.clientWidth>720,left=wide?150:112,right=wide?250:178,rowH=34,top=32,height=top+rows.length*rowH+24,{svg,width}=makeSvg(box,height,"九个平台每日活动规模");const plotW=width-left-right,max=Math.log10(Math.max(...rows.map(p=>(p.activity.value||0)+1),10));
      [1,10,100,1000,10000].forEach(t=>{if(Math.log10(t+1)>max)return;const x=left+Math.log10(t+1)/max*plotW;svgEl("line",{x1:x,y1:26,x2:x,y2:height-18,class:"gridline"},svg);svgEl("text",{x,y:17,"text-anchor":"middle",class:"axis"},svg,t>=1000?`${t/1000}k`:t)});
      rows.forEach((p,i)=>{const y=top+i*rowH;svgEl("text",{x:left-10,y:y+16,"text-anchor":"end",class:"row-label"},svg,p.name);svgEl("rect",{x:left,y:y+5,width:plotW,height:15,rx:8,class:"track"},svg);if(p.activity.value>0){const bw=Math.max(2,Math.log10(p.activity.value+1)/max*plotW);svgEl("rect",{x:left,y:y+5,width:bw,height:15,rx:8,fill:COLORS[p.health]},svg)}svgEl("text",{x:left+plotW+10,y:y+16,class:"value-label"},svg,p.activity.label)});
    }

    function renderCapacity(platforms){
      const items=[
        ["GitHub Actions","月预算节奏"],["Supabase","连接占用"],["Langfuse","月配额预测"],["Supabase","数据库容量"],["Lark","月配额"]
      ].map(([name,label])=>{const p=platforms.find(x=>x.name===name),m=p&&metric(p,label);return p&&m&&typeof m.value==="number"?{name:`${name} · ${label}`,value:m.value,tone:m.tone||p.health}:null}).filter(Boolean);
      const box=document.getElementById("capacityChart"),left=162,right=48,rowH=43,top=33,height=top+items.length*rowH+26,{svg,width}=makeSvg(box,height,"平台容量与预算消耗"),plotW=width-left-right,max=Math.max(220,...items.map(i=>i.value));
      [0,50,100,150,200].filter(v=>v<=max).forEach(t=>{const x=left+t/max*plotW;svgEl("line",{x1:x,y1:26,x2:x,y2:height-18,class:"gridline"},svg);svgEl("text",{x,y:17,"text-anchor":"middle",class:"axis"},svg,`${t}%`)});const threshold=left+100/max*plotW;svgEl("line",{x1:threshold,y1:25,x2:threshold,y2:height-18,stroke:"var(--red)","stroke-dasharray":"4 4"},svg);
      items.forEach((item,i)=>{const y=top+i*rowH;svgEl("text",{x:left-9,y:y+17,"text-anchor":"end",class:"row-label"},svg,item.name);svgEl("rect",{x:left,y:y+5,width:plotW,height:16,rx:8,class:"track"},svg);svgEl("rect",{x:left,y:y+5,width:Math.min(plotW,item.value/max*plotW),height:16,rx:8,fill:COLORS[item.tone]},svg);svgEl("text",{x:Math.min(width-34,left+item.value/max*plotW+6),y:y+17,class:"value-label"},svg,`${fmt(item.value)}%`)});
    }

    function renderRisk(platforms){
      const order=["risk","watch","healthy","unknown"],groups=order.map(t=>({tone:t,items:platforms.filter(p=>p.health===t)})),box=document.getElementById("riskChart"),{svg,width}=makeSvg(box,245,"平台风险分组"),margin=18,gap=12,colW=(width-margin*2-gap)/2,rowH=107;
      groups.forEach((g,i)=>{const x=margin+(i%2)*(colW+gap),y=18+Math.floor(i/2)*rowH;svgEl("rect",{x,y,width:colW,height:91,rx:12,fill:"var(--surface2)",stroke:"var(--line)"},svg);svgEl("circle",{cx:x+15,cy:y+18,r:5,fill:COLORS[g.tone]},svg);svgEl("text",{x:x+27,y:y+22,class:"row-label"},svg,`${LABELS[g.tone]} · ${g.items.length}`);g.items.forEach((p,j)=>svgEl("text",{x:x+15,y:y+44+j*17,class:"value-label"},svg,p.name))});
    }

    function renderCards(platforms){
      const host=document.getElementById("platforms");host.innerHTML="";platforms.forEach(p=>{const card=document.createElement("article");card.className="platform";const metrics=p.metrics.map(m=>`<div class="metric"><div class="metric-label">${m.label}</div><div class="metric-value ${m.tone||""}">${fmt(m.value)}${m.unit?` ${m.unit}`:""}</div></div>`).join("");card.innerHTML=`<div class="platform-top"><h3>${p.name}</h3><span class="badge ${p.health}">${LABELS[p.health]}</span></div><div class="activity">${p.activity.label}</div><div class="metrics">${metrics||'<div class="metric"><div class="metric-label">指标</div><div class="metric-value unknown">待接入</div></div>'}</div>${p.scope?`<div class="scope">范围：${p.scope}</div>`:""}<p class="note">${p.note}</p>`;host.appendChild(card)});
    }

    function render(data){
      document.getElementById("healthyCount").textContent=data.summary.healthy;document.getElementById("watchCount").textContent=data.summary.watch;document.getElementById("riskCount").textContent=data.summary.risk;document.getElementById("unknownCount").textContent=data.summary.unknown;document.getElementById("generatedAt").textContent=`生成时间：${new Date(data.generatedAt).toLocaleString("zh-CN",{hour12:false})}${data.stale?" · 缓存数据":""}`;renderActivity(data.platforms);renderCapacity(data.platforms);renderRisk(data.platforms);renderCards(data.platforms);
    }

    async function load(){
      const state=document.getElementById("refreshState"),error=document.getElementById("error");state.textContent="正在更新…";error.style.display="none";
      try{const bucket=Math.floor(Date.now()/3600000);const response=await fetch(`${API}?hour=${bucket}`,{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();render(data);nextRefreshAt=Date.now()+(data.refreshIntervalSeconds||3600)*1000;state.textContent="数据已更新"}
      catch(err){error.textContent="暂时无法读取实时数据，页面会在下一刷新周期自动重试。";error.style.display="block";state.textContent="等待自动重试";console.error(err)}
    }
    function tick(){const left=Math.max(0,nextRefreshAt-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);const state=document.getElementById("refreshState");if(state.textContent!=="正在更新…"&&state.textContent!=="等待自动重试")state.textContent=`下次刷新 ${m}分${String(s).padStart(2,"0")}秒`}
    let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(load,180)});load();setInterval(load,3600000);setInterval(tick,1000);
  </script>
</body>
</html>
