<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>三人旅程汇总复盘 · 实时</title>
<style>
  :root{--bg:#f5f7fb;--paper:#fff;--ink:#1f2937;--muted:#5f6b7a;--faint:#9aa4b2;--line:#e2e7ef;
    --blue:#2563eb;--purple:#6d4cb9;--green:#12816f;--red:#c0392b;--yellow:#ad6200;
    --green-s:#e7f5f1;--red-s:#fcebe9;--yellow-s:#fdf3e3;--shadow:0 10px 28px rgba(31,41,55,.08)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;font-size:13px}
  .wrap{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:28px 0 80px}
  .header{margin-bottom:20px}
  .title{font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
  .subtitle{color:var(--muted);margin-top:6px;font-size:12.5px}
  .kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .kpi.ok::before{background:var(--green)} .kpi.bad::before{background:var(--red)}
  .kpi-label{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .kpi-value{font-size:26px;font-weight:700;line-height:1}
  .kpi-unit{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
  .kpi-sub{margin-top:6px;font-size:11.5px;color:var(--faint)}
  .op-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .op-pill{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
  .op-pill b{color:var(--ink)}

  .section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .section-title{font-size:16px;font-weight:700;margin:0 0 4px}
  .section-hint{color:var(--muted);font-size:11.5px;margin-bottom:14px}
  .section-hint code{background:#f1f4f9;padding:1px 5px;border-radius:3px;font-size:11px}

  .sum-grid{display:grid;grid-template-columns:minmax(140px,180px) 1fr minmax(180px,220px);gap:16px;align-items:start}
  .sum-card{background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .sum-label{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .sum-value{font-size:34px;font-weight:700;line-height:1} .sum-unit{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
  .sum-intent{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
  .ib-top{display:flex;justify-content:space-between;align-items:baseline} .ib-label{font-size:12px;font-weight:600} .ib-pct{font-size:13px;font-weight:700}
  .ib-bar{height:8px;background:#f1f4f9;border-radius:5px;overflow:hidden;margin:4px 0 2px} .ib-fill{height:100%;border-radius:5px}
  .ib-n{font-size:11px;color:var(--muted)}
  .ib.hi .ib-pct{color:var(--red)} .ib.hi .ib-fill{background:var(--red)}
  .ib.mid .ib-pct{color:var(--yellow)} .ib.mid .ib-fill{background:var(--yellow)}
  .ib.low .ib-pct{color:var(--blue)} .ib.low .ib-fill{background:var(--blue)}
  .ib.none .ib-pct{color:var(--faint)} .ib.none .ib-fill{background:var(--faint)}
  .sum-send{background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .sum-send-title{font-size:12px;font-weight:700;margin-bottom:8px}
  .sum-send-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0} .sum-send-row b{font-size:16px;font-weight:700}
  .sum-send-row.ok{color:var(--green)} .sum-send-row.bad{color:var(--red)}
  .sum-send-head{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .sum-send-row .ssr-label{flex:1;font-weight:600} .sum-send-row .ssr-num{min-width:52px;text-align:right;color:var(--muted)} .sum-send-row .ssr-num b{font-size:15px;color:var(--ink)} .sum-send-row .ssr-rate{min-width:42px;text-align:right;font-weight:700}
  .sum-send-row.hi .ssr-label{color:var(--red)} .sum-send-row.hi .ssr-rate{color:var(--red)}
  .sum-send-row.mid .ssr-label{color:var(--yellow)} .sum-send-row.mid .ssr-rate{color:var(--yellow)}
  .sum-send-row.low .ssr-label{color:var(--blue)} .sum-send-row.low .ssr-rate{color:var(--blue)}
  .sum-send-foot{font-size:11px;color:var(--faint);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}

  .hm-filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)}
  .hm-filters label{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .hm-filters select{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-family:inherit;color:var(--ink);cursor:pointer}
  .hm-filters .f-count{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500}
  table.hm{border-collapse:collapse;width:100%;font-size:11.5px;min-width:560px}
  table.hm th{background:#fafbfd;color:var(--muted);font-weight:600;padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  table.hm td{padding:6px 8px;border-bottom:1px solid #f0f3f8;vertical-align:top}
  table.hm tr:last-child td{border-bottom:0}
  table.hm td.hm-c{white-space:normal;line-height:1.45;min-width:280px;color:var(--ink)} table.hm td.hm-c .off{color:var(--faint);font-style:italic}
  table.hm .hm-foot{margin-top:3px}
  table.hm .hm-foot .vlink{font-size:10.5px;color:var(--blue);text-decoration:none} table.hm .hm-foot .vlink:hover{text-decoration:underline} table.hm .hm-foot .vlink.off{color:var(--faint)}
  table.hm td.hm-i,table.hm td.hm-t,table.hm td.hm-s{white-space:nowrap}
  table.hm td.hm-t{font-variant-numeric:tabular-nums;color:var(--muted)}
  .q{color:var(--yellow);font-weight:600} .nosend{color:var(--faint)}

  .case-filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)}
  .case-filters label{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .case-filters select{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-family:inherit;color:var(--ink);cursor:pointer}
  .case-filters .f-count{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.cases{border-collapse:collapse;width:100%;font-size:11.5px;min-width:1060px}
  table.cases th{background:#fafbfd;color:var(--muted);font-weight:600;padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.cases th.cust{text-align:left;min-width:180px} table.cases th.st{text-align:left;min-width:150px} table.cases th.sender{min-width:56px}
  table.cases td{padding:6px;text-align:center;border-bottom:1px solid #f0f3f8;white-space:nowrap}
  table.cases tr:last-child td{border-bottom:0}
  td.cust{text-align:left;white-space:normal;min-width:230px;max-width:280px} td.cust b{font-size:12px}
  .cust-top{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
  td.cust .snip{color:var(--ink);font-size:11px;margin:3px 0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  td.cust .snip.off{color:var(--faint);font-style:italic}
  .cust-foot{margin-top:2px}
  td.sender .op-tag{font-size:11px;font-weight:600;background:#eef2ff;color:var(--purple);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .vlink{font-size:10.5px;color:var(--blue);text-decoration:none} .vlink:hover{text-decoration:underline}
  .vlink.off{color:var(--faint)}
  .it{font-size:10px;border-radius:3px;padding:1px 5px;background:#eef1f5;color:var(--muted);margin-left:4px}
  .it.hi{background:#fcebe9;color:var(--red)} .it.mid{background:var(--yellow-s);color:var(--yellow)}
  .ch{font-size:9.5px;border-radius:3px;padding:1px 4px;margin-left:4px}
  .ch.dm{background:#eaf1ff;color:var(--blue)} .ch.rc{background:#efeaff;color:var(--purple)}
  td.nd .nt{font-variant-numeric:tabular-nums;color:var(--muted)}
  td.nd.green{background:var(--green-s)} td.nd.green .nt{color:var(--green)}
  td.nd.yellow{background:var(--yellow-s)} td.nd.yellow .nt{color:var(--yellow)}
  td.nd.red{background:var(--red-s)} td.nd.red .nt{color:var(--red);font-weight:700}
  td.nd.neutral .nt{color:var(--faint)}
  td.st{text-align:left}
  .ok{color:var(--green);font-weight:600} .bad{color:var(--red);font-weight:600}

  table.cluster{border-collapse:collapse;width:100%;font-size:12.5px}
  table.cluster th{background:#fafbfd;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  table.cluster th.num,table.cluster td.num{text-align:center}
  table.cluster td{padding:8px 10px;border-bottom:1px solid #f0f3f8}
  .cl-name{font-weight:600}
  .cl-bar{min-width:160px} .cl-bar .bar{display:inline-block;width:100px;height:10px;background:#f1f4f9;border-radius:5px;overflow:hidden;vertical-align:middle}
  .cl-bar .fill{height:100%;background:var(--red);border-radius:5px} .cl-bar .pct{margin-left:8px;color:var(--muted);font-size:11px}
  table.cluster td.dist,table.cluster th.dist{font-size:11px;color:var(--muted)}
  table.cluster td.ex,table.cluster th.ex{font-size:11px;color:var(--ink);min-width:200px}
  table.cluster .red-t{color:var(--red);font-weight:700}

  .todos{display:grid;grid-template-columns:1fr;gap:10px}
  .todo{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fbfcfe}
  .todo-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .todo-no{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .todo-title{font-weight:700;font-size:13.5px} .todo-cnt{margin-left:auto;font-size:11px;color:var(--muted)}
  .todo-remedy{font-size:12px;color:var(--ink)} .todo-remedy b{color:var(--muted);font-weight:600}
  .todo-llm{font-size:12px;color:var(--ink);margin-top:6px;padding:8px 10px;background:#fff;border-left:3px solid var(--blue);border-radius:6px}
  .todo-llm b{color:var(--blue);font-weight:600}
  .todo-ex{font-size:11.5px;color:var(--muted);margin-top:5px} .todo-ex b{color:var(--ink);font-weight:600}
  .todo-assign{margin-top:8px;font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .todo-assign b{color:var(--muted);font-weight:600}
  .cb-group{display:inline-flex;gap:4px;flex-wrap:wrap}
  .cb-group .cb{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;user-select:none}
  .cb-group .cb input{margin:0;cursor:pointer}
  .asg-lbl{font-size:12px;color:var(--green);font-weight:700}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .sw.green{background:var(--green)} .sw.yellow{background:var(--yellow)} .sw.red{background:var(--red)} .sw.neutral{background:var(--faint)}
  .empty{color:var(--faint);text-align:center;padding:30px 0}

  .datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .datebar button{font-size:12px;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  .datebar button:hover{background:#f1f4f9} .datebar button:disabled{opacity:.4;cursor:not-allowed}
  .datebar input[type=date]{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
  .datebar .dphint{font-size:11px;color:var(--faint)}
  .liveflag{font-size:11px;color:var(--green);font-weight:600;background:var(--green-s);border-radius:999px;padding:3px 10px}

  .footnote{color:var(--muted);font-size:11.5px;margin-top:6px;padding:12px 14px;background:#fafbfd;border-radius:8px;border-left:3px solid var(--line)}
  .footnote b{color:var(--ink);font-weight:600} .footnote code{background:#f1f4f9;padding:1px 5px;border-radius:3px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 class="title">三人旅程汇总复盘 · 饭粒 / 野荞 / 夏夏</h1>
    <div class="subtitle" id="sub">加载中…</div>
    <div class="datebar">
      <button id="prevb" onclick="goDay(-1)">◀ 前一天</button>
      <input type="date" id="dp" onchange="goDate(this.value)" />
      <button id="nextb" onclick="goDay(1)">后一天 ▶</button>
      <button id="todayb" onclick="goToday()">今天</button>
      <button onclick="reload()">↻ 立即刷新</button>
      <span class="liveflag" id="liveflag" style="display:none">🟢 每 30 分钟自动刷新</span>
      <span class="dphint">今天的数据每 30 分钟自动刷新一次（每次刷新都是当下最新；想立刻看点 ↻立即刷新）；可往回切看昨天/前天</span>
    </div>
  </div>
  <div id="app"><div class="empty">加载中…</div></div>
</div>
<script>
  // 活数据后端（Akke Vercel 公开只读 API）。壳页静态托管在 upioai/wiki，跨域 CORS 已放行 upio.ai。
  var API = "https://akke.vercel.app/api/public/team-journey";
  var ASG_API = "https://akke.vercel.app/api/public/team-journey-assignments";
  var REFRESH_MS = 30 * 60 * 1000; // 30min
  var timer = null;
  var curDate = "";   // 当前查看日期 YYYY-MM-DD
  var curIsToday = false;

  function bjtToday(){
    var d = new Date(Date.now() + 8*3600000);
    return d.toISOString().slice(0,10);
  }
  function shiftDate(d, n){
    var t = new Date(d + "T00:00:00+08:00");
    t.setTime(t.getTime() + n*86400000);
    return new Date(t.getTime() + 8*3600000).toISOString().slice(0,10);
  }
  function fmtClock(iso){
    if(!iso) return "—";
    var d = new Date(new Date(iso).getTime() + 8*3600000);
    function p(n){ return String(n).padStart(2,"0"); }
    return p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }

  function syncNav(){
    var today = bjtToday();
    var nb = document.getElementById("nextb");
    var pb = document.getElementById("prevb");
    if(nb) nb.disabled = (curDate >= today);   // 不能切到未来
    if(pb) pb.disabled = (curDate <= "2026-06-11"); // 数据起点之前没有
    var tb = document.getElementById("todayb");
    if(tb) tb.disabled = (curDate >= today);   // 已在今天则置灰
    var lf = document.getElementById("liveflag");
    if(lf) lf.style.display = curIsToday ? "" : "none";
    var dp = document.getElementById("dp");
    if(dp){ dp.value = curDate; dp.max = today; }
  }

  function render(j){
    document.getElementById("app").innerHTML = j.html || '<div class="empty">当日无数据</div>';
    var sub = document.getElementById("sub");
    if(sub){
      sub.innerHTML = curDate + "（BJT 00:00–23:59）· 共 " + (j.total||0) + " 条 case · 达标线 = 评论→发出 ≤10min · "
        + (j.isToday ? "每 30 分钟自动刷新 · " : "") + "更新于 " + fmtClock(j.generatedAt);
    }
    // 注入后：初始化筛选计数 + 重新绑定指派勾选
    filterCases();
    filterHm();
    applyAssignmentsLocal();
    loadAssignments();
  }

  // ── 案例表筛选（意向 / 渠道 / 判定·卡点，纯前端显示隐藏行）──
  function filterCases(){
    var fi=document.getElementById("f-intent"),fc=document.getElementById("f-channel"),fb=document.getElementById("f-blocker");
    if(!fi||!fc)return;
    var wi=fi.value,wc=fc.value,wb=fb?fb.value:"",shown=0,total=0;
    document.querySelectorAll("table.cases tbody tr").forEach(function(tr){
      total++;
      var b=tr.dataset.blocker;
      var okB=!wb?true:wb==="ok"?b==="ok":wb==="blocked"?(b!=="ok"&&b.indexOf("timeout")!==0):wb==="timeout"?b.indexOf("timeout")===0:b===wb;
      var ok=(!wi||tr.dataset.intent===wi)&&(!wc||tr.dataset.channel===wc)&&okB;
      tr.style.display=ok?"":"none";
      if(ok)shown++;
    });
    var cnt=document.getElementById("f-count");
    if(cnt)cnt.textContent="显示 "+shown+" / 共 "+total+" 条";
  }
  window.filterCases=filterCases;

  // ── 高+中意向清单筛选（意向 / 发送状态）──
  function filterHm(){
    var fi=document.getElementById("hm-intent"),fs=document.getElementById("hm-send");
    if(!fi||!fs)return;
    var wi=fi.value,ws=fs.value,shown=0,total=0;
    document.querySelectorAll("table.hm tbody tr").forEach(function(tr){
      total++;
      var ok=(!wi||tr.dataset.intent===wi)&&(!ws||tr.dataset.send===ws);
      tr.style.display=ok?"":"none";
      if(ok)shown++;
    });
    var cnt=document.getElementById("hm-count");
    if(cnt)cnt.textContent="显示 "+shown+" / 共 "+total+" 条";
  }
  window.filterHm=filterHm;

  function load(date){
    curDate = date;
    document.getElementById("app").innerHTML = '<div class="empty">加载中…</div>';
    fetch(API + "?date=" + date + "&_t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.error){ document.getElementById("app").innerHTML = '<div class="empty">加载失败：' + j.error + '</div>'; return; }
        curIsToday = !!j.isToday;
        syncNav();
        render(j);
        scheduleAuto();
      })
      .catch(function(e){ document.getElementById("app").innerHTML = '<div class="empty">网络错误：' + e + '</div>'; });
  }
  function reload(){ load(curDate || bjtToday()); }
  function scheduleAuto(){
    if(timer){ clearInterval(timer); timer = null; }
    if(curIsToday){ timer = setInterval(function(){ load(bjtToday()); }, REFRESH_MS); }
  }
  function goToday(){ var t = bjtToday(); if(t !== curDate) load(t); }
  function goDate(d){ if(d && d !== curDate && d <= bjtToday()) load(d); }
  function goDay(n){
    var t = shiftDate(curDate || bjtToday(), n);
    if(t > bjtToday()) return;
    load(t);
  }

  // ── 指派共享（沿用 team-journey-assignments 端点 + localStorage 兜底）──
  function clusterOf(k){ return k.split("|")[1]; }
  function setLbl(g, v){ var lbl = g.parentElement.querySelector(".asg-lbl"); if(lbl) lbl.textContent = v ? ("→ " + v.split(",").join("、") + " 执行") : ""; }
  function saveAssignee(cb){
    var g = cb.closest(".cb-group");
    var k = g.dataset.k;
    var vals = Array.prototype.slice.call(g.querySelectorAll("input:checked")).map(function(c){ return c.value; });
    var v = vals.join(",");
    localStorage.setItem("tjr:" + k, v);
    setLbl(g, v);
    fetch(ASG_API, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ date: curDate, cluster_key: clusterOf(k), assignee: v }) })
      .catch(function(){});
  }
  window.saveAssignee = saveAssignee;
  function applyMap(map){
    document.querySelectorAll(".cb-group").forEach(function(g){
      var cl = clusterOf(g.dataset.k);
      var shared = map && map[cl];
      var local = localStorage.getItem("tjr:" + g.dataset.k);
      var v = (shared != null) ? shared : (local || "");
      var set = {};
      (v ? v.split(",") : []).forEach(function(n){ set[n] = 1; });
      g.querySelectorAll("input").forEach(function(c){ c.checked = !!set[c.value]; });
      setLbl(g, v);
    });
  }
  function applyAssignmentsLocal(){ applyMap(null); }
  function loadAssignments(){
    fetch(ASG_API + "?date=" + curDate + "&_t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && j.assignments) applyMap(j.assignments); })
      .catch(function(){});
  }

  load(bjtToday());
</script>
</body>
</html>
