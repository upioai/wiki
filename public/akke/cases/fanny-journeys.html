<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akke · 我的用户旅程页（5/29–6/25）</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-elevated: #141821;
    --bg-deep: #1a1f2b;
    --border: #242a38;
    --border-strong: #2f3646;
    --text: #e4e7ed;
    --text-dim: #9ba3b4;
    --text-muted: #6b7384;
    --accent: #8b5cf6;
    --accent-soft: rgba(139, 92, 246, 0.15);
    --info: #60a5fa;
    --info-soft: rgba(96, 165, 250, 0.12);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.75;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 56px 24px 120px; }

  .breadcrumb { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .breadcrumb a { color: var(--text-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb span { margin: 0 8px; color: var(--border-strong); }

  header.hero { padding: 16px 0 36px; border-bottom: 1px solid var(--border); margin-bottom: 36px; }
  .tag { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 500; margin-bottom: 16px; }
  h1 {
    font-size: 38px; font-weight: 700; margin: 0 0 14px;
    letter-spacing: -0.02em; line-height: 1.15;
    background: linear-gradient(135deg, #e4e7ed 30%, var(--accent) 80%, var(--info) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { font-size: 16px; color: var(--text-dim); margin: 0; max-width: 680px; line-height: 1.55; }
  .note-hint { margin-top: 14px; font-size: 13px; color: var(--text-muted); background: var(--info-soft); border: 1px solid rgba(96,165,250,0.2); border-radius: 8px; padding: 9px 13px; }

  .cases { display: grid; gap: 18px; }
  .case-item { display: grid; gap: 7px; }
  .case-card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 22px;
    text-decoration: none; color: inherit;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
    display: flex; gap: 18px; align-items: center;
  }
  .case-card:hover { border-color: var(--accent); background: var(--bg-deep); transform: translateY(-1px); }
  .case-date { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; width: 56px; }
  .case-body { flex: 1; min-width: 0; }
  .case-card h3 { margin: 0; font-size: 18px; font-weight: 600; color: var(--text); }
  .case-card .slug { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; word-break: break-all; }
  .case-arrow { color: var(--text-muted); font-size: 18px; flex-shrink: 0; transition: color 0.15s, transform 0.15s; }
  .case-card:hover .case-arrow { color: var(--accent); transform: translateX(2px); }

  .note {
    margin-left: 4px; border: 1px dashed var(--border-strong); border-radius: 10px;
    padding: 11px 15px; font-size: 14.5px; line-height: 1.6; color: var(--text-dim);
    background: rgba(20,24,33,0.5); min-height: 20px;
    outline: none; transition: border-color 0.15s, background 0.15s;
    white-space: pre-wrap; word-break: break-word;
  }
  .note:hover { border-color: var(--border-strong); }
  .note:focus { border-color: var(--accent); border-style: solid; background: var(--bg-elevated); color: var(--text); }
  .note:empty::before { content: attr(data-placeholder); color: var(--text-muted); }

  .saved-flash { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
  .saved-flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 48px; font-size: 13px; color: var(--text-muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="container">
  <div class="breadcrumb">
    <a href="https://upio.ai/akke/cases/">Akke 用户案例库</a><span>/</span>我的旅程页
  </div>

  <header class="hero">
    <span class="tag">饭粒 · 个人产出</span>
    <h1>我的用户旅程页</h1>
    <p class="subtitle">2026/5/29 – 6/25 期间生成的 11 条用户旅程案例。点击标题在新标签页打开，不影响当前页面。</p>
    <div class="note-hint">💡 每条下面的虚线框可以直接点进去打字写备注，自动保存。备注只存在你这台电脑的浏览器里，换设备 / 别人打开看不到，清浏览器缓存会丢。</div>
  </header>

  <div class="cases" id="cases">
    <!-- entries injected by script so note + card stay paired -->
  </div>

  <footer>共 11 条 · 数据口径：upioai-wiki 仓库 author=fanny、5/29–6/25 期间新增的案例页。</footer>
</div>

<div class="saved-flash" id="flash">已保存</div>

<script>
  const CASES = [
    { date: "06-24", title: "茅台、金妹", slug: "maotai-jinmei" },
    { date: "06-22", title: "@简单", slug: "jiandan" },
    { date: "06-22", title: "2019.8.11—9.17（眉山）", slug: "meishan-2019" },
    { date: "06-22", title: "转身", slug: "zhuanshen" },
    { date: "06-07", title: "倪敏", slug: "ni-min" },
    { date: "06-07", title: "涅磐重生", slug: "niepan-chongsheng" },
    { date: "06-01", title: "诀别书.", slug: "juebie-shu" },
    { date: "06-01", title: "希望你在灯火阑珊处", slug: "denghuo-lanshan" },
    { date: "05-31", title: "B嗯嗯", slug: "b-enen" },
    { date: "05-31", title: "杨鸿 · 安康柏樾城 125 三室", slug: "yanghong-ankang-125" },
    { date: "05-29", title: "小可✨", slug: "xiaoke" },
  ];

  const KEY = (slug) => "fanny-journey-note:" + slug;
  const container = document.getElementById("cases");
  const flash = document.getElementById("flash");
  let flashTimer = null;
  function showSaved() {
    flash.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => flash.classList.remove("show"), 1100);
  }

  for (const c of CASES) {
    const url = "https://upio.ai/akke/cases/" + c.slug;
    const item = document.createElement("div");
    item.className = "case-item";

    const a = document.createElement("a");
    a.className = "case-card";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<span class="case-date">' + c.date + '</span>'
      + '<span class="case-body"><h3></h3><div class="slug">' + c.slug + '</div></span>'
      + '<span class="case-arrow">↗</span>';
    a.querySelector("h3").textContent = c.title;

    const note = document.createElement("div");
    note.className = "note";
    note.contentEditable = "true";
    note.spellcheck = false;
    note.setAttribute("data-placeholder", "写点备注…（点这里直接打字）");
    note.textContent = localStorage.getItem(KEY(c.slug)) || "";
    let saveTimer = null;
    note.addEventListener("input", () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem(KEY(c.slug), note.textContent);
        showSaved();
      }, 400);
    });

    item.appendChild(a);
    item.appendChild(note);
    container.appendChild(item);
  }
</script>
</body>
</html>
