<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>抖音 Bug 集</title><style>
:root{--bg:#f4f6f8;--ink:#172b35;--muted:#647880;--line:#dce4e8;--teal:#087e83;--red:#c24b48;--amber:#ab731c;--green:#23715d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}a{color:var(--teal)}button,input,select{font:inherit}button,.button{border:1px solid var(--line);background:white;padding:9px 15px;border-radius:9px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--teal)}button:disabled{opacity:.5}
header{background:#102d36;color:white;padding:24px max(24px,calc((100vw - 1100px)/2)) 22px}header small{color:#72d1c9;letter-spacing:2px}header h1{font-size:27px;letter-spacing:-1px;margin:7px 0}header p{color:#b4cbd0;margin:0}header .button{background:transparent;color:white;border-color:#3d5c66}header .button:hover{border-color:#72d1c9}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
main{max-width:1150px;margin:auto;padding:24px}.status{padding:12px 16px;border:1px solid #b8d9d4;background:#e6f4f1;border-radius:10px;margin-bottom:18px}.status.bad{background:#fff0e6;border-color:#eac4a8;color:#8a4f1f}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;width:100%}.card .label{color:var(--muted);font-size:13px}.card strong{display:block;font-size:30px;line-height:1.3;font-variant-numeric:tabular-nums}.card small{color:var(--muted);font-size:12px}.card[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px}input,select{padding:9px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}input[type=search]{flex:1;min-width:200px}.hint{color:var(--muted);font-size:13px;margin:8px 0}
.bug{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:18px;margin:14px 0;background:white}.bug.done{border-left-color:#9fc9bd}.bug.p0{border-left-color:var(--red)}.bug:target{box-shadow:0 0 0 2px var(--teal)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}.bug p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.bug small{color:var(--muted)}.bug-number{font-family:ui-monospace,monospace;margin-right:8px}.badge{display:inline-block;padding:2px 8px;border-radius:5px;background:#edf3f4;font-size:12px}.badge.red{background:#fbe9e6;color:var(--red)}.badge.amber{background:#fbf1df;color:var(--amber)}.badge.green{background:#def3ec;color:var(--green)}
.bug dl{display:grid;grid-template-columns:90px 1fr;gap:10px}.bug dt{color:var(--muted)}.bug dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}details{margin:12px 0}summary{cursor:pointer;font-weight:600}.empty{padding:25px 0;color:var(--muted)}footer{margin:25px 0;color:var(--muted);font-size:12px}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:580px){header{padding:20px 16px}header h1{font-size:23px}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.card strong{font-size:26px}.panel{padding:15px}.bug{padding:14px}.bug dl{grid-template-columns:1fr;gap:4px}.bug dd{margin-bottom:10px}}
</style></head><body><header><small>AKKE / DOUYIN BUG LEDGER</small><h1>抖音 Bug 集</h1><p>抖音获客链路问题台账 · 编号固定、修复后不删除 · 北京时间</p><div class="links"><a class="button" target="_blank" rel="noopener" href="https://akke.vercel.app/douyin-bugs">新增 / 更新 Bug（登录）↗</a><a class="button" href="/akke/douyin-daily-live">号源每日需求看板</a><button id="refresh" class="button">立即刷新</button></div></header><main>
<div id="status" class="status" role="status">正在读取台账…</div>
<section id="cards" class="cards" aria-label="按状态统计"></section>
<section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="搜索编号、标题、原因或进展" aria-label="搜索 Bug"><select id="category" aria-label="按问题类型筛选"><option value="">全部问题类型</option></select><select id="priority" aria-label="按优先级筛选"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option></select><select id="sort" aria-label="排序"><option value="number">按编号（新→旧）</option><option value="updated">按最近更新</option></select></div><p id="count" class="hint" role="status"></p>
<details><summary>台账规则</summary><p class="hint">编号在机构内从 DY-001 递增，保存后固定，已解决不删除、空号不复用。同一问题复发更新原编号，新问题新增。代码已改但没在真实场景验证的，状态保持「待验证」。纯平台限制或采集异常先记为待查问题，不自动认定为软件缺陷。公开内容不含客户昵称、抖音号、私信原文和未脱敏截图。</p></details>
<div id="bugs"></div></section>
<footer>公开只读页面 · 修改需登录 · 每 60 秒自动刷新 · <span id="stamp">等待数据</span></footer></main>
<script>
const ORG='a32c119b-b25e-4206-b3dc-8126f0b12a99',API='https://akke.vercel.app/api/public/douyin-daily';
const STATUSES=['待处理','处理中','待验证','已解决'];
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Date(Date.now()+8*3600000).toISOString().slice(0,10),time=x=>x?new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'暂无记录';
const numberOf=b=>b.number||(/^DY-\d{6}$/.test(b.id)?'DY-'+String(Number(b.id.slice(3))).padStart(3,'0'):'待编号');
const numVal=b=>{const m=/^DY-(\d+)$/.exec(numberOf(b));return m?Number(m[1]):-1;};
let bugs=null,generatedAt=null,scope='open',controller=null,sequence=0,hashApplied=false;
function showStatus(text,bad=false){$('status').textContent=text;$('status').className='status'+(bad?' bad':'');}
function renderCards(){const count=s=>bugs.filter(b=>b.status===s).length,open=bugs.filter(b=>b.status!=='已解决').length;
 const defs=[['open','待关注',open,'未解决的全部'],...STATUSES.map(s=>[s,s,count(s),s==='待验证'?'已改、等真实场景验证':s==='已解决'?'保留记录，不删除':s==='处理中'?'正在修':'还没开始']),['all','全部',bugs.length,'含已解决']];
 $('cards').innerHTML=defs.map(([key,label,n,sub])=>`<button class="card" data-scope="${esc(key)}" aria-pressed="${scope===key}"><div class="label">${esc(label)}</div><strong>${n}</strong><small>${esc(sub)}</small></button>`).join('');}
function render(){if(!bugs)return;renderCards();
 const opened=new Set([...$('bugs').querySelectorAll('details[open]')].map(el=>el.id));
 const categories=[...new Set(bugs.map(b=>b.category||'其他'))].sort(),cat=$('category').value;
 $('category').innerHTML='<option value="">全部问题类型</option>'+categories.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=categories.includes(cat)?cat:'';
 const q=$('search').value.trim().toLowerCase(),pri=$('priority').value;
 let rows=bugs.filter(b=>(scope==='all'||(scope==='open'?b.status!=='已解决':b.status===scope))&&(!$('category').value||(b.category||'其他')===$('category').value)&&(!pri||b.priority===pri)&&[numberOf(b),b.id,b.title,b.detail,b.cause,b.fix,b.evidence].join(' ').toLowerCase().includes(q));
 rows=$('sort').value==='updated'?rows.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))):rows.sort((a,b)=>numVal(b)-numVal(a));
 const scopeName=scope==='open'?'待关注':scope==='all'?'全部':scope;
 $('count').textContent=`${scopeName} · 当前显示 ${rows.length} 条 / 台账共 ${bugs.length} 条`;
 const fields=[['detail','现场与现象'],['cause','原因'],['impact','影响范围'],['fix','修复进展'],['verification','验证结果'],['evidence','脱敏证据']];
 const statusClass=s=>s==='已解决'?'green':s==='待处理'?'red':s==='待验证'?'amber':'';
 $('bugs').innerHTML=rows.map(b=>{const n=numberOf(b);return `<article class="bug ${b.status==='已解决'?'done':''} ${b.priority==='P0'?'p0':''}" id="${esc(n)}"><div class="row"><h3><a class="bug-number" href="#${encodeURIComponent(n)}">${esc(n)}</a> ${esc(b.title)}</h3><span class="badge ${statusClass(b.status)}">${esc(b.status)}</span></div><p><span class="badge">${esc(b.category||'其他')}</span> <span class="badge ${b.priority==='P0'?'red':''}">${esc(b.priority)}</span> <small>更新于 ${esc(time(b.updatedAt))}</small></p><p><b>现象：</b>${esc(b.detail||'未记录')}</p><p><b>原因：</b>${esc(b.cause||'待查明，不根据现象推断根因。')}</p><p><b>进度：</b>${esc(b.fix||'尚未记录修复进展。')}</p><p class="hint">验证：${esc(b.verification||'未记录验证结果')}</p><details id="record-${esc(b.id)}" ${opened.has('record-'+b.id)?'open':''}><summary>查看完整记录</summary><dl>${fields.map(([k,l])=>`<dt>${l}</dt><dd>${esc(b[k]||'未记录')}</dd>`).join('')}</dl>${b.history?.length?`<details><summary>历史查证记录（${b.history.length}）</summary>${b.history.map(h=>`<section><h4>${esc(time(h.at))} · ${esc(h.status)}</h4><b>${esc(h.title)}</b><dl>${fields.map(([k,l])=>`<dt>${l}</dt><dd>${esc(h[k]||'未记录')}</dd>`).join('')}</dl></section>`).join('')}</details>`:''}</details></article>`;}).join('')||'<p class="empty">没有符合条件的 Bug，可清空筛选或点「全部」。新问题请点上方「新增 / 更新 Bug」登记。</p>';
 $('stamp').textContent='数据生成于 '+time(generatedAt);}
function showHash(){let h;try{h=decodeURIComponent(location.hash.slice(1));}catch{return;}if(!/^DY-\d{3,6}$/.test(h))return;scope='all';$('search').value='';$('category').value='';$('priority').value='';render();document.getElementById(h)?.scrollIntoView();document.getElementById(h)?.querySelector('details')?.setAttribute('open','');}
async function load(){const n=++sequence;if(controller)controller.abort();controller=new AbortController();const cur=controller;const t=setTimeout(()=>cur.abort(),65000);$('refresh').disabled=true;if(bugs)showStatus('正在刷新…下方为上次读取的数据。');
 try{const url=new URL(API);url.searchParams.set('date',day());url.searchParams.set('org',ORG);const key=new URLSearchParams(location.search).get('k');if(key)url.searchParams.set('k',key);
  const r=await fetch(url,{cache:'no-store',signal:cur.signal});const j=await r.json();if(!r.ok)throw new Error(j.error||'接口请求失败');if(n!==sequence)return;if(!Array.isArray(j.bugs))throw new Error('返回数据缺少 Bug 台账');
  bugs=j.bugs;generatedAt=j.generatedAt;render();if(!hashApplied){hashApplied=true;showHash();}
  showStatus((j.stale?'接口暂时异常，显示旧缓存 · ':'已更新 · ')+'数据生成于 '+time(j.generatedAt),!!j.stale);}
 catch(e){if(n===sequence)showStatus('刷新失败：'+(e.name==='AbortError'?'请求超时':e.message)+(bugs?'。页面保留上次的数据（生成于 '+time(generatedAt)+'）。':'。暂无可展示数据，请稍后重试。'),true);}
 finally{clearTimeout(t);if(n===sequence)$('refresh').disabled=false;}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-scope]');if(c){scope=c.dataset.scope;render();}});
$('refresh').onclick=load;$('search').oninput=render;$('category').onchange=render;$('priority').onchange=render;$('sort').onchange=render;window.addEventListener('hashchange',showHash);
setInterval(()=>{if(!document.hidden&&!$('refresh').disabled)load();},60000);load();
</script></body></html>
