* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
#app { display: flex; flex-direction: column; height: 100%; padding-inline: 16px; padding-block: 0; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px }

h1 { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance }
.sub { color: var(--muted); font-size: 12px; font-family: var(--font-mono) }

.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600 }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer }
.btn:hover, .tabs button:hover { outline: 1px solid var(--accent) }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=search] { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0; width: 220px; max-width: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; min-height: 0; padding-block: 12px }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto } html, body { height: auto } }
.canvas { position: relative; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; min-width: 0 }
.canvas svg { display: block }
.node { cursor: pointer }
.node rect.box { fill: var(--panel); stroke: var(--line); }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2 }
.node.hit rect.box { stroke: var(--k-gate); stroke-width: 2 }
.node.dim { opacity: .45 }
.node text { fill: var(--ink); font-size: 12px; font-family: var(--font-ui) }
.node text.meta { fill: var(--muted); font-size: 10px; font-family: var(--font-mono) }
.node text.toggle { fill: var(--muted); font-size: 12px; font-family: var(--font-mono) }
.node.del text.lbl { text-decoration: line-through }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4 }
.edge.ref { stroke-dasharray: 4 3; stroke: var(--accent) }
.group rect { fill: var(--accent-soft); stroke: none }
.group text { fill: var(--accent); font-size: 12px; font-weight: 700; font-family: var(--font-ui) }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow: auto; min-width: 0; display: flex; flex-direction: column; gap: 10px }
aside h2 { font-size: 15px; margin: 0; text-wrap: balance }
.kv { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 4px 8px; font-size: 12px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; font-family: var(--font-mono); word-break: break-all }
.kv a { color: var(--accent) }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap }
.crumbs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 4px }
.crumbs button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0 }
.note { font-size: 13px; line-height: 1.6 }
.list { display: flex; flex-direction: column; gap: 2px }
.list button { text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 12px; padding: 3px 4px; border-radius: 4px; cursor: pointer }
.list button:hover { background: var(--accent-soft) }
.modsum { display: flex; flex-direction: column; gap: 6px; font-size: 12px }
.modsum div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-block: 3px }
.modsum b { font-variant-numeric: tabular-nums; font-family: var(--font-mono) }
.matrix-wrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0 }
table { border-collapse: collapse; font-size: 12px; min-width: 760px }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel) }
td.cat { color: var(--muted); white-space: nowrap }
.g-wired { color: var(--c-new) } .g-exempt { color: var(--c-keep) } .g-gap { color: var(--c-del); font-weight: 700 }
.findings { margin-top: 14px; font-size: 13px; line-height: 1.6 }
.findings li { margin-block: 4px }
.intro { font-size: 13px; color: var(--muted); max-width: 72ch; line-height: 1.6; margin: 0 }
@media (prefers-reduced-motion: no-preference) { .node rect.box { transition: stroke .15s } }

"hasWecomWechatPush/hasRepeatedOpener/hasDodgedPriceAsk/hasBackToBackStoreVisitPush/hasPrematureStoreVisitPush/hasUnpromptedUnitPrice 均以 RHYTHM_GATES_MOVED_TO_PROMPT ? null : ... 短路，恒为 null。"}, {"fn": "shouldFireDouyinHardGate 4 轮硬门", "lines": "3353-3372, 3689-3720", "evidence": "仅对非企微/个微通道生效(isPrivateOneToOneChannel 返回 true 则关)。生产 chatReply 调用方(route/ process/recall)均带企微 persona 或 channel=weixin，是否仍有触发的抖音 DM 调用方待核；非死代码但近乎不可达。"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const h = React.createElement, { useState, useMemo, useEffect, useRef } = React;
const GH = 'https://github.com/Akke-AI/wecom-chat/blob/' + D.sha + '/';
const KIND = { entry:'入口', branch:'分支 / 分组', step:'步骤', llm:'调 AI', gate:'检查 / 闸', rewrite:'改写', prompt:'拼说明书', fact:'事实 / 数据', persist:'落库 / 记录', exit:'出口（结束请求）', helper:'辅助', fast:'确定性快答', dead:'死代码', send:'送达' };
const CHG = { '不动':'--c-keep', '搬家':'--c-move', '新增':'--c-new', '删除':'--c-del', '合并':'--c-merge', '接入':'--c-hook', '改写':'--c-merge' };
const byId = new Map(D.nodes.map(n => [n.id, n]));
const kidsOf = new Map();
for (const n of D.nodes) { const p = n.parent || '__root'; if (!kidsOf.has(p)) kidsOf.set(p, []); kidsOf.get(p).push(n); }
for (const arr of kidsOf.values()) arr.sort((a, b) => (a.i ?? 0) - (b.i ?? 0));
const ROOTS = ['route.post', 'exits', 'lib', 'dead'];
const link = n => n.file ? GH + n.file + (n.line ? '#L' + n.line + (n.lineEnd ? '-L' + n.lineEnd : '') : '') : null;
const kc = k => `var(--k-${KIND[k] ? k : 'step'})`;
const short = (s, m) => !s ? '' : (s.length > m ? s.slice(0, m - 1) + '…' : s);
const DEFAULT_OPEN = new Set(['route.post', 'route.post.handle', 'route.handle', 'route.generate', 'route.generate.chatReply', 'llm.chatReply', 'exits']);
const pathTo = id => { const out = []; let c = byId.get(id); while (c) { out.unshift(c); c = c.parent ? byId.get(c.parent) : null; } return out; };

// Build the visible tree. In "after" mode children whose target module differs from the parent's are wrapped in a module group.
function buildTree(open, mode) {
  const W = 236, H = 40, COL = 276, ROW = 48;
  const items = [], edges = [];
  let leaf = 0, maxDepth = 0;
  function visit(node, depth, isGroup) {
    maxDepth = Math.max(maxDepth, depth);
    const id = isGroup ? node.gid : node.id;
    let children = [];
    const expanded = isGroup ? true : open.has(node.id);
    if (!isGroup && expanded) {
      const raw = (kidsOf.get(node.id) || []);
      if (mode === 'after') {
        const same = [], groups = new Map();
        for (const c of raw) {
          if (c.mod === node.mod || !D.mods[c.mod]) same.push(c);
          else { if (!groups.has(c.mod)) groups.set(c.mod, []); groups.get(c.mod).push(c); }
        }
        children = same.map(c => ({ n: c }));
        for (const [m, list] of groups) children.push({ g: { gid: node.id + '::' + m, mod: m, list } });
      } else children = raw.map(c => ({ n: c }));
    } else if (isGroup) children = node.list.map(c => ({ n: c }));
    const placed = children.map(c => c.g ? visit(c.g, depth + 1, true) : visit(c.n, depth + 1, false));
    let y;
    if (placed.length) y = (placed[0].y + placed[placed.length - 1].y) / 2; else y = leaf++ * ROW;
    const it = { id, node: isGroup ? null : node, group: isGroup ? node : null, x: depth * COL, y, depth, hasKids: isGroup ? true : (kidsOf.get(node.id) || []).length > 0, expanded };
    items.push(it);
    for (const p of placed) edges.push({ from: it, to: p });
    return it;
  }
  const roots = ROOTS.map(r => byId.get(r)).filter(Boolean);
  const tops = [];
  for (const r of roots) { tops.push(visit(r, 0, false)); leaf += 0.6; }
  return { items, edges, W, H, width: (maxDepth + 1) * COL + 40, height: leaf * ROW + 40 };
}

function Tree({ mode, open, setOpen, sel, setSel, query }) {
  const t = useMemo(() => buildTree(open, mode), [open, mode]);
  const ref = useRef(null);
  const q = query.trim().toLowerCase();
  const hit = n => q && n && ((n.label || '').toLowerCase().includes(q) || (n.fn || '').toLowerCase().includes(q) || (n.file || '').toLowerCase().includes(q));
  useEffect(() => { // scroll selected into view
    const it = t.items.find(i => i.id === sel); const el = ref.current;
    if (it && el) { const x = it.x + 20, y = it.y + 20; if (x < el.scrollLeft || x > el.scrollLeft + el.clientWidth - 260 || y < el.scrollTop || y > el.scrollTop + el.clientHeight - 60) el.scrollTo({ left: Math.max(0, x - 80), top: Math.max(0, y - el.clientHeight / 3), behavior: 'smooth' }); }
  }, [sel, t]);
  const kids = [];
  for (const e of t.edges) {
    const x1 = e.from.x + t.W + 20, y1 = e.from.y + 20 + t.H / 2, x2 = e.to.x + 20, y2 = e.to.y + 20 + t.H / 2, mx = (x1 + x2) / 2;
    kids.push(h('path', { key: 'e' + e.from.id + '>' + e.to.id, className: 'edge', d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }));
  }
  for (const it of t.items) {
    const x = it.x + 20, y = it.y + 20;
    if (it.group) {
      const g = it.group;
      kids.push(h('g', { key: it.id, className: 'group', transform: `translate(${x},${y})` },
        h('rect', { width: t.W, height: t.H, rx: 6 }),
        h('text', { x: 10, y: 17 }, '→ ' + short(D.mods[g.mod].split('（')[0], 30)),
        h('text', { x: 10, y: 32, style: { fontWeight: 400, fontSize: 10 } }, short((D.mods[g.mod].match(/（(.*)）/) || [,''])[1], 34) + ' · ' + g.list.length + ' 项')));
      continue;
    }
    const n = it.node, isSel = sel === n.id, chg = mode === 'after' ? n.chg : null;
    const dim = mode === 'after' && n.chg === '不动' && n.mod !== 'keep';
    const cls = ['node', isSel && 'sel', hit(n) && 'hit', dim && 'dim', mode === 'after' && n.chg === '删除' && 'del'].filter(Boolean).join(' ');
    const meta = n.file ? short(n.file.split('/').pop(), 22) + (n.line ? ':' + n.line : '') : (n.fn ? short(n.fn, 30) : '');
    kids.push(h('g', { key: it.id, className: cls, transform: `translate(${x},${y})`, tabIndex: 0, role: 'button', 'aria-label': n.label,
      onClick: () => { setSel(n.id); if (it.hasKids) { const s = new Set(open); s.has(n.id) ? s.delete(n.id) : s.add(n.id); setOpen(s); } },
      onKeyDown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.currentTarget.dispatchEvent(new MouseEvent('click', { bubbles: true })); } } },
      h('rect', { className: 'box', width: t.W, height: t.H, rx: 6 }),
      h('rect', { width: 5, height: t.H, rx: 2, fill: kc(n.kind) }),
      chg ? h('rect', { x: t.W - 6, y: 0, width: 6, height: t.H, rx: 2, fill: `var(${CHG[chg] || '--c-keep'})` }) : null,
      h('text', { className: 'lbl', x: 12, y: 17 }, short(n.label, 19)),
      h('text', { className: 'meta', x: 12, y: 32 }, meta + (n.ref ? '  ↪ 见主 chatReply' : '')),
      it.hasKids ? h('text', { className: 'toggle', x: t.W - (chg ? 20 : 14), y: 25 }, it.expanded ? '−' : '+') : null));
  }
  return h('div', { className: 'canvas', ref },
    h('svg', { width: t.width, height: t.height, role: 'img', 'aria-label': mode === 'after' ? '拆分后调用树' : '拆分前调用树' }, kids));
}

function Detail({ sel, setSel, mode, revealTo }) {
  const n = byId.get(sel);
  if (!n) return h('aside', null, h('h2', null, '点任意节点看详情'), h('p', { className: 'note' }, '节点里第一行是功能，第二行是代码位置（文件:行号）。左侧色条是节点类型；「拆分后」视图右侧色条是它的去向。'), h(ModSummary));
  const crumbs = pathTo(sel);
  const kids = kidsOf.get(n.id) || [];
  const url = link(n);
  return h('aside', null,
    h('div', { className: 'crumbs' }, crumbs.map((c, i) => h(React.Fragment, { key: c.id }, i ? '›' : null, h('button', { onClick: () => revealTo(c.id) }, short(c.label, 14))))),
    h('h2', null, n.label),
    h('div', { className: 'row' },
      h('span', { className: 'chip', style: { color: kc(n.kind) } }, KIND[n.kind] || n.kind),
      n.chg ? h('span', { className: 'chip', style: { color: `var(${CHG[n.chg] || '--c-keep'})` } }, '拆分后：' + n.chg) : null,
      n.endsRequest && n.endsRequest !== 'none' ? h('span', { className: 'chip', style: { color: 'var(--k-exit)' } }, '会结束请求：' + n.endsRequest) : null),
    h('dl', { className: 'kv' },
      n.fn ? [h('dt', { key: 'a' }, '函数'), h('dd', { key: 'b' }, n.fn)] : null,
      n.file ? [h('dt', { key: 'c' }, '调用处'), h('dd', { key: 'd' }, url ? h('a', { href: url, target: '_blank', rel: 'noopener' }, n.file + (n.line ? ':' + n.line : '')) : n.file)] : null,
      n.defFile ? [h('dt', { key: 'e' }, '定义处'), h('dd', { key: 'f' }, h('a', { href: GH + n.defFile + (n.defLine ? '#L' + n.defLine : ''), target: '_blank', rel: 'noopener' }, n.defFile + (n.defLine ? ':' + n.defLine : '')))] : null,
      n.mod ? [h('dt', { key: 'g' }, '拆分后'), h('dd', { key: 'h', style: { fontFamily: 'var(--font-ui)' } }, D.mods[n.mod] || n.mod)] : null),
    n.note ? h('p', { className: 'note' }, n.note) : null,
    n.ref ? h('button', { className: 'btn', onClick: () => revealTo(n.ref) }, '跳到主 chatReply') : null,
    n.gates ? h('div', null, h('div', { className: 'sub' }, '这个出口过的检查'), h('dl', { className: 'kv' }, D.gates.map(g => [h('dt', { key: g.id + 'a' }, short(g.label, 6)), h('dd', { key: g.id + 'b', className: 'g-' + n.gates[g.id] }, n.gates[g.id] + (n.gateNotes && n.gateNotes[g.id] ? '：' + n.gateNotes[g.id] : ''))]))) : null,
    n.codeFindings ? h('div', { className: 'note' }, h('b', null, '代码里发现：'), [].concat(n.codeFindings).map((f, i) => h('div', { key: i }, '· ' + (typeof f === 'string' ? f : JSON.stringify(f))))) : null,
    kids.length ? h('div', null, h('div', { className: 'sub' }, `子节点 ${kids.length} 个（按执行顺序）`), h('div', { className: 'list' }, kids.map((c, i) => h('button', { key: c.id, onClick: () => revealTo(c.id) }, `${i + 1}. ${c.label}`)))) : null);
}

function ModSummary() {
  const counts = {};
  for (const n of D.nodes) { if (!n.mod) continue; counts[n.mod] = counts[n.mod] || {}; counts[n.mod][n.chg] = (counts[n.mod][n.chg] || 0) + 1; }
  return h('div', null, h('div', { className: 'sub' }, '拆分后各去向的节点数（本图里的节点，不是代码行数）'),
    h('div', { className: 'modsum' }, Object.keys(D.mods).filter(m => counts[m]).map(m => h('div', { key: m }, h('span', null, D.mods[m]), h('b', null, Object.entries(counts[m]).map(([k, v]) => k + ' ' + v).join(' · '))))));
}

function Matrix({ revealTo, setTab }) {
  const cats = [...new Set(D.exits.map(e => e.category))];
  return h('div', { className: 'matrix-wrap' },
    h('p', { className: 'intro' }, '登记表 src/lib/outbound/exit-registry.ts 的 19 个出口 × 5 道检查。wired＝接上了；exempt＝有意不接，登记了理由；gap＝已知漏接。点出口名可以跳到树里。'),
    h('table', null,
      h('thead', null, h('tr', null, h('th', null, '类别'), h('th', null, '出口'), D.gates.map(g => h('th', { key: g.id }, g.label.split('（')[0])))),
      h('tbody', null, cats.flatMap(c => D.exits.filter(e => e.category === c).map((e, i) => h('tr', { key: e.id },
        h('td', { className: 'cat' }, i ? '' : c),
        h('td', null, h('button', { className: 'btn', style: { fontSize: 12, padding: '2px 6px', textAlign: 'left' }, onClick: () => { setTab('before'); revealTo('exit.' + e.id); } }, e.label.split('（')[0])),
        D.gates.map(g => h('td', { key: g.id, className: 'g-' + e.gates[g.id], title: (e.gateNotes && e.gateNotes[g.id]) || '' }, e.gates[g.id]))))))),
    h('div', { className: 'findings' }, h('b', null, '读代码时发现、登记表没写出来的：'), h('ul', null, D.findings.map((f, i) => h('li', { key: i }, f)))));
}

function App() {
  const [tab, setTab] = useState(() => { try { return localStorage.getItem('tab') || 'before'; } catch { return 'before'; } });
  const [open, setOpen] = useState(DEFAULT_OPEN);
  const [sel, setSel] = useState('llm.chatReply');
  const [query, setQuery] = useState('');
  useEffect(() => { try { localStorage.setItem('tab', tab); } catch {} }, [tab]);
  const revealTo = id => { const s = new Set(open); for (const c of pathTo(id)) if (c.id !== id) s.add(c.id); setOpen(s); setSel(id); };
  const search = () => { const q = query.trim().toLowerCase(); if (!q) return; const m = D.nodes.find(n => (n.label || '').toLowerCase().includes(q) || (n.fn || '').toLowerCase().includes(q)); if (m) revealTo(m.id); };
  const expandAll = () => setOpen(new Set(D.nodes.filter(n => kidsOf.has(n.id)).map(n => n.id)));
  const nCount = D.nodes.length;
  return h(React.Fragment, null,
    h('header', null,
      h('div', { className: 'row' }, h('h1', null, '回复链路拆分图'),
        h('span', { className: 'sub' }, 'wecom-chat @ ', h('a', { href: 'https://github.com/Akke-AI/wecom-chat/commit/' + D.sha, target: '_blank', rel: 'noopener' }, D.sha.slice(0, 8)), ` · ${nCount} 个节点 · 行号都指向这一版代码`)),
      h('div', { className: 'row' },
        h('div', { className: 'tabs', role: 'group', 'aria-label': '视图' },
          [['before', '拆分前（现状）'], ['after', '拆分后（目标）'], ['matrix', '出口 × 检查']].map(([k, l]) => h('button', { key: k, 'aria-pressed': tab === k, onClick: () => setTab(k) }, l))),
        tab !== 'matrix' ? [
          h('input', { key: 's', id: 'q', type: 'search', placeholder: '搜函数名或中文，回车定位', value: query, onChange: e => setQuery(e.target.value), onKeyDown: e => e.key === 'Enter' && search() }),
          h('button', { key: 'a', className: 'btn', onClick: expandAll }, '全部展开'),
          h('button', { key: 'b', className: 'btn', onClick: () => setOpen(new Set(DEFAULT_OPEN)) }, '恢复默认')] : null),
      tab !== 'matrix' ? h('div', { className: 'legend' },
        Object.entries(KIND).map(([k, l]) => h('span', { key: k }, h('i', { className: 'sw', style: { background: kc(k) } }), l)),
        tab === 'after' ? Object.entries(CHG).filter(([k]) => k !== '改写').map(([k, v]) => h('span', { key: k }, h('i', { className: 'sw', style: { background: `var(${v})`, outline: '1px solid var(--line)' } }), '去向：' + k)) : null) : null),
    tab === 'matrix' ? h('main', { style: { gridTemplateColumns: 'minmax(0,1fr)' } }, h(Matrix, { revealTo, setTab })) :
      h('main', null, h(Tree, { mode: tab, open, setOpen, sel, setSel, query }), h(Detail, { sel, setSel, mode: tab, revealTo })));
}
ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>
