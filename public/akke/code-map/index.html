<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/akke/code-map/favicon.svg" />
    <title>wecom-chat 代码地图</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      #gate{--g-bg:#ECEFEE;--g-surface:#fff;--g-ink:#16201E;--g-ink-2:#47524F;--g-line:rgba(22,32,30,.18);--g-accent:#0E6656;--g-err:#B53A2A;
        position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--g-bg);color:var(--g-ink);
        font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;z-index:9999}
      @media (prefers-color-scheme:dark){#gate{--g-bg:#111816;--g-surface:#18211F;--g-ink:#E4ECE9;--g-ink-2:#A9B7B3;--g-line:rgba(228,236,233,.2);--g-accent:#4CC2A6;--g-err:#EE7C69}}
      body{margin:0}
      #gate form{background:var(--g-surface);border:1px solid var(--g-line);border-radius:12px;padding:28px 24px;width:min(100%,380px);display:grid;gap:12px}
      #gate h1{font-size:20px;margin:0}#gate p{margin:0;color:var(--g-ink-2);font-size:14px;line-height:1.6}
      #gate input{font:inherit;padding:10px 12px;border:1px solid var(--g-line);border-radius:8px;background:transparent;color:var(--g-ink)}
      #gate button{font:inherit;padding:10px;border:0;border-radius:8px;background:var(--g-accent);color:#fff;cursor:pointer}
      #gate button:disabled{opacity:.6;cursor:wait}#gate-e{color:var(--g-err);min-height:1.2em;font-size:14px}
    </style>
  </head>
  <body>
    <div id="gate">
      <form id="gate-f">
        <h1>wecom-chat 代码地图</h1>
        <p>团队内部页面，输入密码后查看。</p>
        <input id="gate-p" type="password" autocomplete="current-password" placeholder="密码" required autofocus />
        <button id="gate-b" type="submit">打开</button>
        <div id="gate-e" role="alert"></div>
      </form>
    </div>
    <script>
      // 图谱只以密文发布（tools/code-map-encrypt.mjs 生成 graph.html.enc、meta.json.enc + keyinfo.json）。
      // graph.html 是 graphify 导出的单文件页面（数据内联），输对密码后解密，整页换成它。
      (function () {
        var BASE = "/akke/code-map/", SK = "__codemap_pw__";
        var u = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
        var getJson = function (name) {
          return fetch(BASE + name, { cache: "no-store" }).then(function (r) {
            if (!r.ok) throw new Error(name + " HTTP " + r.status);
            return r.json();
          });
        };
        async function unlock(pw) {
          var info = await getJson("keyinfo.json");
          var k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
          var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u(info.s), iterations: info.n, hash: "SHA-256" },
            k0, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          var open = function (name) {
            return getJson(name + ".enc").then(function (d) {
              return crypto.subtle.decrypt({ name: "AES-GCM", iv: u(d.i) }, key, u(d.c));
            }).then(function (b) { return new TextDecoder().decode(b); });
          };
          await open("meta.json"); // 密码不对在这里就抛错，不用先下载整张图
          return open("graph.html");
        }
        async function go(pw, remember) {
          var b = document.getElementById("gate-b"), e = document.getElementById("gate-e");
          b.disabled = true; e.textContent = "解密中…";
          try {
            var html = await unlock(pw);
            try { if (remember) sessionStorage.setItem(SK, pw); } catch (x) {}
            document.open(); document.write(html); document.close();
          } catch (x) {
            try { sessionStorage.removeItem(SK); } catch (y) {}
            e.textContent = x && x.name === "OperationError" ? "密码不对，再试一次。" : "打不开：" + (x && x.message || x);
            b.disabled = false;
          }
        }
        document.getElementById("gate-f").addEventListener("submit", function (ev) {
          ev.preventDefault(); go(document.getElementById("gate-p").value, true);
        });
        try { var saved = sessionStorage.getItem(SK); if (saved) go(saved, false); } catch (x) {}
      })();
    </script>
  </body>
</html>
