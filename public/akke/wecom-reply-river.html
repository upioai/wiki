* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
#app { padding-inline: 16px; padding-block: 0 32px; max-width: 1680px; margin-inline: auto }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px }
h1 { font-family: var(--font-display); font-size: 22px; margin: 0; letter-spacing: .02em; text-wrap: balance }

.sub { color: var(--muted); font-size: 12px; font-family: var(--font-mono) }
a { color: var(--water) }

.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--water); color: var(--paper); font-weight: 600 }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--paper) }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--water); outline-offset: 2px }
.intro { color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 80ch; margin: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.sw { width: 12px; height: 4px; border-radius: 2px; display: inline-block }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
section.view { display: flex; flex-direction: column; gap: 12px; padding-block: 14px }
.diagram { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.diagram svg { display: block }
svg text { font-family: var(--font-ui) }
.st { cursor: pointer }
.st:hover .lbl, .st.sel .lbl { fill: var(--ink); font-weight: 700 }
.lbl { fill: var(--muted); font-size: 11px }
.st.sel .mk { stroke-width: 3 }
.ph-t { font-family: var(--font-display); font-size: 13px; font-weight: 700; fill: var(--ink) }
.ph-n { font-family: var(--font-mono); font-size: 10px; fill: var(--muted) }
.lane-t { font-size: 12px; font-weight: 500 }
.mono { font-family: var(--font-mono) }
.trib { fill: none; stroke-width: 2.2; opacity: .85 }
.trib.dim { opacity: .12 }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px }
.phases { display: flex; flex-wrap: wrap; gap: 6px }
.phases button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 4px 10px; border-radius: 14px; cursor: pointer }
.phases button[aria-pressed="true"] { border-color: var(--water); background: var(--water-soft); font-weight: 600 }
.tree { display: flex; flex-direction: column; font-size: 13px; overflow-x: auto }
.tr { display: grid; grid-template-columns: 16px 10px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; min-width: 0 }
.tr:hover { background: var(--grid) }
.tr.sel { background: var(--water-soft) }
.tr .tg { color: var(--muted); font-family: var(--font-mono); font-size: 12px; text-align: center }
.tr .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tr .nm small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; margin-left: 6px }
.tr.del .nm { text-decoration: line-through; color: var(--muted) }
.badges { display: flex; gap: 4px; flex-wrap: nowrap }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5 }
.kv { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 5px 10px; font-size: 12.5px; margin: 0 }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; word-break: break-all }
.kv .chip { white-space: normal }
.note { font-size: 13px; line-height: 1.7; margin: 0 }
.crumbs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center }
.crumbs button { border: 0; background: none; color: var(--water); font: inherit; cursor: pointer; padding: 0 }
table { border-collapse: collapse; font-size: 12.5px; width: 100%; min-width: 760px }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle }
th { color: var(--muted); font-weight: 500; font-size: 12px }
td.c { text-align: center; font-size: 15px; font-weight: 700 }
tr.ex { cursor: pointer }
tr.ex:hover td { background: var(--grid) }
tr.ex.open td { background: var(--water-soft) }
.g-wired { color: var(--o-fixed) } .g-exempt { color: var(--o-skip); font-weight: 400 } .g-gap { color: var(--o-err) }
.track { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-block: 6px }
.track .stp { border: 1px solid var(--line); border-left: 4px solid var(--k-other); border-radius: 6px; padding: 4px 8px; font-size: 12px; background: var(--paper); max-width: 320px; min-width: 0 }
.track .arr { color: var(--muted) }
.findings li { overflow-wrap: anywhere }
.findings { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.7; display: flex; flex-direction: column; gap: 6px }
.sum { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px }
.sum div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-block: 3px }
.sum b { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.rib { cursor: pointer }
@media (prefers-reduced-motion: no-preference) { .trib, .rib path { transition: opacity .15s } }

    h('p', { className: 'intro' }, '一条客户消息从左边进来，沿主河道按真实执行顺序往右流。往下分出支流的站点会在那里把请求结束掉，支流按去向汇成底下几条水道；没有支流的站点只做处理、不结束请求。快路径里的营销终态、选择题、B 端命中后直接返回，不经过右半段。走到最右边的才是正常发给客户的那一条。河道粗细只表示结构，不代表流量。'),
    h('div', { className: 'row' },
      h('div', { className: 'seg', role: 'group', 'aria-label': '着色方式' },
        h('button', { 'aria-pressed': !after, onClick: () => setAfter(false) }, '拆分前 · 按类型着色'),
        h('button', { 'aria-pressed': after, onClick: () => setAfter(true) }, '拆分后 · 按去向模块着色')),
      after
        ? h('div', { className: 'legend' }, MODS.map(m => h('span', { key: m }, h('i', { className: 'dot', style: { background: v(MODC[m]) } }), D.mods[m])))
        : h('div', { className: 'legend' },
            h('span', null, '◆ 检查'), h('span', null, '● 调 AI'), h('span', null, '■ 改写 / 落库 / 拼说明书'), h('span', null, '○ 步骤'), h('span', null, h('b', { style: { color: v('--k-llm') } }, '↩'), ' 有提前 return'),
            h('span', null, '点左下角水道名，只看那一类去向'))),
    h('div', { className: 'diagram' }, h(River, { sel, onSel, after, focusOut, setFocusOut })),
    h('div', { className: 'phases', role: 'group', 'aria-label': '河段' }, PHASES.map(p => h('button', { key: p.k, 'aria-pressed': p.k === ph, onClick: () => onSel(p.st[0].id) }, p.t))),
    h('div', { className: 'split' },
      h('div', { className: 'panel' },
        h('h2', null, P.t), h('p', { className: 'intro' }, P.d),
        h(Tree, { roots: P.st, sel, onSel, after, open, setOpen })),
      h('div', { className: 'panel' }, h(Detail, { id: sel, onSel, after }))));
}

/* ---------- 拆分前后对照：河段 → 去向模块 ---------- */
function ShiftView() {
  const [pick, setPick] = useState(null);
  const flows = {}; const leftT = {}; const rightT = {};
  const PLANN = D.nodes.filter(isPlan);
  const SPH = PHASES.concat(PLANN.length ? [{ k: 'plan', t: '方案新增（代码里还没有）', st: [] }] : []);
  for (const p of SPH) {
    const seen = new Set(p.k === 'plan' ? PLANN : []);
    for (const s of p.st) { seen.add(s); if (s.id !== 'route.handle') desc(s.id).forEach(d => seen.add(d)); }
    for (const n of seen) {
      const m = n.mod || 'route'; const key = p.k + '|' + m;
      (flows[key] = flows[key] || []).push(n); leftT[p.k] = (leftT[p.k] || 0) + 1; rightT[m] = (rightT[m] || 0) + 1;
    }
  }
  const total = Object.values(leftT).reduce((a, b) => a + b, 0);
  const W = 980, H = 640, LX = 210, RX = W - 300, BW = 14, GAPV = 8;
  const usable = H - 40 - GAPV * (SPH.length - 1), MINH = 26; let k = usable / total;
  for (let it = 0; it < 8; it++) { const sum = SPH.reduce((a, p) => a + Math.max(MINH, (leftT[p.k] || 0) * k), 0); if (sum <= usable) break; k *= usable / sum; }
  let y = 20; const L = {}; SPH.forEach(p => { const hh = (leftT[p.k] || 0) * k; L[p.k] = { y, h: hh, box: Math.max(MINH, hh), off: 0 }; y += L[p.k].box + GAPV; });
  const mods = MODS.filter(m => rightT[m]);
  const usableR = H - 40 - 14 * (mods.length - 1); const kr = usableR / total;
  y = 20; const R = {}; mods.forEach(m => { R[m] = { y, h: rightT[m] * kr, off: 0 }; y += R[m].h + 14; });
  const ribs = [];
  SPH.forEach(p => mods.forEach(m => {
    const f = flows[p.k + '|' + m]; if (!f) return;
    const hl = f.length * k, hr = f.length * kr;
    const y0 = L[p.k].y + L[p.k].off, y1 = R[m].y + R[m].off; L[p.k].off += hl; R[m].off += hr;
    const mx = (LX + BW + RX) / 2, key = p.k + '|' + m;
    const moved = f.filter(n => n.chg && n.chg !== '不动').length;
    ribs.push(h('g', { key, className: 'rib', onClick: () => setPick(key) },
      h('path', { d: `M${LX + BW},${y0} C${mx},${y0} ${mx},${y1} ${RX},${y1} L${RX},${y1 + hr} C${mx},${y1 + hr} ${mx},${y0 + hl} ${LX + BW},${y0 + hl} Z`,
        fill: v(MODC[m]), opacity: pick ? (pick === key ? .75 : .1) : (m === 'route' || m === 'lib' ? .18 : .45) }),
      h('title', null, `${SPH.find(x => x.k === p.k).t} → ${D.mods[m]}：${f.length} 个节点，其中 ${moved} 个要动`)));
  }));
  const pf = pick ? flows[pick] : null;
  return h('section', { className: 'view' },
    h('p', { className: 'intro' }, '左边是现在的执行顺序（和主河道同样的 11 段），最下面一条是方案里要新加、现在代码里还没有的节点。右边是按「只拆分、不新增冗余模块」拆完以后每段代码的去处。带子越宽，节点越多；灰色是留在 route.ts 和现有共享模块里的，llm.ts·chatReply 那条蓝带里也有很多是原地不动的，以右下角的改动量为准。点任意一条带子，下面列出具体是哪些函数、怎么动。'),
    h('div', { className: 'diagram' },
      h('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '拆分前后代码去向' },
        ribs,
        SPH.map(p => h('g', { key: p.k },
          h('rect', { x: LX, y: L[p.k].y, width: BW, height: Math.max(2, L[p.k].h), fill: v('--water'), rx: 2 }),
          h('text', { x: LX - 10, y: L[p.k].y + L[p.k].box / 2 - 2, textAnchor: 'end', fontSize: 12.5, fill: v('--ink') }, p.t),
          h('text', { x: LX - 10, y: L[p.k].y + L[p.k].box / 2 + 11, textAnchor: 'end', fontSize: 10, fill: v('--muted'), className: 'mono' }, leftT[p.k] + ' 节点'))),
        mods.map(m => h('g', { key: m },
          h('rect', { x: RX, y: R[m].y, width: BW, height: Math.max(2, R[m].h), fill: v(MODC[m]), rx: 2 }),
          h('text', { x: RX + BW + 10, y: R[m].y + Math.min(R[m].h / 2, 14) + 4, fontSize: 12.5, fill: v('--ink') }, short(D.mods[m], 26)),
          h('text', { x: RX + BW + 10, y: R[m].y + Math.min(R[m].h / 2, 14) + 18, fontSize: 10, fill: v('--muted'), className: 'mono' }, rightT[m] + ' 节点')))),
    ),
    h('div', { className: 'split' },
      h('div', { className: 'panel' },
        pf ? h(Fragment, null,
          h('h2', null, `${SPH.find(x => x.k === pick.split('|')[0]).t} → ${D.mods[pick.split('|')[1]]}`),
          h('div', { className: 'tree' }, pf.map(n => h('div', { key: n.id, className: 'tr' + (n.chg === '删除' ? ' del' : '') },
            h('span', null), h('span', { className: 'dot', style: { background: v(KCOL(n.kind)) } }),
            h('span', { className: 'nm', title: n.note || n.label }, n.label, h('small', null, href(n) ? h('a', { href: href(n), target: '_blank', rel: 'noopener', onClick: e => e.stopPropagation() }, loc(n)) : loc(n))),
            h('span', { className: 'badges' }, h('span', { className: 'chip', style: { color: v(CHGC[n.chg] || '--muted') } }, (n.chg || '').length > 6 ? '待确认' : n.chg))))))
        : h('p', { className: 'note' }, '点上面任意一条带子查看明细。')),
      h('div', { className: 'panel' }, h('h2', null, '每个去处的改动量'),
        h('div', { className: 'sum' }, mods.map(m => {
          const ns = Object.entries(flows).filter(([kk]) => kk.endsWith('|' + m)).flatMap(([, f]) => f);
          const by = {}; ns.forEach(n => by[n.chg] = (by[n.chg] || 0) + 1);
          return h('div', { key: m }, h('span', null, h('i', { className: 'dot', style: { background: v(MODC[m]), marginRight: 6 } }), D.mods[m]),
            h('b', null, Object.entries(by).map(([c, x]) => `${c.length > 6 ? '待确认' : c} ${x}`).join(' · ')));
        })))));
}

/* ---------- 其他入口与出口检查 ---------- */
function ExitView() {
  const [open, setOpen] = useState(null);
  const cats = ch('exits');
  const short5 = { release: '机构放行', storeFacts: '门店 / 事实', crossChannel: '跨渠道', outcomeStop: '成交流失停发', bannedWording: '禁用词' };
  const SYM = { wired: '●', exempt: '○', gap: '✕' };
  const gaps = cats.flatMap(c => ch(c.id)).filter(e => Object.values(e.gates || {}).includes('gap')).length;
  const nEx = cats.flatMap(c => ch(c.id)).length, nPassive = ch('exits.cat.被动回复').length;
  return h('section', { className: 'view' },
    h('p', { className: 'intro' }, `整个系统一共 ${nEx} 个出话点（有几个不直接发给客户：召回草稿生成器、销售手机上确认才发的草稿、客服联调回声、macOS 端上改写）。主河道覆盖的是其中「被动回复」这一类的 ${nPassive} 个出口。表里是每个出话点过没过那 ${D.gates.length} 道检查：● 接上了，○ 按设计豁免，✕ 缺口。有缺口的共 ${gaps} 个。点任意一行，展开它从出话到送达的每一步。`),
    h('div', { className: 'legend' }, h('span', { className: 'g-wired' }, '● 接上了'), h('span', { className: 'g-exempt' }, '○ 豁免'), h('span', { className: 'g-gap' }, '✕ 缺口')),
    h('div', { className: 'diagram', style: { padding: 12 } },
      h('table', null,
        h('thead', null, h('tr', null, h('th', null, '类别'), h('th', null, '出口'), D.gates.map(g => h('th', { key: g.id, title: g.label, style: { textAlign: 'center' } }, short5[g.id] || g.id)))),
        h('tbody', null, cats.flatMap(c => ch(c.id).map((e, i) => {
          const isOpen = open === e.id; const steps = ch(e.id);
          return h(Fragment, { key: e.id },
            h('tr', { className: 'ex' + (isOpen ? ' open' : ''), onClick: () => setOpen(isOpen ? null : e.id), tabIndex: 0, onKeyDown: ev => { if (ev.key === 'Enter') setOpen(isOpen ? null : e.id); } },
              h('td', { style: { color: v('--muted'), whiteSpace: 'nowrap' } }, i ? '' : c.label),
              h('td', null, (isOpen ? '− ' : '+ ') + e.label),
              D.gates.map(g => { const st = (e.gates || {})[g.id]; return h('td', { key: g.id, className: 'c g-' + st, title: (e.gateNotes || {})[g.id] || '' }, SYM[st] || '·'); })),
            isOpen ? h('tr', null, h('td', { colSpan: 2 + D.gates.length },
              h('div', { className: 'track' }, steps.flatMap((s, j) => [j ? h('span', { key: 'a' + j, className: 'arr' }, '→') : null,
                h('div', { key: s.id, className: 'stp', style: { borderLeftColor: v(KCOL(s.kind)) }, title: s.note || '' },
                  h('div', null, s.label), href(s) ? h('a', { className: 'mono', style: { fontSize: 11 }, href: href(s), target: '_blank', rel: 'noopener' }, loc(s)) : h('span', { className: 'mono sub' }, loc(s)))])),
              Object.entries(e.gateNotes || {}).filter(([g]) => (e.gates || {})[g] === 'gap').map(([g, t]) => h('p', { key: g, className: 'note g-gap' }, `✕ ${short5[g]}：${t}`)))) : null);
        }))))),
    h('div', { className: 'split' },
      h('div', { className: 'panel' }, h('h2', null, '读代码时顺带发现的问题'), h('ol', { className: 'findings' }, D.findings.map((f, i) => h('li', { key: i }, f)))),
      h('div', { className: 'panel' }, h('h2', null, '没有调用方的代码'), h('ol', { className: 'findings' }, D.deadCode.map((d, i) => h('li', { key: i }, h('b', { className: 'mono' }, d.fn), ` · ${d.lines || ''} · `, short(d.evidence, 160)))))));
}

function App() {
  const init = (() => { const t = (location.hash || '').slice(1); return ['river', 'shift', 'exits'].includes(t) ? t : 'river'; })();
  const [tab, setTab] = useState(init);
  const [after, setAfter] = useState(false);
  const go = t => { setTab(t); try { history.replaceState(null, '', '#' + t); } catch (e) {} };
  return h(Fragment, null,
    h('header', null,
      h('div', { className: 'row' },
        h('h1', null, '回复链路河流图'),
        h('span', { className: 'sub' }, 'wecom-chat @ ', h('a', { href: 'https://github.com/Akke-AI/wecom-chat/commit/' + D.sha, target: '_blank', rel: 'noopener' }, D.sha.slice(0, 8)), ` · ${D.nodes.length} 个节点 · 行号都指向这一版代码`)),
      h('div', { className: 'tabs', role: 'tablist' },
        [['river', '主河道 · 一条消息怎么走'], ['shift', '拆分前后 · 代码去哪'], ['exits', `${D.exits.length} 个出话点 × ${D.gates.length} 道检查`]].map(([k, t]) =>
          h('button', { key: k, role: 'tab', 'aria-pressed': tab === k, onClick: () => go(k) }, t)))),
    tab === 'river' ? h(MainView, { after, setAfter }) : tab === 'shift' ? h(ShiftView) : h(ExitView));
}
ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>
