<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>客户旅程 · 实时</title>
<!--
  单客户旅程页（对内）· 活壳页。

  用法: /akke/customer-journey.html?cid=<conversation_id>

  自己不存任何数据：CSS 和已渲染的 body 片段都由 /api/public/customer-journey 一起返回，
  样式的单一真相源在 Akke 仓库 src/lib/journey/render.ts。这页只负责取数 + 注入。
  所以客户后续再聊多少轮，刷新一下就是最新的 —— 不需要谁去手动重新生成。

  ⚠️ 对内页：含客户昵称、原话、抖音主页链接。noindex + 不做对外分享。
-->
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f5f7;color:#1a1a1a}
  .state{max-width:820px;margin:0 auto;padding:64px 24px;text-align:center;color:#6b7280;line-height:1.7}
  .state h1{font-size:19px;color:#1a1a1a;margin:0 0 10px}
  .state code{background:#eceff3;padding:2px 7px;border-radius:4px;font-size:13px}
  .state .err{color:#c0392b}
</style>
</head>
<body>
<div id="root">
  <div class="state"><h1>加载中…</h1></div>
</div>
<script>
(function () {
  var API = "https://akke.vercel.app/api/public/customer-journey";
  var root = document.getElementById("root");
  var cid = new URLSearchParams(location.search).get("cid") || "";

  function state(title, detail, isErr) {
    root.innerHTML =
      '<div class="state"><h1' + (isErr ? ' class="err"' : "") + ">" +
      title + "</h1><div>" + (detail || "") + "</div></div>";
  }

  if (!cid) {
    state("缺少 cid 参数", "地址里要带上对话 ID：<code>?cid=&lt;conversation_id&gt;</code>", true);
    return;
  }

  fetch(API + "?cid=" + encodeURIComponent(cid))
    .then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
    })
    .then(function (res) {
      if (!res.ok) {
        state(
          res.status === 404 ? "找不到这个对话" : "加载失败",
          (res.body && res.body.error) || ("HTTP " + res.status),
          true
        );
        return;
      }
      var b = res.body;
      // CSS 由 API 下发，跟 render.ts 同源，壳页不留副本。
      var st = document.createElement("style");
      st.textContent = b.css || "";
      document.head.appendChild(st);
      root.innerHTML = b.html || "";
      if (b.customerName) document.title = b.customerName + " · 客户旅程";
    })
    .catch(function (e) {
      state("加载失败", String(e && e.message ? e.message : e), true);
    });
})();
</script>
</body>
</html>
