<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="upio:date" content="2026-10-29">
<meta name="theme-color" content="#0e1620">
<meta name="description" content="upio.ai 网页小游戏：手机电脑打开就能玩。">
<title>飞盘小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥏</text></svg>">
<style>
  :root { --bg: #0e1620; --card: #152230; --ink: #e8eef5; --muted: #8fa1b3; --accent: #ffd33d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: calc(env(safe-area-inset-top) + 40px) 16px 40px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 800; }
  .lead { margin-top: 8px; color: var(--muted); font-size: 15px; }
  .games { margin-top: 28px; display: grid; gap: 14px; }
  a.game {
    display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 18px;
    transition: border-color .15s, transform .15s;
  }
  a.game:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icon { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .game h2 { font-size: 18px; font-weight: 800; }
  .game p { margin-top: 4px; font-size: 14px; line-height: 1.55; color: #c5d1dc; }
  .tag { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--accent); }
  .back { display: inline-block; margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>飞盘小游戏</h1>
  <p class="lead">手机、电脑打开就能玩，不用下载。</p>
  <div class="games">
    <a class="game" href="/play/ultimate-4v4">
      <div class="icon">🏟️</div>
      <div>
        <h2>4v4 飞盘 · 新手入门</h2>
        <p>5 关教学学会站位、传盘、开放侧和 10 秒计数，再和电脑打一场对抗赛。竖排、横排两种站位可选。</p>
        <span class="tag">点队友传盘 · 团队飞盘规则入门</span>
      </div>
    </a>
    <a class="game" href="/play/frisbee">
      <div class="icon">🐕</div>
      <div>
        <h2>飞盘狗</h2>
        <p>滑动扔飞盘，让狗狗接住。看风向、绕开树，扔得越远分越高。</p>
        <span class="tag">滑动扔盘 · 一局 10 盘</span>
      </div>
    </a>
  </div>
  <a class="back" href="/">← upio.ai</a>
</main>
</body>
</html>
